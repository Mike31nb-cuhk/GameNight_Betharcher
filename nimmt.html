<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>谁是牛头王 新手课</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>/* 字体后台加载：连不上 Google Fonts 时页面照样立刻显示（用系统字体） */(function(){var l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family=Lilita+One&family=ZCOOL+QingKe+HuangYou&display=swap";document.head.appendChild(l);})();</script>
<style>
:root{
  color-scheme: dark;
  --felt:#1b5741; --felt-2:#15493a; --felt-3:#0f3a2c; --felt-hi:#2a7556;
  --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.24);
  --on:#f6f3e8; --on-2:rgba(246,243,232,.80); --on-3:rgba(246,243,232,.58);
  --top:#241a4f; --top-2:#35286f; --top-line:#f7d335;
  --paper:#fbf8ef; --paper-2:#f2ecde; --paper-line:#dcd2bb;
  --ink:#221848; --ink-2:#554c77; --ink-3:#857e9f;
  --bull:#4b309f; --bull-deep:#2a1966;
  --face1:#ebe5fb; --face2:#86c3ef; --face3:#a6d65f; --face5:#e5473c; --face7:#f7cf2c;
  --pip1:#4b309f; --pip2:#1b6cb6; --pip3:#3a8a1b; --pip5:#cf2a1f; --pip7:#c98600;
  --back:#3a2885; --back-2:#2a1c66;
  --yellow:#f7d335; --yellow-2:#ffe680; --yellow-ink:#2b2000;
  --red:#e2402f; --red-2:#ff8b7d; --red-bg:rgba(226,64,47,.24);
  --amber:#ffb43d;
  --ok-bg:#e2f5e8; --ok-ink:#135a30; --bad-bg:#fde7e3; --bad-ink:#8a1c11; --note-bg:#e9ecfb; --note-ink:#2a2f73;
  --spd:1;
  --gut:max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
  --font-ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;
  --font-display:"ZCOOL QingKe HuangYou","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --font-num:"Lilita One","Arial Black","Arial Bold","PingFang SC","Microsoft YaHei",sans-serif;
  --low-ink:#2a1800;
  --ok-line:#2f9a5a;
  --tick:#3fb86b;
  --five-bg:#7a5a00;
  --btn-off:#8f8a76;
  --ready:#8fe3a8;
  --yellow-edge:#b8951a;
  --toggle-off:#bdb6a3;
  --btn-off-ink:#e6e2d4;
  --white:#fff;
  --crown-bg:#fff3bf;
  --win-bg:#fff6c9;
}
@media (prefers-reduced-motion: reduce){ :root{ --spd:0 !important; } }
*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html{ -webkit-text-size-adjust:100%; background:var(--felt-3); }
body{
  margin:0; min-height:100vh; color:var(--on); font:15px/1.6 var(--font-ui);
  background-color:var(--felt);
  background-image:
    radial-gradient(120% 70% at 50% 0%, rgba(255,255,255,.07), transparent 60%),
    radial-gradient(120% 80% at 50% 110%, rgba(0,0,0,.35), transparent 60%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 5px);
  background-attachment: fixed;
}
button{ font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
button:disabled{ cursor:default; }
:focus-visible{ outline:3px solid var(--yellow); outline-offset:2px; }
b, strong{ font-weight:700; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.num{ font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.top{ background:var(--top); border-bottom:3px solid var(--top-line); padding-top:env(safe-area-inset-top); }
.top-in{ max-width:1180px; margin:0 auto; padding:0 var(--gut); height:56px; display:flex; align-items:center; gap:10px; }
.back{ color:var(--on-2); text-decoration:none; font-size:14px; white-space:nowrap; min-height:40px; display:flex; align-items:center; padding-right:2px; }
.back:hover{ color:var(--on); }
.brand{ display:flex; align-items:center; gap:6px; min-width:0; flex:0 1 auto; overflow:hidden; }
.brand svg{ width:26px; height:26px; fill:var(--yellow); flex:none; }
.brand h1{ margin:0; font:400 23px/1 var(--font-display); color:var(--yellow); letter-spacing:.02em; white-space:nowrap; }
.brand h1 .pre{ display:inline; }
.brand small{ font:13px/1 var(--font-num); color:var(--on-3); letter-spacing:.02em; white-space:nowrap; }
.tabs{ margin-left:auto; display:flex; background:rgba(0,0,0,.28); border-radius:11px; padding:2px; gap:2px; }
.tabs button{ border:0; background:transparent; color:var(--on-2); min-width:46px; height:40px; padding:0 12px; border-radius:8px; font-size:15px; font-weight:600; white-space:nowrap; }
.tabs button[aria-selected="true"]{ background:var(--yellow); color:var(--yellow-ink); }
.set-wrap{ position:relative; }
.icon-btn{ width:40px; height:40px; border-radius:10px; border:1px solid var(--line-2); background:transparent; display:grid; place-items:center; }
.icon-btn svg{ width:20px; height:20px; stroke:var(--on); fill:none; stroke-width:2; stroke-linecap:round; }
.popover{ position:absolute; right:0; top:48px; z-index:40; width:250px; background:var(--paper); color:var(--ink); border-radius:12px; padding:14px; box-shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:light; }
.popover h4{ margin:0 0 8px; font-size:13px; color:var(--ink-2); font-weight:600; }
.popover .seg{ margin-bottom:12px; }
.back-wrap{ position:relative; flex:none; }
.leave-pop{ left:0; right:auto; width:236px; }
.leave-pop p{ margin:0 0 10px; font-size:14px; line-height:1.5; }
.leave-acts{ display:flex; gap:8px; }
.leave-acts .btn{ flex:1; padding:0 10px; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
.popover .btn.ghost{ color:var(--ink); border-color:var(--paper-line); }
.popover .linkish{ border:0; background:none; color:var(--ink-2); text-decoration:underline; padding:6px 0; font-size:13px; min-height:40px; }
@media (max-width:420px){
  .top-in{ gap:6px; }
  .brand small{ display:none; }
  .brand h1{ font-size:21px; }
  .brand h1 .pre{ display:none; }
  .tabs button{ padding:0 9px; min-width:44px; }
  .coach{ gap:7px; }
  .coach > .coach-ava{ width:34px; height:34px; }
  .coach > .coach-ava svg{ width:25px; height:25px; }
  .bubble{ font-size:14.5px; line-height:1.55; padding:8px 11px; }
}
@media (max-width:350px){
  .lesson-map ol{ gap:3px !important; }
  .lesson-map .lm-btn{ width:36px; height:36px; }
}
@media (max-width:385px){
  .brand svg{ display:none; }
  .top-in{ gap:5px; }
  .back{ font-size:13px; }
  .tabs button{ padding:0 7px; min-width:40px; font-size:14px; }
}

/* ---------- layout ---------- */
main{ max-width:1180px; margin:0 auto; padding:16px var(--gut) calc(24px + env(safe-area-inset-bottom)); }
/* in a game the sticky tray's resting place is the screen bottom, so scrolling to the end never shifts it */
body.in-game main{ padding-bottom:0; }
@media (min-width:600px){ body.in-game main{ padding-bottom:calc(8px + env(safe-area-inset-bottom)); } }
.panel-title{ font:400 26px/1.2 var(--font-display); margin:4px 0 12px; color:var(--yellow); letter-spacing:.02em; }
.paper{ background:var(--paper); color:var(--ink); border-radius:14px; box-shadow:0 2px 0 rgba(0,0,0,.18), 0 12px 28px rgba(0,0,0,.25); color-scheme:light; }

/* segmented + toggles + buttons */
.seg{ display:flex; background:var(--paper-2); border-radius:10px; padding:3px; gap:3px; }
.seg button{ flex:1; border:0; background:transparent; color:var(--ink-2); min-height:40px; border-radius:8px; font-weight:600; font-size:14px; padding:0 8px; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--white); }
.btn{ border:0; border-radius:12px; min-height:44px; padding:0 18px; font-weight:700; font-size:15px; }
.btn.primary{ background:var(--yellow); color:var(--yellow-ink); box-shadow:0 3px 0 var(--yellow-edge); }
.btn.primary:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--yellow-edge); }
.btn.primary:disabled{ background:var(--btn-off); color:var(--btn-off-ink); box-shadow:none; }
.btn.ghost{ background:transparent; color:var(--on); border:1.5px solid var(--line-2); }
.paper .btn.ghost{ color:var(--ink); border-color:var(--paper-line); }
.btn.big{ min-height:56px; font-size:18px; padding:0 28px; }
.btn.pulse{ animation:pulse calc(1400ms * var(--spd)) ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ box-shadow:0 3px 0 var(--yellow-edge), 0 0 0 0 rgba(247,211,53,.55);} 50%{ box-shadow:0 3px 0 var(--yellow-edge), 0 0 0 8px rgba(247,211,53,0);} }
.toggle{ display:inline-flex; align-items:center; gap:10px; border:0; background:none; padding:4px 0; min-height:40px; color:inherit; text-align:left; }
.toggle .knob{ flex:none; width:46px; height:28px; border-radius:14px; background:var(--toggle-off); position:relative; transition:background calc(160ms * var(--spd)); }
.toggle .knob::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--white); box-shadow:0 1px 3px rgba(0,0,0,.3); transition:left calc(160ms * var(--spd)); }
.toggle[aria-pressed="true"] .knob{ background:var(--felt); }
.toggle[aria-pressed="true"] .knob::after{ left:21px; }
.toggle:disabled{ opacity:.45; }

/* ---------- cards ---------- */
.card{
  --cw:56px; position:relative; flex:none; width:var(--cw); height:calc(var(--cw) * 1.38);
  font-size:calc(var(--cw) * .2); border-radius:calc(var(--cw) * .12); background:var(--white); color:var(--bull-deep);
  box-shadow:0 1px 0 rgba(0,0,0,.18), 0 3px 7px rgba(0,0,0,.28);
  display:flex; flex-direction:column; padding:.24em; gap:.16em; user-select:none; -webkit-user-select:none;
}
.c-top{ display:flex; align-items:flex-start; justify-content:space-between; height:1.5em; gap:.1em; }
.c-corner{ font:1.08em/1.05 var(--font-num); letter-spacing:-.02em; }
.c-heads{ display:flex; flex-wrap:wrap; justify-content:flex-end; align-content:flex-start; gap:0 .04em; max-width:3.1em; }
.c-heads svg{ width:.74em; height:.74em; fill:var(--pip); display:block; }
.c-heads.h5{ max-width:2.4em; } .c-heads.h7{ max-width:3.1em; }
.c-face{ flex:1; border-radius:.42em; background:var(--face); position:relative; display:grid; place-items:center; overflow:hidden; }
.c-bull{ position:absolute; left:3%; top:4%; width:94%; height:96%; fill:var(--bull); opacity:.95; }
.c-big{ position:relative; font:2.35em/1 var(--font-num); color:var(--white); letter-spacing:-.03em;
  -webkit-text-stroke:.1em var(--bull-deep); paint-order:stroke fill; text-shadow:0 .07em 0 var(--bull-deep); }
.card.n3 .c-big{ font-size:1.8em; }
.card.b1{ --face:var(--face1); --pip:var(--pip1); }
.card.b2{ --face:var(--face2); --pip:var(--pip2); }
.card.b3{ --face:var(--face3); --pip:var(--pip3); }
.card.b5{ --face:var(--face5); --pip:var(--pip5); }
.card.b7{ --face:var(--face7); --pip:var(--pip7); }
.card.b5 .c-bull, .card.b7 .c-bull{ fill:var(--bull-deep); }
.card.tiny .c-top{ display:none; }
.cback{ --cw:40px; width:var(--cw); height:calc(var(--cw) * 1.38); border-radius:calc(var(--cw) * .12); flex:none;
  background:var(--back); border:2px solid var(--white); box-shadow:0 2px 6px rgba(0,0,0,.3); display:grid; place-items:center; }
.cback svg{ width:62%; height:62%; fill:none; stroke:var(--yellow); stroke-width:6; opacity:.85; }
.cempty{ --cw:40px; width:var(--cw); height:calc(var(--cw) * 1.38); border-radius:calc(var(--cw) * .12); border:1.5px dashed var(--line-2); flex:none; }

/* ---------- rows (the hero) ---------- */
.rows{ --cw:40px; display:grid; grid-template-columns:minmax(0,1fr); gap:8px; min-width:0; width:fit-content; max-width:100%; margin-inline:auto; }
.row{ position:relative; display:grid; grid-template-columns:24px auto minmax(48px, 1fr); align-items:center; gap:6px;
  padding:6px; border-radius:12px; background:rgba(0,0,0,.16); border:1px solid var(--line); }
.row-no{ font:15px/1 var(--font-num); color:var(--on-3); text-align:center; }
.slots{ display:flex; gap:4px; }
.slot{ width:var(--cw); height:calc(var(--cw) * 1.38); border-radius:calc(var(--cw) * .12); border:1.5px dashed rgba(255,255,255,.16); flex:none; position:relative; }
.slot:has(.card){ border-color:transparent; }
.slot .card{ --cw:inherit; position:absolute; inset:-1.5px; width:var(--cw); }
.slot.s5:not(:has(.card)){ border-color:rgba(255,139,125,.38); }
.row-info{ justify-self:end; min-width:44px; display:flex; flex-direction:column; align-items:center; gap:1px; padding-right:2px; }
.ri-b{ font:22px/1 var(--font-num); color:var(--on); display:flex; align-items:center; gap:2px; }
.ri-b svg{ width:14px; height:14px; fill:var(--on-2); }
.ri-c{ font-size:12px; color:var(--on-3); font-variant-numeric:tabular-nums; }
.ri-c.warn{ color:var(--amber); font-weight:700; }
.ri-c.danger{ color:var(--white); background:var(--red); border-radius:6px; padding:0 6px; font-weight:700; }
.row.full{ border-color:rgba(226,64,47,.6); background:rgba(226,64,47,.12); }
.row.target{ border-color:var(--yellow); box-shadow:0 0 0 2px rgba(247,211,53,.45); }
.row.taking{ border-color:var(--red); background:var(--red-bg); box-shadow:0 0 0 3px rgba(226,64,47,.55); }
.row-hit{ position:absolute; inset:-1px; border-radius:12px; border:2px solid rgba(247,211,53,.0); background:transparent; display:flex; align-items:flex-end; justify-content:center; padding:0; }
.row-hit:hover{ border-color:rgba(247,211,53,.7); background:rgba(247,211,53,.06); }
.rows.ask .row{ border-color:rgba(247,211,53,.55); }
.rows.ask .row-hit{ animation:askGlow calc(1600ms * var(--spd)) ease-in-out infinite; }
@keyframes askGlow{ 0%,100%{ box-shadow:0 0 0 0 rgba(247,211,53,0);} 50%{ box-shadow:0 0 0 3px rgba(247,211,53,.45);} }
.cost{ position:absolute; right:6px; bottom:-9px; background:var(--paper); color:var(--ink); font-size:12px; font-weight:700; padding:1px 8px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.3); white-space:nowrap; z-index:2; }
.cost.cheap{ background:var(--yellow); color:var(--yellow-ink); }
.rows.ask{ gap:14px; }
.take-tag{ position:absolute; right:8px; top:50%; z-index:3; background:var(--red); color:var(--white); font-weight:800; font-size:14px; line-height:1.3; padding:4px 10px; border-radius:8px; white-space:nowrap; box-shadow:0 3px 10px rgba(0,0,0,.35); pointer-events:none;
  transform:translateY(-50%); animation:tagIn calc(260ms * var(--spd)) ease-out both; }
@keyframes tagIn{ from{ opacity:0; transform:translateY(-50%) scale(.7);} to{ opacity:1; transform:translateY(-50%) scale(1);} }

/* ---------- reveal strip / zone ---------- */
.zone{ background:rgba(0,0,0,.18); border:1px solid var(--line); border-radius:12px; padding:8px 10px 10px; }
.zone-label{ font-size:12px; color:var(--on-3); margin-bottom:6px; display:flex; justify-content:space-between; gap:8px; }
.reveal{ --cw:40px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
.rv{ display:flex; flex-direction:column; align-items:center; gap:3px; border:0; background:none; padding:0; color:inherit; }
.rv .card{ --cw:inherit; transition:transform calc(200ms * var(--spd)), opacity calc(200ms * var(--spd)); }
.rv-name{ font-size:11px; line-height:1.2; color:var(--on-2); max-width:calc(var(--cw) + 10px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rv.me .rv-name{ color:var(--yellow); font-weight:700; }
.rv.done{ opacity:.28; }
.rv.cur .card{ transform:translateY(-4px); box-shadow:0 0 0 3px var(--yellow), 0 6px 14px rgba(0,0,0,.35); }
button.rv{ min-width:40px; min-height:40px; border-radius:10px; }
button.rv:hover .card{ transform:translateY(-3px); }

/* ---------- hand ---------- */
.hand{ --cw:60px; --cols:5; display:grid; grid-template-columns:repeat(var(--cols), var(--cw)); justify-content:center; gap:14px 8px; }
.hcard{ position:relative; border:0; padding:0; background:none; border-radius:calc(var(--cw) * .12); transition:transform calc(160ms * var(--spd)); min-width:40px; }
.hcard .card{ --cw:inherit; }
.hcard:hover:not(:disabled) .card{ box-shadow:0 0 0 2px rgba(247,211,53,.6), 0 4px 10px rgba(0,0,0,.3); }
.hcard.sel{ transform:translateY(-8px); }
.hcard.sel .card{ box-shadow:0 0 0 3px var(--yellow), 0 8px 18px rgba(0,0,0,.4); }
.hcard:disabled .card{ filter:saturate(.85) brightness(.96); }
.hint{ position:absolute; left:50%; bottom:-12px; transform:translateX(-50%); font-size:11px; line-height:15px; padding:0 5px; border-radius:6px; background:rgba(0,0,0,.55); color:var(--on); white-space:nowrap; pointer-events:none; font-weight:600; }
.hint.danger{ background:var(--red); color:var(--white); }
.hint svg{ width:10px; height:10px; fill:currentColor; display:inline-block; vertical-align:-1px; margin-left:1px; }
.hint .dot{ display:inline-block; width:3px; height:3px; border-radius:50%; background:currentColor; vertical-align:middle; margin:0 2px; opacity:.85; }
.hand.tight .hint{ font-size:10.5px; padding:0 2px; letter-spacing:-.03em; }
.hand.tight .hint .dot{ margin:0 1px; }
.hand.snug .hint.danger .rw, .hand.snug .hint.danger .dot{ display:none; }   /* phone-size cards: the red label is 拿N🐂 (列N·拿N🐂 needs ~70px) */
.hint.low{ background:var(--amber); color:var(--low-ink); }
.hint.five{ background:var(--five-bg); color:var(--white); }

/* ---------- chips / scoreboard ---------- */
.sb-grid{ display:grid; gap:6px; grid-template-columns:repeat(var(--sbcols, 4), minmax(0, 1fr)); }
.chip{ position:relative; background:rgba(0,0,0,.2); border:1px solid var(--line); border-radius:10px; padding:4px 7px 5px; min-width:0; text-align:left; color:var(--on); }
.chip.me{ border-color:rgba(247,211,53,.7); background:rgba(247,211,53,.10); }
.chip-top{ display:flex; justify-content:space-between; align-items:center; gap:4px; min-height:17px; }
.chip-name{ flex:none; max-width:100%; font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chip-state{ min-width:0; overflow:hidden; font-size:11px; color:var(--on-3); white-space:nowrap; }
.chip-state.ready{ color:var(--ready); font-weight:700; }
.chip-state.think::after{ content:"…"; animation:dots calc(900ms * var(--spd)) steps(3) infinite; }
.sb-grid.narrow .chip-state .lbl{ display:none; }
.sb-grid.narrow .chip.has-round .chip-score .unit{ display:none; }
@keyframes dots{ 0%{ opacity:.3 } 50%{ opacity:1 } }
.chip-score{ display:flex; align-items:baseline; gap:4px; }
.chip-score b{ font:19px/1.05 var(--font-num); }
.chip-score .unit{ font-size:11px; color:var(--on-3); }
.chip-round{ font-size:11px; color:var(--red-2); font-weight:700; margin-left:auto; white-space:nowrap; }
.chip-bar{ height:4px; border-radius:2px; background:rgba(255,255,255,.12); margin-top:4px; overflow:hidden; }
.chip-bar i{ display:block; height:100%; background:var(--yellow); border-radius:2px; transition:width calc(500ms * var(--spd)); }
.chip-bar i.hot{ background:var(--red); }
button.chip{ min-height:52px; font:inherit; }
button.chip:hover{ border-color:var(--yellow); }
.floater{ position:absolute; left:50%; top:-10px; transform:translateX(-50%); background:var(--red); color:var(--white); font-weight:800; font-size:14px; padding:3px 9px; border-radius:8px; white-space:nowrap; pointer-events:none; z-index:30; box-shadow:0 3px 10px rgba(0,0,0,.35);
  animation:floatUp calc(1500ms * var(--spd)) ease-out forwards; }
@keyframes floatUp{ 0%{ opacity:0; transform:translate(-50%, 8px) scale(.8);} 15%{ opacity:1; transform:translate(-50%, 0) scale(1.08);} 75%{ opacity:1; } 100%{ opacity:0; transform:translate(-50%, -18px);} }

/* flying clones */
.flyer{ position:fixed !important; margin:0 !important; z-index:60; pointer-events:none; transform-origin:0 0; }

/* ---------- tutorial ---------- */
.learn{ display:grid; gap:14px; }
.lesson-map ol{ list-style:none; margin:0; padding:0; display:flex; gap:8px; justify-content:space-between; }
.lesson-map li{ flex:1; display:flex; justify-content:center; }
.lm-btn{ position:relative; width:40px; height:40px; border-radius:50%; border:2px solid var(--line-2); background:rgba(0,0,0,.18); color:var(--on-2); display:flex; align-items:center; justify-content:center; padding:0; }
.lm-btn .ln{ font:17px/1 var(--font-num); }
.lm-btn .lt{ display:none; }
.lm-btn .tick{ position:absolute; right:-4px; top:-4px; width:17px; height:17px; border-radius:50%; background:var(--tick); display:none; place-items:center; border:2px solid var(--felt); }

.lesson-head{ display:flex; align-items:baseline; gap:10px; margin:2px 0 10px; }

.stage{ display:grid; grid-template-columns:minmax(0,1fr); gap:12px; padding:12px; border-radius:16px; background:rgba(0,0,0,.12); border:1px solid var(--line); }
.stage > *{ transition:opacity calc(200ms * var(--spd)); }

.stage.focus-pick > :not(.st-pick):not(.btable), .stage.focus-buttons > :not(.st-deck),
.stage.focus-chips > :not(.st-chips):not(.sheet), .stage.focus-rows > .st-hand{ opacity:.5; }

.pickcard{ border:0; background:none; padding:0; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--on-2); border-radius:10px; }

.deckstack .cback:nth-child(1){ left:4px; top:4px; } .deckstack .cback:nth-child(2){ left:2px; top:2px; } .deckstack .cback:nth-child(3){ left:0; top:0; }
.options{ display:grid; gap:8px; }
.opt{ text-align:left; border:1.5px solid var(--paper-line); background:var(--paper); color:var(--ink); border-radius:12px; padding:10px 14px; min-height:46px; font-size:15px; line-height:1.45; color-scheme:light; }
.opt:hover{ border-color:var(--bull); }

.sheet table{ width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:14px; }
.sheet th, .sheet td{ padding:5px 6px; text-align:right; border-bottom:1px solid var(--paper-line); white-space:nowrap; }
.sheet th:first-child, .sheet td:first-child{ text-align:left; }

.tips{ display:grid; gap:10px; }

.realtable li::before{ content:counter(rt); position:absolute; left:12px; top:8px; font:800 20px/1.1 var(--font-num); font-synthesis:none; color:var(--yellow); width:22px; text-align:center; }

.recap ul{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px; }
.recap li{ font-size:13px; padding:4px 10px; border-radius:8px; background:rgba(0,0,0,.2); border:1px solid var(--line); color:var(--on); }
.lesson-ctrl{ position:sticky; bottom:0; z-index:15; margin-top:12px; padding:10px 0 calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(rgba(27,87,65,0), var(--felt) 18px); }
.ctrl-row{ display:flex; align-items:center; gap:8px; }

.shake{ animation:shake calc(380ms * var(--spd)); }
@keyframes shake{ 0%,100%{ transform:translateX(0);} 20%{ transform:translateX(-6px);} 40%{ transform:translateX(6px);} 60%{ transform:translateX(-4px);} 80%{ transform:translateX(3px);} }
.anim-deal .hcard{ animation:dealIn calc(420ms * var(--spd)) cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i, 0) * 55ms * var(--spd)); }
@keyframes dealIn{ from{ opacity:0; transform:translateY(-40px) rotate(-8deg) scale(.8);} to{ opacity:1; transform:none;} }
.anim-flip .slot .card, .anim-reveal .rv .card{ animation:flipIn calc(460ms * var(--spd)) ease-out both; animation-delay:calc(var(--i, 0) * 90ms * var(--spd)); }

/* ---------- 实战 ---------- */
.setup{ max-width:620px; margin:0 auto; padding:18px 18px 20px; }
.setup h2{ margin:0 0 4px; font:400 26px/1.2 var(--font-display); color:var(--ink); }

.setup .go .btn{ flex:1; }

.quit-bar .mini-btn{ color:var(--ink); border-color:var(--paper-line); }
.quit-bar .mini-btn.danger{ background:var(--red); border-color:var(--red); color:var(--white); }
.g-grid{ display:grid; gap:12px; }
.g-main{ display:grid; grid-template-columns:minmax(0,1fr); gap:12px; min-width:0; }
.g-main > *, .stage > *, .learn > *, .g-grid > *{ min-width:0; }
.coachline{ position:relative; display:flex; gap:9px; align-items:flex-start; background:var(--paper); color:var(--ink); border-radius:12px; padding:7px 12px; font-size:13.5px; line-height:1.5; color-scheme:light; }

  display:flex; align-items:flex-end; justify-content:flex-end; background:linear-gradient(90deg, rgba(251,248,239,0), var(--paper) 22px) right bottom / 100% 26px no-repeat; }

  background:rgba(13,50,38,.97); border-top:1px solid var(--line-2); border-radius:16px 16px 0 0; box-shadow:0 -10px 24px rgba(0,0,0,.28); }

.tray-head .btn{ min-width:96px; flex:none; }

.tray-body{ display:grid; grid-template-columns:minmax(0,1fr); align-content:start; }

.reveal-box .zone-label{ justify-content:center; }
.hand[hidden], .reveal-box[hidden]{ display:none; }

.round-sheet{ width:min(520px, 100%); max-height:calc(100vh - 32px); overflow:auto; padding:18px; }

.result .crown div{ font:400 24px/1.25 var(--font-display); color:var(--ink); }
.result .crown small{ display:block; font:13px/1.4 var(--font-ui); color:var(--ink-2); }
.tbl-outer{ position:relative; margin-bottom:14px; }
.tbl-wrap{ overflow-x:auto; }

.res-table{ width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:14px; }

<script>
(function () {
'use strict';
var E = window.NimmtEngine;
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
function without(arr) { var rm = Array.prototype.slice.call(arguments, 1); return arr.filter(function (x) { return rm.indexOf(x) === -1; }); }
function last(r) { return r[r.length - 1]; }

/* ================= storage (wrapped: page must work with storage blocked) ================= */
var KEY = 'nimmt.v1';
function loadPrefs() { try { var v = JSON.parse(localStorage.getItem(KEY)); return v && typeof v === 'object' ? v : {}; } catch (e) { return {}; } }
var prefs = Object.assign({ done: [], finished: false, games: 0, speed: 1 }, loadPrefs());
if (!Array.isArray(prefs.done)) prefs.done = [];
function savePrefs() { try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch (e) { /* storage blocked: fine */ } }

/* ================= timing ================= */
var T = { user: [0.5, 1, 1.6].indexOf(+prefs.speed) >= 0 ? +prefs.speed : 1, debug: null };
var RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
function factor() { return T.debug !== null ? T.debug : T.user; }
function applySpeed() { document.documentElement.style.setProperty('--spd', String(factor())); }
function wait(ms) { var d = ms * factor(); return d <= 0 ? Promise.resolve() : new Promise(function (r) { setTimeout(r, d); }); }
function animMs(ms) { return RM.matches ? 0 : ms * factor(); }
applySpeed();

/* ================= double-tap guard: a second tap on the same spot within 400ms of an accepted action is ignored ===
   (so a double tap can never skip a step, answer the next question or act on the next screen).
   Off at GameDebug.setSpeed(0) so scripts can drive the page at full speed. */
// The guard only applies to a tap at (about) the same spot as the last accepted one: a double tap lands where the
// next screen's button may now be, but a quick tap on a different control (手牌 then 出牌) is a real intent.
// Keyboard activations (no recent pointerdown) fall back to "same focused control".
var TAP = { t: 0, x: null, y: null, el: null };
var PTR = { x: 0, y: 0, t: 0 };
document.addEventListener('pointerdown', function (e) { PTR.x = e.clientX; PTR.y = e.clientY; PTR.t = Date.now(); }, true);
function tapPos() { return Date.now() - PTR.t < 1000 ? { x: PTR.x, y: PTR.y } : null; }
function guardMs() { return T.debug === 0 ? 0 : 400; }
function canTap() {
  if (Date.now() - TAP.t >= guardMs()) return true;
  var p = tapPos();
  if (p && TAP.x !== null) return Math.abs(p.x - TAP.x) > 40 || Math.abs(p.y - TAP.y) > 40;
  return document.activeElement !== TAP.el;
}
function took() {
  if (!guardMs()) return;
  var p = tapPos();
  TAP.t = Date.now(); TAP.x = p ? p.x : null; TAP.y = p ? p.y : null; TAP.el = document.activeElement;
}
function tapOnce() { if (!canTap()) return false; took(); return true; }
// switches (设置, 放弃, 解说, 更多, ← 大厅, setup toggles): a double tap toggles once. Per switch, so a quick tap on
// another control right after (e.g. 设置 just after 出牌) still works; the tail of a screen change is still ignored.
function toggleOnce(el) {
  if (!canTap()) return false;
  var t = Date.now();
  if (t - (el._tapT || 0) < guardMs()) return false;
  el._tapT = t; return true;
}

/* ================= 实战 pause: nothing in 实战 runs while you are on 教程/速查 or the browser tab is hidden =================
   gwait() counts only time while 实战 is on screen; flying cards are fast-forwarded when 实战 goes away,
   so the game stops at the next step and resumes from exactly there. */
var PZ = { on: false, waiters: [], anims: [] };
// also paused while the page asks 放弃这一局？/ 接着打还是放弃？/ 回大厅？ — the game must not move (or scroll the question away)
function asking() { return !!G.quitAsk || !$('#leavePop').hidden; }
function playVisible() { return currentTab === 'play' && !document.hidden && !asking(); }
function gwait(ms) {
  return new Promise(function (res) {
    var w = { left: Math.max(0, ms * factor()), t0: 0, timer: null, res: res };
    PZ.waiters.push(w);
    if (!PZ.on) runW(w);
  });
}
function runW(w) {
  if (w.left <= 0) { doneW(w); return; }
  w.t0 = Date.now();
  w.timer = setTimeout(function () { w.timer = null; doneW(w); }, w.left);
}
function doneW(w) { var i = PZ.waiters.indexOf(w); if (i >= 0) PZ.waiters.splice(i, 1); w.res(); }
function syncPause() {
  var on = !playVisible();
  if (on === PZ.on) return;
  PZ.on = on;
  if (on) {
    PZ.waiters.forEach(function (w) { if (w.timer) { clearTimeout(w.timer); w.timer = null; w.left = Math.max(0, w.left - (Date.now() - w.t0)); } });
    PZ.anims.slice().forEach(function (a) { try { a.finish(); } catch (e) { /* already gone */ } });
  } else {
    PZ.waiters.slice().forEach(runW);
  }
}
document.addEventListener('visibilitychange', function () { syncPause(); if (!PZ.on && currentTab === 'play') refreshPlay(); });

/* ================= rendering helpers ================= */
var ICON = '<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#bull"/></svg>';
function cardHTML(n, cls) {
  var b = E.bulls(n), heads = '';
  for (var i = 0; i < b; i++) heads += ICON;
  return '<div class="card b' + b + (n >= 100 ? ' n3' : '') + (cls ? ' ' + cls : '') + '" data-n="' + n + '">' +
    '<div class="c-top"><span class="c-corner">' + n + '</span><span class="c-heads h' + b + '">' + heads + '</span></div>' +
    '<div class="c-face"><svg class="c-bull" viewBox="0 0 100 100" aria-hidden="true"><use href="#bull"/></svg><span class="c-big">' + n + '</span></div></div>';
}
function backHTML() { return '<div class="cback"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#bull-line"/></svg></div>'; }
function rowsHTML(rows, o) {
  o = o || {};
  return rows.map(function (r, i) {
    var b = E.rowBulls(r), full = r.length >= 5, slots = '';
    // bare: only the cards, no empty slots and no x/5 count (a quiz about the 5-card limit must not show it)
    for (var k = 0; k < (o.bare ? r.length : 5); k++) slots += '<div class="slot' + (k === 4 ? ' s5' : '') + '">' + (r[k] !== undefined ? cardHTML(r[k]) : '') + '</div>';
    var cnt = o.bare ? '' : full ? '<span class="ri-c danger">满5</span>' : '<span class="ri-c' + (r.length === 4 ? ' warn' : '') + '">' + r.length + '/5</span>';
    var hit = '', least = o.cost && !o.noLeast && b === o.minB;       // every 列 tied for the fewest 牛头 gets the tag
    if (o.hit) {
      hit = '<button class="row-hit" data-row="' + i + '" aria-label="第' + (i + 1) + '列：' + r.join('、') + '，' + b + '个牛头' + (full ? '，已满' : '') + (least ? '，最少' : '') + '">' +
        (o.cost ? '<span class="cost' + (least ? ' cheap' : '') + '">拿走' + b + '牛头' + (least ? '·最少' : '') + '</span>' : '') + '</button>';
    }
    return '<div class="row' + (full ? ' full' : '') + (o.target === i ? ' target' : '') + '" data-row="' + i + '" style="--i:' + i + '">' +
      '<div class="row-no" aria-hidden="true">' + (i + 1) + '</div><div class="slots">' + slots + '</div>' +
      '<div class="row-info"><span class="ri-b">' + b + ICON + '</span>' + cnt + '</div>' + hit + '</div>';
  }).join('');
}
function minBulls(rows) { return Math.min.apply(null, rows.map(E.rowBulls)); }
function handHTML(cards, o) {
  o = o || {};
  return cards.map(function (n, i) {
    var h = o.hints && o.hints[n] ? '<span class="hint ' + o.hints[n].cls + '">' + o.hints[n].t + '</span>' : '';
    return '<button class="hcard' + (o.sel === n ? ' sel' : '') + '" data-hand="' + n + '" style="--i:' + i + '"' + (o.disabled ? ' disabled' : '') +
      ' aria-label="' + n + '，' + E.bulls(n) + '个牛头' + (o.hints && o.hints[n] ? '，' + o.hints[n].aria : '') + '"' + (o.sel === n ? ' aria-pressed="true"' : '') + '>' + cardHTML(n) + h + '</button>';

  if (mode === 'land') {
    H = window.innerHeight - 16;
    var colW = $('.g-main').clientWidth - $('#tray').offsetWidth - 14;   // 列 share the width with the hand column
    cap = Math.min(rowsCwFor(H), Math.floor((colW - 114) / 5));
  } else {
    H = window.innerHeight - trayH - trayGap() - 12 - coachH;
    if (mode === 'stack') { var chipsH = $('#scoreboard').offsetHeight + 12; if (rowsCwFor(H - chipsH) >= 40) H -= chipsH; }
    cap = rowsCwFor(H);
  }
  rows.setAttribute('data-hcap', Math.max(30, cap));
}
function sizeGame() {
  if (!G.state || $('#gameView').hidden || currentTab !== 'play') return;
  sizeCards($('.g-main'));          // width first: a too-wide 列 would make a phone zoom out and misreport its height
  sizeCards($('#tray'));            // hand / revealed cards: they set the tray height
  fitRows();
  sizeCards($('.g-main'));
}
// scroll so the 列 (plus the coach line and the scoreboard, when they fit too) sit between the top and the tray
function ensureGameView(smooth) {
  if (currentTab !== 'play' || document.hidden || asking()) return;   // never scroll a question off the screen
  var rows = $('#rows'), mode = layoutMode(), tray = $('#tray');
  if ($('#gameView').hidden || rows.hidden || !rows.offsetHeight) return;
  var extra = rows.classList.contains('ask') ? 10 : 0;
  var tops = mode === 'land' ? [$('.g-main')] : mode === 'stack' ? [$('#scoreboard'), $('#coachline'), rows] : [$('#coachline'), rows];
  tops = tops.filter(function (e) { return e && !e.hidden && e.offsetHeight; });
  var room = (mode === 'land' ? window.innerHeight : window.innerHeight - tray.offsetHeight - trayGap()) - 12;
  var rb = rows.getBoundingClientRect().bottom + extra, topEl = rows;
  for (var i = 0; i < tops.length; i++) { if (rb - tops[i].getBoundingClientRect().top <= room) { topEl = tops[i]; break; } }
  scrollIntoBand(function () { return { top: topEl.getBoundingClientRect().top, bottom: rows.getBoundingClientRect().bottom + extra }; },
    function () { return { top: 4, bottom: mode === 'land' ? window.innerHeight - 4 : tray.getBoundingClientRect().top - 6 }; }, smooth);
}

/* ---------- round end / result ---------- */
function closeOverlay() { var o = $('#overlay'); o.hidden = true; o.innerHTML = ''; }
function showRoundSheet() {
  var s = G.state, c = s.config;
  var rows = s.players.map(function (p, i) { return { i: i, name: p.isBot ? p.name : '你', r: p.history[p.history.length - 1], t: p.total, me: !p.isBot }; })
    .sort(function (a, b) { return a.t - b.t; });
  var maxT = Math.max.apply(null, rows.map(function (x) { return x.t; }));
  var scale = c.endMode === 'target' ? c.target : Math.max(66, maxT);     // same scale as the scoreboard bars
  var worst = rows.slice().sort(function (a, b) { return b.r - a.r; })[0];
  var line = worst.r > 0 ? '这一回合拿得最多：' + worst.name + '+' + worst.r + '。' : '';
  var next = c.endMode === 'target' ? '还没人到' + c.target + '：' + E.deckSizeFor(c) + '张牌全部重洗，开始第' + (s.round + 1) + '回合。' : '共' + c.rounds + '回合，接着打第' + (s.round + 1) + '回合。';
  var o = $('#overlay');
  o.innerHTML = '<div class="sheet-back"><div class="round-sheet paper" role="dialog" aria-modal="true" aria-labelledby="rsTitle">' +
    '<h3 id="rsTitle">第<span class="dn">' + s.round + '</span>回合结束</h3><p>' + line + next + '</p>' +
    '<table class="rs-table"><thead><tr><th>玩家</th><th>本回合</th><th>累计</th><th class="bar"><span class="sr">进度</span></th></tr></thead><tbody>' +
    rows.map(function (x) { var pct = Math.min(100, Math.round(x.t / scale * 100)); return '<tr' + (x.me ? ' class="me"' : '') + '><td>' + esc(x.name) + '</td><td class="' + (x.r ? 'plus' : '') + '">+' + x.r + '</td><td>' + x.t + '</td><td class="bar"><div><i class="' + (pct >= 85 ? 'hot' : '') + '" style="width:' + pct + '%"></i></div></td></tr>'; }).join('') +
    '</tbody></table><button class="btn primary big" id="roundNext">开始第' + (s.round + 1) + '回合</button></div></div>';
  o.hidden = currentTab !== 'play';                  // never over 教程/速查 (showTab brings it back on 实战)
  $('#roundNext').addEventListener('click', function () { if (G.waiting === 'nextRound' && tapOnce()) G.resolver(); });
  setTimeout(function () { var b = $('#roundNext'); if (b && currentTab === 'play') b.focus({ preventScroll: true }); }, 30);
}
function showResult() {
  var s = G.state, c = s.config;
  var res = E.results(s);
  var nm = function (i) { return s.players[i].isBot ? s.players[i].name : '你'; };
  var winners = s.winners.map(nm);
  var youWin = s.winners.indexOf(0) >= 0;
  var head = youWin ? (winners.length > 1 ? '你和' + winners.filter(function (n) { return n !== '你'; }).join('、') + '并列第一！' : '你赢了！')
    : (winners.length > 1 ? winners.join('、') + '并列第一' : winners[0] + '赢了');
  var reason = s.endReason.type === 'target'
    ? s.endReason.who.map(nm).join('、') + '累计到' + s.endReason.who.map(function (i) { return s.players[i].total; }).join('、') + '牛头（≥' + c.target + '），游戏在第' + s.round + '回合后结束。'
    : '打满' + c.rounds + '回合，游戏结束。';
  // 合计 comes right after the name and the first three columns stay put: the total is never cut off on a phone
  var th = '<tr><th>名次</th><th>玩家</th><th>合计</th>';
  for (var r = 0; r < s.round; r++) th += '<th class="rd">回合' + (r + 1) + '</th>';
  th += '</tr>';
  var body = res.map(function (x) {
    var tds = x.history.map(function (h) { return '<td>' + h + '</td>'; }).join('');
    return '<tr class="' + (x.rank === 1 ? 'win ' : '') + (x.isBot ? '' : 'me') + '"><td>' + x.rank + '</td><td>' + esc(x.isBot ? x.name : '你') + '</td><td class="tot">' + x.total + '</td>' + tds + '</tr>';
  }).join('');
  var me = res.filter(function (x) { return !x.isBot; })[0];
  var sub = youWin ? '牛头最少就是赢家。' : '你排第' + me.rank + '，' + me.total + '个牛头。牛头最少的人赢。';
  $('#resultView').innerHTML = '<h2>游戏结束</h2><p>' + reason + '</p>' +
    '<div class="crown"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#bull"/></svg><div>' + esc(head) + '<small>' + sub + '</small></div></div>' +
    '<div class="tbl-outer"><div class="tbl-wrap"><table class="res-table"><thead>' + th + '</thead><tbody>' + body + '</tbody></table></div></div>' +
    '<div class="acts"><button class="btn primary big" id="againBtn">再来一局</button><button class="btn ghost big" id="setupBtn">改设置</button></div>';
  showView('result');
  if (currentTab === 'play') window.scrollTo({ top: 0 });   // never yank another tab's scroll position
  // more 回合 columns than fit: a fade on the right says the table scrolls sideways
  var tw = $('#resultView .tbl-wrap'), more = function () { tw.parentNode.classList.toggle('more', tw.scrollLeft + tw.clientWidth < tw.scrollWidth - 2); };
  tw.addEventListener('scroll', more); more();
  $('#againBtn').addEventListener('click', function () { if (!tapOnce()) return; var o = Object.assign({}, G.lastOpts, { coach: G.coach }); startGame(o); });
  $('#setupBtn').addEventListener('click', function () { if (!tapOnce()) return; showView('setup'); window.scrollTo({ top: 0 }); });
  if (currentTab === 'play') $('#againBtn').focus({ preventScroll: true });
}

/* =====================================================================================
   速查
   ===================================================================================== */
function renderRef() {
  var vals = [7, 15, 30, 44, 55].map(function (n) {
    var lab = { 7: '其余', 15: '个位是5', 30: '10的倍数', 44: '11的倍数', 55: '只有55' }[n];
    var cnt = { 7: '76张', 15: '9张', 30: '10张', 44: '8张', 55: '1张' }[n];
    return '<div>' + cardHTML(n) + '<b>' + E.bulls(n) + '牛头</b>' + lab + '<br>' + cnt + '</div>';
  }).join('');
  var det = function (title, sub, body, cls) {
    return '<details class="paper' + (cls ? ' ' + cls : '') + '"><summary>' + title + (sub ? '<small>' + sub + '</small>' : '') + '</summary><div class="dbody">' + body + '</div></details>';
  };
  // phone order (H7): 开局步骤 → the rules looked up during play → 牛头 values → the rarely needed parts, closed
  $('#refSheet').innerHTML =
    '<div class="paper"><h3>开局步骤</h3><p class="lead">目标：<b>牛头越少越好</b>。2–10人，约45分钟。</p><ol class="steps">' +
      '<li>洗匀104张，每人发<b>10张</b>，手牌自己按大小理好。</li>' +
      '<li>再翻<b>4张</b>各开一列（说明书的「排四行」就是这4列），每列最多<b>5张</b>。</li>' +
      '<li>每轮各选1张<b>扣在面前</b>，都扣好后<b>一起翻开</b>。</li>' +
      '<li>从<b>最小的牌</b>开始，<b>谁的牌谁自己放</b>（规则见下）。</li>' +
      '<li>10轮 = 1回合。回合结束各自数牛头，<b>一人用纸笔记分</b>。</li></ol>' +
      '<p class="webdiff">网页替你理牌、放牌、数牛头；实体桌上自己来。</p></div>' +
    '<div class="paper"><h3>四条规则</h3>' +
      '<div class="rule"><span class="rn">规则1</span><p><b>「由小至大」</b>每列从左到右越来越大。</p></div>' +
      '<div class="rule"><span class="rn">规则2</span><p><b>「差异最小」</b>放到「最后一张比它小、差得最少」的那一列。例：37和43都比44小，44去43后面。</p></div>' +
      '<div class="rule r3"><span class="rn">规则3</span><p><b>「满列」</b>你的牌要成为某列的<b>第6张</b> → 拿走那5张，你的牌当这一列的第一张。</p></div>' +
      '<div class="rule r4"><span class="rn">规则4</span><p><b>「最小的牌」</b>你的牌比每列的最后一张都小 → <b>任选一列</b>全部拿走，你的牌当这一列的第一张。提示：通常拿牛头最少的那列。</p></div>' +
    '</div>' +
    '<div class="paper"><h3>拿牌 · 回合结束 · 游戏结束</h3><ul class="end">' +
      '<li>拿走的牌面朝下放在面前（<b>牛头堆</b>），不进手牌。</li>' +
      '<li>10张手牌出完 = 回合结束：数牛头、记分，104张重洗重发，重开4列。</li>' +
      '<li>有人累计<b>66或以上</b> → 打完那一回合就结束，<b>牛头最少的人赢</b>（也可以开局前约好别的目标或回合数）。</li></ul></div>' +
    '<div class="paper"><h3>牛头对照（104张，共171个牛头）</h3><div class="vals">' + vals + '</div></div>' +
    det('小贴士', '', '<ul>' +
      '<li>说明书：出太小的牌要拿一列时，通常拿牛头最少的那列。</li>' +
      '<li>中间的牌留着灵活用：40–70这种牌能接的列多。</li>' +
      '<li>差得越少越安全：某列最后一张是43、还没满，你出44，没有牌能插到你前面。</li>' +
      '<li>盯紧4张、5张的列：第6张要拿牌。</li>' +
      '<li>小牌是「逃生口」：趁某列便宜时主动拿掉它。</li>' +
      '<li>你看到的牌桌，轮到你放时可能已经变了——比你小的牌先放。</li></ul>') +
    det('进阶规则', '2–6人，可选', '<p><b>1. 数字全公开：</b>只用1到「人数×10+4」号的牌，其余移出。</p>' +
      '<table class="adv-t"><tr><th>人数</th><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr><tr><th>用牌</th><td>1–24</td><td>1–34</td><td>1–44</td><td>1–54</td><td>1–64</td></tr></table>' +
      '<p style="margin-top:8px"><b>2. 自己选手牌：</b>这些牌正面朝上围成一圈，大家轮流拿1张，直到每人10张；剩下4张开四列。其余规则不变。</p>') +
    det('说明书没写清楚的地方', '', '<ul>' +
      '<li><span class="tag">规则4何时选</span>说明书没写清楚，这里按官方规则：所有牌翻开之后、轮到你这张牌放置时才选列（它一定是这一轮最小的，所以第一个放）。</li>' +
      '<li><span class="tag">66</span>「66个牛头以上」包括正好66（官方规则：66或更多）。</li>' +
      '<li><span class="tag">平手</span>说明书没写最后牛头一样多怎么办，网页版算并列获胜。</li>' +
      '<li><span class="tag">进阶规则</span>说明书的进阶规则是两条一起用；网页版把「自己选手牌」（选牌）做成可以单独打开的选项。</li>' +
      '<li><span class="tag">选牌顺序</span>进阶规则没写谁先拿，网页版每回合轮换第一个选牌的人。</li>' +
      '<li><span class="tag">机器人</span>网页里机器人按规则4拿列时选牛头最少的（一样多就选张数少的）。</li></ul>', 'foot');
}
// a double tap on a 速查 heading opens it once (never open-and-close)
$('#refSheet').addEventListener('click', function (e) {
  var sm = e.target.closest && e.target.closest('summary');
  if (sm && !toggleOnce(sm)) e.preventDefault();
});

/* =====================================================================================
   debug hook (for automated play-through; normal users never see it)
   ===================================================================================== */
window.GameDebug = {
  setSpeed: function (f) { T.debug = (f === null || f === undefined) ? null : +f; applySpeed(); },
  getState: function () { return G.state ? clone(G.state) : null; },
  lesson: function (i) { showTab('learn'); openLesson((i || 1) - 1, 0); return { lesson: TUT.li + 1, steps: LESSONS[TUT.li].steps.length }; },
  lessons: function () { return LESSONS.map(function (L, i) { return { n: i + 1, title: L.title, steps: L.steps.length }; }); },
  tut: function () {
    var S = curStep(), t = S.task;
    return { lesson: TUT.li + 1, step: TUT.si + 1, steps: LESSONS[TUT.li].steps.length, lessons: LESSONS.length,
      kind: t ? t.kind : null, answer: t ? t.answer : null, done: TUT.done, busy: TUT.busy,
      legal: !!(t && t.legal), order: S.scene.order || null };
  },
  tab: function (n) { showTab(n); },
  newGame: function (o) { showTab('play'); startGame(Object.assign({ numPlayers: 4, endMode: 'target', target: 66, coach: true }, o || {})); },
  ui: function () { return { view: G.view, waiting: G.waiting, phase: G.state ? G.state.phase : null, round: G.state ? G.state.round : 0, turn: G.state ? G.state.turn : 0 }; },
  prefs: function () { return clone(prefs); },
  paused: function () { return PZ.on; },
  layout: function () { return { mode: layoutMode(), trayMax: G.trayMax, tray: $('#tray').offsetHeight, hcap: +$('#rows').getAttribute('data-hcap'), handCap: handCap() }; }
};

/* ================= boot ================= */
renderRef();
renderLessonMap();
var firstUndone = 0;
while (prefs.done.indexOf(firstUndone) >= 0 && firstUndone < LESSONS.length - 1) firstUndone++;
TUT.li = prefs.finished ? 0 : firstUndone;
renderStep(false, null, true);
renderLessonMap();
if (prefs.finished) { showTab('play'); showView('setup'); } else { showTab('learn'); }
})();
</script>
