<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>嗒宝 Dobble 新手课</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>/* 字体后台加载：连不上 Google Fonts 时页面照样立刻显示（用系统字体） */(function(){var l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+SC:wght@900&display=swap";document.head.appendChild(l);})();</script>
<style>
/* 嗒宝 Dobble — "the yellow-rimmed tin": deep grape tin interior, white round cards as the hero,
   tin-yellow rims and arcade buttons, a red that matches the booklet's arrows. One fixed look. */
:root {
  color-scheme: dark;
  --bg: #26124a;
  --bg-deep: #1a0b35;
  --panel: #331a60;
  --panel-2: #42246f;
  --line: rgba(255, 255, 255, .15);
  --text: #fbf7ff;
  --muted: #cbbdee;
  --yellow: #ffd23f;
  --yellow-2: #e0ad00;
  --yellow-ink: #3a2800;
  --red: #ff4d6d;
  --red-ink: #c4163a;
  --green: #35d49a;
  --green-ink: #0b7a52;
  --ice: #9be7ff;
  --ice-ink: #06324a;
  --card: #ffffff;
  --card-edge: #e3dcef;
  --card-layer: #ece6f6;
  --ink: #26124a;
  --anim: 1;
  --font-display: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --font-num: "Bungee", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", sans-serif;
  --gut: 16px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(rgba(255, 255, 255, .055) 1.4px, transparent 1.6px);
  background-size: 22px 22px;
  color: var(--text);
  font: 15px/1.55 var(--font-body);
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh; overflow: hidden;
  padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
a { color: var(--yellow); }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.topbar {
  flex: none; display: flex; align-items: center; gap: 6px;
  padding: calc(4px + env(safe-area-inset-top)) 12px 4px;
  background: var(--bg-deep); border-bottom: 3px solid var(--yellow);
  position: relative; z-index: 20;
}
.back { display: flex; align-items: center; min-height: 44px; padding: 0 6px 0 2px; text-decoration: none; font-weight: 700; white-space: nowrap; color: var(--yellow); }
.brand { font: 900 24px/1 var(--font-display); letter-spacing: .02em; white-space: nowrap; margin: 0 2px; }
.brand small { font: 13px/1 var(--font-num); color: var(--yellow); margin-left: 4px; letter-spacing: .04em; }
.tabs { margin-left: auto; display: flex; background: rgba(255, 255, 255, .08); border-radius: 999px; padding: 3px; }
.tab { border: 0; background: transparent; min-height: 40px; min-width: 46px; padding: 0 11px; border-radius: 999px; color: var(--muted); font-weight: 700; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--yellow); color: var(--ink); }
.gear { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; cursor: pointer; }
.gear svg { width: 22px; height: 22px; }
.pop {
  position: absolute; right: 10px; top: calc(100% + 6px); width: min(320px, calc(100vw - 20px));
  background: var(--panel); border: 2px solid var(--yellow); border-radius: 14px; padding: 12px 14px 14px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .45); z-index: 30;
}
.pop h3 { margin: 4px 0 6px; font: 15px var(--font-body); font-weight: 700; color: var(--muted); }
.pop p { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
@media (max-width: 400px) { .brand small { display: none; } .tab { padding: 0 9px; } }
@media (max-width: 352px) { .brand { display: none; } }

/* segmented controls */
.seg { display: flex; background: rgba(0, 0, 0, .25); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 700; cursor: pointer; padding: 0 8px; white-space: nowrap; }
.seg button[aria-checked="true"] { background: var(--text); color: var(--ink); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 10px; cursor: pointer;
  border: 2px solid var(--line); background: var(--panel-2); color: var(--text); font-weight: 700;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .35); transition: transform .08s;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .35); }
.btn.primary { background: var(--yellow); color: var(--ink); border-color: var(--yellow); box-shadow: 0 4px 0 var(--yellow-2); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.big { min-height: 56px; font-size: 19px; padding: 0 28px; font-family: var(--font-display); font-weight: 900; letter-spacing: .04em; }
.btn:disabled { opacity: .38; cursor: default; }
.btn.pulse { animation: pulse calc(1.4s * var(--anim) + .01s) infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 4px 0 var(--yellow-2), 0 0 0 0 rgba(255, 210, 63, .6); } 50% { box-shadow: 0 4px 0 var(--yellow-2), 0 0 0 9px rgba(255, 210, 63, 0); } }

/* ---------- views ---------- */
main { flex: 1; min-height: 0; position: relative; }
.view { display: none; height: 100%; }
.view.on { display: flex; }
.view.tut.on { display: grid; }

/* ---------- cards ---------- */
.dcard {
  position: relative; width: var(--d); height: var(--d); flex: none; border-radius: 50%;
  background: var(--card); container-type: inline-size;
  box-shadow: inset 0 0 0 calc(var(--d) * .014) var(--card-edge), 0 calc(var(--d) * .022) 0 rgba(0, 0, 0, .3);
}
.dcard.cmp { box-shadow: inset 0 0 0 calc(var(--d) * .014) var(--card-edge), 0 0 0 4px var(--yellow), 0 0 26px 4px rgba(255, 210, 63, .42); }
.dcard.back {
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 calc(var(--d) * .09) var(--yellow), inset 0 0 0 calc(var(--d) * .105) var(--yellow-2), 0 calc(var(--d) * .022) 0 rgba(0, 0, 0, .3);
}
.back-logo { font: 900 calc(var(--d) * .2)/1 var(--font-display); color: var(--ink); transform: rotate(-14deg); text-shadow: calc(var(--d) * .012) calc(var(--d) * .012) 0 var(--yellow); }
.dcard.ghost { background: transparent; box-shadow: inset 0 0 0 2px dashed var(--line); border: 2px dashed var(--line); }
.sym {
  position: absolute; transform: translate(-50%, -50%); border: 0; margin: 0; padding: 0;
  background: transparent; border-radius: 50%; display: grid; place-items: center;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button.sym { cursor: pointer; }
.sym .g {
  display: block; line-height: 1; pointer-events: none; font-family: var(--font-emoji);
  filter: drop-shadow(0 0 .6px rgba(38, 18, 74, .55)) drop-shadow(0 0 .6px rgba(38, 18, 74, .55));
  user-select: none; -webkit-user-select: none;
}
button.sym:focus-visible { outline: 3px solid var(--red); outline-offset: 1px; }
.sym.found { background: rgba(255, 210, 63, .38); box-shadow: 0 0 0 3px var(--yellow), 0 0 0 7px rgba(255, 210, 63, .35); }
.sym.bad { background: rgba(255, 77, 109, .2); box-shadow: 0 0 0 3px var(--red); animation: shake calc(.36s * var(--anim) + .01s); }
.sym.hint { animation: hint calc(1.1s * var(--anim) + .01s) infinite; }
@keyframes hint { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 77, 109, .0); background: transparent; } 50% { box-shadow: 0 0 0 5px rgba(255, 77, 109, .75); background: rgba(255, 77, 109, .14); } }
@keyframes shake { 0%, 100% { margin-left: 0; } 25% { margin-left: -5px; } 75% { margin-left: 5px; } }
.pile { position: relative; width: var(--d); height: var(--d); flex: none; }
.pile > .layer { position: absolute; inset: 0; border-radius: 50%; background: var(--card-layer); box-shadow: inset 0 0 0 1px #d4cbe6; transform: translateY(calc(var(--k) * 3px)); }
.pile > .dcard { position: absolute; inset: 0; }
.empty-spot { width: var(--d); height: var(--d); border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; text-align: center; color: var(--muted); padding: 12%; font-weight: 700; }

/* ---------- table (game view) ---------- */
.tbl { position: relative; height: 100%; display: flex; flex-direction: column; }
.opps { flex: none; display: flex; gap: 8px; justify-content: center; padding: 6px 0 4px; }
.opps { flex-wrap: wrap; }
.opp { position: relative; display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 6px; align-items: center; padding: 3px 10px 3px 3px; border-radius: 999px; background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 2px var(--c); }
.opp > .dcard { grid-row: 1 / 3; }
.opp .av { display: none; }
.opp .oname { font-size: 12px; color: var(--text); line-height: 1.2; font-weight: 700; white-space: nowrap; }
.opp .ocount { font: 12px/1.2 var(--font-num); color: var(--yellow); white-space: nowrap; }
.opp.frozen, .oslot.frozen { opacity: .5; }
.opp.frozen::after, .oslot.frozen::after { content: "冻结"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--ice); color: var(--ice-ink); font-weight: 800; font-size: 12px; padding: 1px 8px; border-radius: 999px; }
.dim-opps .opps { opacity: .35; }
.opps.tight { flex-wrap: nowrap; gap: 5px; }
.opps.tight .opp { padding: 4px 8px; column-gap: 0; min-width: 0; }
.opps.tight .opp > .dcard { display: none; }
.opps.corners { position: absolute; inset: 0; display: block; padding: 0; z-index: 2; pointer-events: none; }
.opps.corners .opp { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 4px 4px; border-radius: 14px; min-width: 58px; }
.opps.corners .opp.c0 { left: 0; top: 0; }
.opps.corners .opp.c1 { right: 0; top: 0; }
.opps.corners .opp.c2 { left: 0; bottom: 0; }
.duo { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; }
.duo.side { flex-direction: row; justify-content: center; gap: 48px; }
.slot { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.lbl { font-size: 13px; line-height: 18px; height: 18px; color: var(--muted); white-space: nowrap; }
.lbl b { font: 13px/20px var(--font-num); color: var(--yellow); font-weight: 400; }
.tbl.hfrozen .dcard.ia { filter: grayscale(.5); }
.tbl.hfrozen .dcard.ia::after {
  content: "看错了 · 冻结1秒"; position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center;
  background: rgba(155, 231, 255, .62); color: var(--ice-ink); font-weight: 800; font-size: max(14px, calc(var(--d) * .065)); z-index: 3;
  box-shadow: inset 0 0 0 4px var(--ice);
}
/* 烫手山芋 */
.phud { flex: none; display: flex; align-items: center; gap: 10px; padding: 4px 0 6px; flex-wrap: wrap; }
.phud .rnd { font: 15px var(--font-num); color: var(--yellow); }
.phud .pen { font-size: 13px; color: var(--muted); }
.phud .btn { min-height: 40px; margin-left: auto; padding: 0 12px; font-size: 14px; }
.ogrid { flex: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px; }
.oslot { margin: 0; position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.oslot figcaption { font-size: 13px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.oslot .cnt { font: 13px var(--font-num); color: var(--yellow); font-weight: 400; }
.oslot .penb { font-size: 11px; font-weight: 700; color: #ffb3c1; background: rgba(255, 77, 109, .18); border-radius: 999px; padding: 0 6px; }
.oslot .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.oslot .safe, .safe-spot { white-space: pre-line; line-height: 1.35; display: grid; place-items: center; border-radius: 50%; border: 2px dashed rgba(53, 212, 154, .55); color: var(--green); font-weight: 800; text-align: center; padding: 10%; width: var(--d); height: var(--d); }
.pile.lost .lost-tag { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); white-space: nowrap; z-index: 2; }
.pbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.pbody.side { flex-direction: row-reverse; align-items: center; justify-content: center; gap: 48px; }
.pbody.side .pmine { flex: none; }
.pbody.side .ogrid { align-content: center; }
.pmine { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
/* practice / duel */
.prhud { flex: none; display: flex; align-items: baseline; justify-content: center; gap: 14px; padding: 2px 0 4px; }
.watch { font: 30px/1 var(--font-num); color: var(--yellow); letter-spacing: .03em; min-width: 4.2em; text-align: center; }
.prhud .sub { font-size: 13px; color: var(--muted); }
.prhud .btn { min-height: 40px; padding: 0 12px; font-size: 14px; }
.laps { flex: none; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding-top: 4px; }
.laps span { font: 12px/22px var(--font-num); padding: 0 8px; border-radius: 999px; background: rgba(255, 255, 255, .1); color: var(--muted); }
.laps span.last { background: var(--yellow); color: var(--ink); }
/* overlays inside the table */
.tover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(26, 11, 53, .72); z-index: 8; padding: 16px; }
.tpanel { background: var(--panel); border: 2px solid var(--yellow); border-radius: 16px; padding: 16px 18px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 8px 0 rgba(0, 0, 0, .3); }
.tpanel h3 { margin: 0 0 6px; font: 900 24px/1.2 var(--font-display); color: var(--yellow); letter-spacing: .04em; }
.tpanel p { margin: 6px 0 12px; }
.tpanel .hintline { font-size: 13px; color: var(--muted); margin-top: 8px; }

/* fx layer: shout bubbles + flying cards */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
.shout {
  position: absolute; transform: translate(-50%, -100%); background: #fff; color: var(--ink);
  border-radius: 14px; padding: 4px 11px; font-weight: 800; font-size: 16px; white-space: nowrap;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .35); animation: pop calc(.22s * var(--anim) + .01s) ease-out;
}
.shout::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #fff; }
.shout.bad { background: var(--red); color: #fff; }
.shout.bad::after { border-top-color: var(--red); }
.shout.late { background: #ddd5ec; color: #4b2d86; }
.shout.late::after { border-top-color: #ddd5ec; }
.shout.gone { opacity: 0; transition: opacity .15s; }
.shout .e { font-family: var(--font-emoji); }
@keyframes pop { from { transform: translate(-50%, -80%) scale(.6); opacity: 0; } to { transform: translate(-50%, -100%) scale(1); opacity: 1; } }
.flyer { position: absolute; margin: 0; }

/* ---------- tutorial ---------- */
.tut { width: 100%; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; }
.lmap { display: flex; gap: 6px; padding: 8px var(--gut) 4px; overflow-x: auto; scrollbar-width: none; margin: 0; list-style: none; }
.lmap::-webkit-scrollbar { display: none; }
.lchip {
  flex: none; display: flex; align-items: center; gap: 6px; min-width: 40px; height: 40px; padding: 0 12px;
  border-radius: 20px; border: 2px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-weight: 700;
}
.lchip .n { font: 15px/1 var(--font-num); }
.lchip .t { display: none; white-space: nowrap; }
.lchip.cur { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
.lchip { padding: 0; justify-content: center; }
.lchip.done:not(.cur) { border-color: var(--green); color: var(--green); }
.lchip .tick { width: 14px; height: 14px; display: none; }
.lchip.done .tick { display: block; }
.coach { display: flex; gap: 10px; align-items: flex-start; padding: 6px var(--gut) 6px; }
.mascot { flex: none; width: 46px; height: 46px; }
.bubble {
  flex: 1; min-width: 0; position: relative; background: #fff; color: var(--ink); border-radius: 4px 16px 16px 16px;
  padding: 9px 13px; box-shadow: 0 3px 0 rgba(0, 0, 0, .3); min-height: 74px;
}
.bubble .say { margin: 0; }
.bubble .say b, .bubble .say strong { color: #6b2bd9; }
.bubble .say .e, .fb .e { font-family: var(--font-emoji); }
.bubble .fb { margin: 4px 0 0; font-weight: 700; min-height: 0; }
.bubble .fb:empty { display: none; }
.bubble.fixed-fb .fb, .bubble.fixed-fb .fb:empty { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 3.1em; }
.fb.bad { color: var(--red-ink); }
.fb.good { color: var(--green-ink); }
.fb.warn { color: #9a5a00; }
.fb.info { color: #4b2d86; }
.lesson-title { font: 13px/1.2 var(--font-body); color: #7a64aa; font-weight: 700; margin-bottom: 2px; letter-spacing: .02em; }
.stage { position: relative; min-height: 0; padding: 4px var(--gut); display: flex; flex-direction: column; }
.thost { flex: 1; min-height: 0; position: relative; }
.lnav { display: flex; gap: 8px; align-items: center; padding: 8px var(--gut) calc(8px + env(safe-area-inset-bottom)); background: var(--bg-deep); border-top: 1px solid var(--line); }
.lnav .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; }
.lnav .count { font: 12px/1 var(--font-num); color: var(--muted); }
.lnav .skip { min-height: 40px; padding: 0 10px; border: 0; background: transparent; color: var(--muted); text-decoration: underline; cursor: pointer; font-weight: 600; }
.lnav .btn { min-width: 92px; }
.mapskip { display: none; justify-content: center; min-height: 44px; align-items: center; border: 0; background: transparent; color: var(--muted); text-decoration: underline; font-weight: 700; cursor: pointer; }
.lnav .mapbtn { display: none; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--line); background: transparent; color: var(--text); font-weight: 700; cursor: pointer; white-space: nowrap; }
/* short phone screens (browser toolbars eat the height): lesson map → popover, compact coach */
@media (max-height: 760px) and (max-width: 899px) {
  .tut { position: relative; grid-template-rows: auto minmax(0, 1fr) auto; }
  .lmap { display: none; }
  .lmap.open {
    display: flex; flex-direction: column; position: absolute; left: 12px; right: 12px; bottom: calc(62px + env(safe-area-inset-bottom));
    background: var(--panel); border: 2px solid var(--yellow); border-radius: 14px; padding: 10px; z-index: 25; gap: 6px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
  }
  .lmap.open .lchip { width: 100%; justify-content: flex-start; padding: 0 12px; border-radius: 10px; }
  .lmap.open .lchip .t { display: inline; }
  .mascot, .lesson-title { display: none; }
  .coach { padding: 6px 12px 2px; }
  .bubble { font-size: 14px; padding: 7px 11px; min-height: 0; border-radius: 12px; }
  .bubble.collapsed .say { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .lnav { padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
  .lnav .count { display: none; }
  .lnav .mapbtn { display: inline-flex; align-items: center; }
  .lnav .skip { display: none; }
  .lmap.open .mapskip { display: flex; }
}
@media (min-width: 900px) {
  .tut { grid-template-columns: 250px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
  .lmap { grid-row: 1 / -1; flex-direction: column; overflow: auto; padding: 18px 12px 18px 20px; border-right: 1px solid var(--line); gap: 8px; }
  .lchip { height: auto; min-height: 44px; border-radius: 12px; padding: 8px 12px; justify-content: flex-start; }
  .lchip .t { display: inline; }
  .coach, .stage, .lnav { grid-column: 2; }
  .coach { padding-top: 14px; max-width: 980px; }
  .mascot { width: 56px; height: 56px; }
  .bubble { font-size: 16px; }
}

/* scenes (storyboard) */
.scene { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; position: relative; }
.srow { display: flex; align-items: center; justify-content: center; gap: 18px; }
.srow.col { flex-direction: column; gap: 12px; }
.who { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.who b { color: var(--text); }
.tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; background: var(--yellow); color: var(--ink); }
.tag.red { background: var(--red); color: #fff; }
.tag.dim { background: rgba(255, 255, 255, .14); color: var(--muted); }
.deal { animation: deal calc(.7s * var(--anim) + .01s) cubic-bezier(.2, .8, .2, 1) both; }
@keyframes deal { from { transform: translate(var(--fx, 0), var(--fy, 0)) rotate(-30deg) scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
.flip { animation: flip calc(.5s * var(--anim) + .01s) ease-out both; }
@keyframes flip { from { transform: rotateY(90deg); } to { transform: rotateY(0); } }
.sbub { position: relative; display: inline-block; background: #fff; color: var(--ink); border-radius: 14px; padding: 4px 12px; font-weight: 800; font-size: 16px; white-space: nowrap; box-shadow: 0 3px 0 rgba(0, 0, 0, .35); margin-bottom: 8px; }
.sbub::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #fff; }
.sbub .e { font-family: var(--font-emoji); }
.scroller { flex: 1; min-height: 0; width: 100%; max-width: 760px; overflow: auto; padding: 2px 0 8px; }
.house { background: rgba(53, 212, 154, .12); border: 2px dashed rgba(53, 212, 154, .6); border-radius: 12px; padding: 8px 12px; margin: 0 0 10px; font-size: 14px; line-height: 1.5; }
.house .tag { background: var(--green); color: #05301f; margin-right: 6px; }
.ngroup { margin: 0 0 10px; }
.ngroup h4 { margin: 0 0 5px; font-size: 13px; color: var(--muted); font-weight: 700; }
.ngroup .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ngroup .chips span { background: rgba(255, 255, 255, .08); border-radius: 8px; padding: 4px 9px; font-size: 13px; line-height: 1.35; }
.ngroup.alike .chips span { background: rgba(255, 210, 63, .14); box-shadow: inset 0 0 0 1px rgba(255, 210, 63, .45); }
.checklist { margin: 0; padding: 0; list-style: none; counter-reset: ck; display: grid; gap: 8px; }
.checklist li { counter-increment: ck; position: relative; padding: 8px 12px 8px 42px; background: rgba(255, 255, 255, .07); border-radius: 12px; font-size: 14px; line-height: 1.5; }
.checklist li::before { content: counter(ck); position: absolute; left: 10px; top: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--yellow); color: var(--ink); font: 13px/22px var(--font-num); text-align: center; }
.checklist b { color: var(--yellow); }
.board { width: min(440px, 100%); border-collapse: collapse; font-size: 15px; }
.board th, .board td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
.board th { color: var(--muted); font-weight: 600; font-size: 13px; }
.board .w { color: var(--yellow); font-weight: 800; }
.finale { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
.finale p { margin: 0; color: var(--muted); max-width: 30em; }

/* ---------- 实战 ---------- */
.play { flex-direction: column; width: 100%; }
.screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
.screen.on { display: flex; }
.setup { overflow: auto; }
.setup-in { width: 100%; max-width: 760px; margin: 0 auto; padding: 14px var(--gut) calc(24px + env(safe-area-inset-bottom)); }
.h2 { font: 900 26px/1.1 var(--font-display); margin: 6px 0 12px; letter-spacing: .04em; }
.modegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode {
  text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 14px; padding: 12px; cursor: pointer;
  display: flex; flex-direction: column; gap: 2px; min-height: 76px; position: relative;
}
.mode .mn { font: 900 21px/1.15 var(--font-display); letter-spacing: .04em; }
.mode .mk { font: 11px/1 var(--font-num); color: var(--yellow); }
.mode .ms { font-size: 13px; color: var(--muted); line-height: 1.4; }
.mode[aria-checked="true"] { border-color: var(--yellow); background: var(--panel-2); box-shadow: 0 0 0 2px var(--yellow) inset; }
.mode.wide { grid-column: 1 / -1; }
@media (min-width: 700px) { .modegrid { grid-template-columns: repeat(3, 1fr); } .mode.wide { grid-column: auto; } }
.opts { margin: 16px 0 6px; display: grid; gap: 12px; }
.opt { display: grid; grid-template-columns: 104px minmax(0, 1fr); align-items: center; gap: 10px; }
.opt > span { font-weight: 700; color: var(--muted); font-size: 14px; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel-2); font-size: 22px; font-weight: 800; cursor: pointer; }
.stepper output { font: 22px var(--font-num); min-width: 1.6em; text-align: center; color: var(--yellow); }
.stepper .names { font-size: 13px; color: var(--muted); }
.switch { display: flex; align-items: center; gap: 10px; min-height: 44px; border: 0; background: transparent; cursor: pointer; padding: 0; text-align: left; }
.switch .knob { width: 52px; height: 30px; border-radius: 999px; background: rgba(255, 255, 255, .18); position: relative; flex: none; transition: background .15s; }
.switch .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] .knob { background: var(--green); }
.switch[aria-checked="true"] .knob::after { transform: translateX(22px); }
.switch .st { font-size: 13px; color: var(--muted); }
.startrow {
  position: sticky; bottom: 0; z-index: 3; margin-top: 10px; display: flex; flex-direction: column; align-items: stretch;
  padding: 14px 0 calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(38, 18, 74, 0), var(--bg) 14px);
}
.setup-in { padding-bottom: 0; }
.note { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.ghud { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px var(--gut); min-height: 54px; }
.ghud .title { font: 900 20px/1.1 var(--font-display); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ghud .title small { font: 12px var(--font-body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.ghud .sp { flex: 1; }
.clock { font: 18px/1 var(--font-num); color: var(--yellow); background: #11042a; border-radius: 8px; padding: 7px 10px 6px; box-shadow: inset 0 0 0 2px rgba(255, 210, 63, .35); letter-spacing: .05em; }
.ghud .btn { min-height: 40px; padding: 0 12px; font-size: 14px; white-space: nowrap; flex: none; }
.ghud .clock, #gExit { flex: none; }
/* phones: the subtitle (对手2 · 新手 / 连玩1/3) goes under the name, so the name itself is never cut off */
@media (max-width: 480px) {
  .ghud .title { display: flex; flex-direction: column; font-size: 18px; }
  .ghud .title small { margin-left: 0; font-size: 11px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; }
}
.confirm { display: flex; gap: 6px; align-items: center; font-size: 14px; white-space: nowrap; }
.cbtn { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 9px; border-radius: 10px; border: 2px solid var(--line); background: transparent; color: var(--muted); font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; }
.cbtn .kn { width: 24px; height: 14px; border-radius: 999px; background: rgba(255, 255, 255, .2); position: relative; flex: none; }
.cbtn .kn::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
.cbtn[aria-pressed="true"] { color: var(--text); border-color: rgba(53, 212, 154, .7); }
.cbtn[aria-pressed="true"] .kn { background: var(--green); }
.cbtn[aria-pressed="true"] .kn::after { left: 12px; }
.ghost-x { min-width: 44px; }
.host { flex: 1; min-height: 0; position: relative; padding: 0 var(--gut); }
.coachline {
  flex: none; display: flex; gap: 10px; align-items: center; padding: 6px var(--gut) calc(6px + env(safe-area-inset-bottom));
  background: var(--bg-deep); border-top: 1px solid var(--line); min-height: 58px;
}
.coachline svg { width: 34px; height: 34px; flex: none; }
.coachline .txt { font-size: 14px; line-height: 1.4; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.coachline .txt.bad { color: #ffb3c1; }
.coachline .txt.good { color: #9ff0cc; }
.coachline .txt.warn { color: #ffe08a; }
.coachline .txt .e { font-family: var(--font-emoji); }
.result { overflow: auto; }
.result-in { width: 100%; max-width: 620px; margin: 0 auto; padding: 18px var(--gut) calc(24px + env(safe-area-inset-bottom)); }
.rtitle { font: 900 clamp(28px, 8.4vw, 40px)/1.15 var(--font-display); color: var(--yellow); letter-spacing: .05em; margin: 8px 0 2px; text-wrap: balance; }
.rsub { color: var(--muted); margin: 0 0 14px; }
.rtip { margin: 12px 0 0; font-size: 14px; color: var(--muted); }
.rlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rlist li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 10px; background: var(--panel); border-radius: 12px; padding: 10px 14px; border: 2px solid transparent; }
.rlist li.win { border-color: var(--yellow); }
.rlist .rk { font: 20px var(--font-num); color: var(--muted); }
.rlist li.win .rk { color: var(--yellow); }
.rlist .nm { font-weight: 800; }
.rlist .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.rlist .val { font: 18px var(--font-num); color: var(--text); white-space: nowrap; }
.tbnote { background: rgba(255, 77, 109, .14); border-left: 4px solid var(--red); padding: 8px 12px; border-radius: 4px 10px 10px 4px; margin: 14px 0 0; font-size: 14px; }
.tally { margin-top: 18px; }
.tally h4 { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
.tally .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tally .chips span { background: rgba(255, 255, 255, .08); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
.tally .chips b { font-family: var(--font-num); font-weight: 400; color: var(--yellow); margin-left: 4px; }
.ractions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.ractions .btn { flex: 1 1 140px; }

@media (max-height: 500px) {
  .ghud { min-height: 0; padding: 2px var(--gut); }
  .ghud .title { font-size: 17px; }
  .clock { padding: 5px 8px 4px; font-size: 16px; }
  .coachline { min-height: 0; padding-top: 3px; padding-bottom: calc(3px + env(safe-area-inset-bottom)); }
  .coachline svg { width: 26px; height: 26px; }
  .coachline .txt { font-size: 13px; line-height: 1.35; }
}
/* in-page question when you leave a game that is still running */
.askov { z-index: 30; }
.askrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.askrow .btn { flex: 1 1 140px; }

/* ---------- 速查 ---------- */
.ref { overflow: auto; width: 100%; }
.ref-in { max-width: 980px; margin: 0 auto; padding: 14px var(--gut) calc(30px + env(safe-area-inset-bottom)); }
.startbox { background: var(--panel); border: 2px solid var(--yellow); border-radius: 16px; padding: 10px 14px 12px; }
.startbox h2 { margin: 0 0 4px; font: 900 22px/1.2 var(--font-display); letter-spacing: .04em; color: var(--yellow); }
.startbox ol { margin: 0; padding-left: 1.3em; font-size: 14px; line-height: 1.5; }
.startbox li { margin: 3px 0; }
.startbox .house { margin: 8px 0 0; }
.core { margin-top: 12px; background: #fff; color: var(--ink); border-radius: 18px; padding: 12px 16px; box-shadow: inset 0 0 0 5px var(--yellow), 0 4px 0 rgba(0, 0, 0, .3); }
.core h2 { margin: 0 0 4px; font: 900 22px/1.2 var(--font-display); letter-spacing: .04em; }
.core p { margin: 4px 0; }
.core .big { font-size: 17px; font-weight: 800; }
.rchips { display: flex; gap: 6px; margin: 14px 0 0; }
.rchip { flex: 1 1 0; min-width: 0; min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: transparent; color: var(--text); font-weight: 800; font-size: 15px; cursor: pointer; padding: 3px 4px; line-height: 1.2; }
.rchip small { display: block; font: 10px/1.2 var(--font-num); color: var(--yellow); letter-spacing: .04em; }
.rchip[aria-selected="true"] { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }
.rchip[aria-selected="true"] small { color: var(--ink); }
.refgrid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 8px; }
.refgrid .rcard { display: none; }
.refgrid .rcard.on { display: block; }
@media (min-width: 760px) { .rchips { display: none; } .refgrid { grid-template-columns: repeat(3, 1fr); margin-top: 14px; } .refgrid .rcard { display: block; } }
.rcard { background: var(--panel); border-radius: 14px; padding: 12px 14px; border-top: 5px solid var(--yellow); }
.rcard h3 { margin: 0 0 6px; font: 900 22px/1.1 var(--font-display); letter-spacing: .04em; }
.rcard h3 small { font: 11px var(--font-num); color: var(--yellow); margin-left: 6px; letter-spacing: 0; }
.rcard dl { margin: 0; display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 4px 8px; font-size: 14px; }
.rcard dt { color: var(--yellow); font-weight: 800; }
.rcard dd { margin: 0; }
.rules2 { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
@media (min-width: 760px) { .rules2 { grid-template-columns: 1fr 1fr; } }
.rules2 section { background: rgba(255, 255, 255, .06); border-radius: 12px; padding: 10px 14px; }
.rules2 h3, .names h3, .foot h3 { margin: 0 0 6px; font-size: 16px; }
.rules2 p { margin: 4px 0; font-size: 14px; }
.names { margin-top: 18px; }
.names > p { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.names .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.names .grid span { font-size: 13px; background: rgba(255, 255, 255, .07); border-radius: 8px; padding: 5px 8px; }
details.emo, details.more { margin-top: 10px; background: rgba(255, 255, 255, .05); border-radius: 12px; padding: 0 12px; }
details.emo summary, details.more summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 700; }
details.emo .grid { padding-bottom: 10px; }
details.emo .grid span .e { font-family: var(--font-emoji); font-size: 18px; margin-right: 4px; vertical-align: -2px; }
details.more { font-size: 14px; }
details.more > div { padding: 0 0 10px; }
details.more ol, details.more ul { margin: 0; padding-left: 1.4em; }
details.more li { margin: 4px 0; }
details.more p { margin: 8px 0 0; }
.foot { color: var(--muted); font-size: 13px; }
.foot summary { color: var(--text); font-size: 14px; }
.reftail { height: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .sym.hint { animation: none; box-shadow: 0 0 0 4px var(--red); background: rgba(255, 77, 109, .18); }
}
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="index.html">← 大厅</a>
  <span class="brand">嗒宝<small>DOBBLE</small></span>
  <nav class="tabs" role="tablist" aria-label="页面">
    <button class="tab" role="tab" id="tab-tutorial" aria-controls="view-tutorial" aria-selected="true" data-tab="tutorial">教程</button>
    <button class="tab" role="tab" id="tab-play" aria-controls="view-play" aria-selected="false" data-tab="play">实战</button>

  </button>

    <h3>动画速度</h3>

  </div>
</header>

<main>
  <!-- 教程 -->
  <section class="view tut on" id="view-tutorial" role="tabpanel" aria-labelledby="tab-tutorial">
    <ol class="lmap" id="lmap" aria-label="课程"></ol>
    <div class="coach">
      <svg class="mascot" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="20.5" fill="#fff" stroke="#ffd23f" stroke-width="5"/>
        <circle cx="17.5" cy="21" r="3.4" fill="#26124a"/><circle cx="30.5" cy="21" r="3.4" fill="#26124a"/>
        <circle cx="18.6" cy="19.8" r="1.1" fill="#fff"/><circle cx="31.6" cy="19.8" r="1.1" fill="#fff"/>
        <path d="M18 28.5q6 5.5 12 0" stroke="#26124a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <circle cx="13" cy="27" r="2.4" fill="#ff9db0"/><circle cx="35" cy="27" r="2.4" fill="#ff9db0"/>
      </svg>
      <div class="bubble" aria-live="polite">
        <div class="lesson-title" id="ltitle"></div>
        <p class="say" id="say"></p>
        <p class="fb" id="fb"></p>
      </div>
    </div>
    <div class="stage" id="tstage"></div>
    <nav class="lnav" aria-label="课程导航">
      <button class="btn" id="prevBtn">上一步</button>
      <div class="mid"><span class="count" id="stepCount"></span><button class="mapbtn" id="mapBtn" aria-expanded="false" aria-controls="lmap"></button><button class="skip" id="skipBtn">跳过本课</button></div>
      <button class="btn primary" id="nextBtn">下一步</button>
    </nav>
  </section>

  <!-- 实战 -->
  <section class="view play" id="view-play" role="tabpanel" aria-labelledby="tab-play">
    <div class="screen setup on" id="scr-setup">
      <div class="setup-in">
        <h2 class="h2">选一个玩法</h2>
        <div class="modegrid" role="radiogroup" aria-label="玩法" id="modegrid">
          <button class="mode" role="radio" data-mode="tower"><span class="mk">玩法1</span><span class="mn">混乱高塔</span><span class="ms">抢抓牌堆顶的牌，最后牌最多的赢</span></button>
          <button class="mode" role="radio" data-mode="well"><span class="mk">玩法2</span><span class="mn">水井</span><span class="ms">把自己的牌一张张放进中央牌堆，先出完的赢</span></button>
          <button class="mode" role="radio" data-mode="potato"><span class="mk">玩法3</span><span class="mn">烫手山芋</span><span class="ms">把牌叠到别人牌上，几回合后面前牌最少的赢</span></button>
          <button class="mode" role="radio" data-mode="evening"><span class="mk">一晚</span><span class="mn">今晚连玩</span><span class="ms">三个玩法各一局，赢得最多的是总冠军</span></button>
          <button class="mode wide" role="radio" data-mode="practice"><span class="mk">秒表</span><span class="mn">练习</span><span class="ms">没有对手，看你平均几秒找到</span></button>
        </div>

          <div class="opt" data-show="tower well potato evening"><span>对手</span>

          </div>
          <div class="opt" data-show="tower well potato evening"><span>机器人反应</span>
            <div class="seg" role="radiogroup" aria-label="机器人反应速度" data-pref="bot">
              <button role="radio" data-v="novice">新手</button><button role="radio" data-v="normal">普通</button><button role="radio" data-v="expert">高手</button>
            </div>

    w.appendChild(backEl(d)); return w;

    for (var i = 3; i >= 1; i--) { var l = h('i', { class: 'layer' }); l.style.setProperty('--k', i); p.appendChild(l); }

      h('div', { class: 'who' }, dealt(backEl(dS), dMid, 0.1), h('b', null, '小东')),

  return scene;
}

/* auto-start timer of the tie-break panel: pauses with the game (H5) */

function newSeed() { return ((Math.random() * 4294967295) >>> 0) || 7; }

    well: '比<b>你的顶牌</b>和<b>中央牌堆顶</b>（黄框），找到就点，你的顶牌就放上去。先出完的赢。',

function nameOf(s, id) { return s.players[id].name; }

/* tie → 对决 (2) or 烫手山芋 rounds among the tied (3+), then 对决.
   done(winnerName, notes, order) — order = { eliminated: [names, in the order they were knocked out], duelLoser } */
function runTiebreak(group, label, done) {
  // group: [{name, human}]
  var notes = [], order = { eliminated: [], duelLoser: null };
  var step = function (g, afterPotato) {
    var plan = E.tiebreakStep(g.map(function (_, i) { return i; }));
    var names = g.map(function (p) { return p.name; }).join('、');
    var hasHuman = g.some(function (p) { return p.human; });
    if (plan.kind === 'potato') {
      interstitial(names + '平手', g.length + '人平手 → 先在' + (hasHuman ? '你们' : '他们') + '之间玩一回合<b>烫手山芋</b>，最后拿着牌的人淘汰。', '开始烫手山芋', function () {
        var st = E.newGame({ mode: 'potato', seed: newSeed(), rounds: 1, players: g.map(function (p) { return { name: p.name, human: p.human }; }) });
        var hu = -1; st.players.forEach(function (p, i) { if (p.human) hu = i; });
        play.titleKind = 'tie';
        gTitle.innerHTML = '烫手山芋<small>' + esc(label) + '平手决胜</small>';
        gCoach.className = 'txt info';
        gCoach.innerHTML = hu >= 0 ? '决胜回合：用<b>你的牌</b>和别人的牌比，找到就把牌叠过去。最后拿着牌的人淘汰。' : '看' + esc(names) + '玩决胜回合：最后拿着牌的人淘汰。';
        mountPlayTable(st, function (s) {
          var loser = s.players[s.roundLog[0].loser].name;
          order.eliminated.push(loser);
          notes.push(names + '平手，先玩一回合烫手山芋：' + loser + '最后拿着牌，被淘汰。');
          step(g.filter(function (p) { return p.name !== loser; }), true);
        }, { human: hu, tiebreak: true });
      });
    } else {
      interstitial(afterPotato ? '剩下' + names : names + '平手', (afterPotato ? '剩下两人' : '两人平手') + ' → <b>对决</b>：各抽一张牌同时翻开，先喊出相同符号的人赢。', '翻牌对决', function () {
        var st = E.newGame({ mode: 'duel', seed: newSeed(), players: g.map(function (p) { return { name: p.name, human: p.human }; }) });
        var hu = -1; st.players.forEach(function (p, i) { if (p.human) hu = i; });
        play.titleKind = 'tie';
        gTitle.innerHTML = '对决<small>' + esc(names) + '</small>';
        gCoach.className = 'txt info';
        gCoach.innerHTML = hu >= 0 ? '对决！比这两张卡，先喊出相同符号的人赢。' : '看' + esc(names) + '对决。';
        mountPlayTable(st, function (s) {
          var wi = s.result.winners[0], w = s.players[wi].name;
          order.duelLoser = s.players[1 - wi].name;

  };

}
function interstitial(title, html, btn, go) {
  if (play.table) { play.table.destroy(); play.table = null; }

  setExit(false);
  gTitle.innerHTML = '平手决胜<small>' + esc(title) + '</small>';
  gCoach.className = 'txt info'; gCoach.innerHTML = '说明书：平手的人用对决决出胜者（3人以上先玩烫手山芋）。';

  guardInput(400);                    // it appears by itself after the game: a late tap must not start the tie-break
  setAuto(fire, T(4500));
}

function onGameEnd(s, tb) {
  progress.played++; saveProgress();
  var mode = s.mode;
  if (coached[mode] === false) { coached[mode] = true; store.set('coached', coached); }   // its first game is done
  syncCoachSw();
  var elapsed = tb.elapsed();          // time actually played (paused time not counted)
  var myTimes = tb.myTimes.slice();
  if (mode === 'practice') { showPracticeResult(tb.times, elapsed); return; }
  var finalize = function (winnerName, notes, order) {
    play.session.wins[winnerName] = (play.session.wins[winnerName] || 0) + 1;
    if (play.evening) { play.evening.wins[winnerName] = (play.evening.wins[winnerName] || 0) + 1; play.evening.results.push({ mode: mode, winner: winnerName }); }
    showResult(s, winnerName, notes || [], elapsed, order, myTimes);
  };
  if (s.result.tied) {
    var group = s.result.winners.map(function (id) { return { name: s.players[id].name, human: s.players[id].human }; });
    var pre = group.map(function (p) { return p.name; }).join('、') + (mode === 'tower' ? '都是' + s.players[s.result.winners[0]].pile.length + '张' : '面前都是' + s.players[s.result.winners[0]].penalty + '张');
    play.lastState = s;
    runTiebreak(group, modeTitle(mode), function (w, notes, order) { finalize(w, ['平手：' + pre + '。'].concat(notes), order); });
  } else finalize(s.players[s.result.winners[0]].name, []);
}
function valueText(s, p) {
  if (s.mode === 'tower') return p.pile.length + '张';
  if (s.mode === 'well') return p.pile.length ? '剩' + p.pile.length + '张' : '出完了';
  if (s.mode === 'potato') return p.penalty + '张';
  return '';
}
// one line of feedback on your own speed. Only the finds you won are timed (a find a bot beat you to has no time),
// so the average flatters you. Set it next to the bots' typical time only when you won: after a loss the bots took
// every card you were slower on, and "1.5秒 vs 7秒" right under a 5–47 defeat reads as "I was faster".
function speedLine(times, won, tipOk, nOpp) {
  if (!times || times.length < 2) return '';
  var avg = times.reduce(function (a, b) { return a + b; }, 0) / times.length, lv = E.BOT_LEVELS[prefs.bot];
  if (won) return '你抢到的' + times.length + '次，平均约' + sec(avg) + '秒找到一次；「' + lv.label + '」机器人一般要' + (lv.median / 1000) + '秒左右。';
  return '你抢到的' + times.length + '次平均约' + sec(avg) + '秒，其余的都是机器人先找到的。' +
    (tipOk ? '想赢回来？先去「练习」热热身' + (nOpp > 1 ? '，或下局少一个对手' : prefs.bot !== 'novice' ? '，或把机器人换成「新手」' : '') + '。' : '');
}
function showResult(s, winner, notes, elapsed, order, myTimes) {
  clearAuto();
  if (play.table) { play.table.destroy(); play.table = null; }
  var R = $('#resultIn');
  R.replaceChildren();
  var youWin = winner === '你';
  R.appendChild(h('div', { class: 'rtitle' }, youWin ? '你赢了！' : winner + '赢了'));
  R.appendChild(h('p', { class: 'rsub' }, modeTitle(s.mode) + ' · 用时' + fmtClock(elapsed) + ' · ' + { tower: '牌最多的赢', well: '先出完的赢', potato: '面前的牌最少的赢' }[s.mode]));
  var list = h('ol', { class: 'rlist' });
  // Tied players are placed by how the tie-break went (E.standings): winner, the 对决 loser, then whoever was
  // knocked out of the tie-break 烫手山芋 (the last one out ranks highest) — distinct places, no shared rank.
  var idOf = function (n) { for (var i = 0; i < s.players.length; i++) if (s.players[i].name === n) return i; return null; };
  var tb = s.result.tied ? { winner: idOf(winner), duelLoser: order ? idOf(order.duelLoser) : null, eliminated: order ? order.eliminated.map(idOf) : [] } : null;
  E.standings(s, tb).forEach(function (r) {
    var p = s.players[r.p];

      var lost = s.roundLog.filter(function (x) { return x.loser === p.id; }).map(function (x) { return x.round; });
      extra.push(lost.length ? '输了第' + lost.join('、') + '回合' : '每回合都安全');
    }
    if (r.tiebreak === 'won') extra.push('平手决胜胜出');
    else if (r.tiebreak === 'duel') extra.push('平手决胜：对决输了');
    else if (r.tiebreak === 'out') extra.push('平手决胜：烫手山芋淘汰');
    else if (!r.tied && p.name === winner && s.mode === 'tower') extra.push('拿到最多');   // 水井: the value already says 出完了
    list.appendChild(h('li', { class: p.name === winner ? 'win' : '' }, h('span', { class: 'rk' }, String(r.rank)), h('span', { class: 'nm' }, p.name, extra.length ? h('small', null, extra.join(' · ')) : null), h('span', { class: 'val' }, valueText(s, p))));
  });
  R.appendChild(list);
  if (notes.length) R.appendChild(h('p', { class: 'tbnote' }, notes.join('')));
  var sp = speedLine(myTimes, youWin, !play.evening, s.players.length - 1);   // mid-evening: no "change the setup" tip
  if (sp) R.appendChild(h('p', { class: 'rtip', id: 'speedLine' }, sp));

  var acts = h('div', { class: 'ractions' });
  if (play.evening) {
    play.evening.idx++;
    if (play.evening.idx < 3) {
      var nextMode = play.evening.queue[play.evening.idx];
      acts.appendChild(h('button', { class: 'btn primary big', id: 'nextGameBtn', onclick: function () { startSingle(nextMode); } }, '下一个：' + modeTitle(nextMode) + '（' + (play.evening.idx + 1) + '/3）'));
    } else acts.appendChild(h('button', { class: 'btn primary big', id: 'eveningBtn', onclick: showEveningResult }, '看今晚总冠军'));
    acts.appendChild(h('button', { class: 'btn', id: 'setupBtn', onclick: function () { play.evening = null; showScreen('setup'); } }, '结束连玩'));
  } else {
    acts.appendChild(h('button', { class: 'btn primary big', id: 'againBtn', onclick: function () { startSingle(s.mode); } }, '再来一局'));
    acts.appendChild(h('button', { class: 'btn', id: 'setupBtn', onclick: function () { showScreen('setup'); } }, '换个玩法'));
  }
  R.appendChild(acts);
  showScreen('result');
}
function tallyEl(title, wins) {
  var chips = h('div', { class: 'chips' });
  Object.keys(wins).sort(function (a, b) { return wins[b] - wins[a]; }).forEach(function (n) { chips.appendChild(h('span', null, n, h('b', null, String(wins[n])))); });
  return h('div', { class: 'tally' }, h('h4', null, title), chips);
}
function showEveningResult() {
  var ev = play.evening;
  if (!ev) return;
  var leaders = E.tallyWins(ev.wins);
  var show = function (champ, notes) {
    var R = $('#resultIn');
    R.replaceChildren();
    R.appendChild(h('div', { class: 'rtitle' }, champ === '你' ? '你是今晚总冠军！' : champ + '是今晚总冠军'));
    R.appendChild(h('p', { class: 'rsub' }, '三个迷你游戏，赢得最多的人是总冠军。'));
    var list = h('ol', { class: 'rlist' });
    ev.results.forEach(function (r, i) { list.appendChild(h('li', { class: r.winner === champ ? 'win' : '' }, h('span', { class: 'rk' }, String(i + 1)), h('span', { class: 'nm' }, modeTitle(r.mode)), h('span', { class: 'val' }, r.winner))); });
    R.appendChild(list);
    if (notes && notes.length) R.appendChild(h('p', { class: 'tbnote' }, notes.join('')));
    R.appendChild(tallyEl('赢的迷你游戏数', ev.wins));
    R.appendChild(h('div', { class: 'ractions' },
      h('button', { class: 'btn primary big', id: 'againBtn', onclick: function () { prefs.mode = 'evening'; startFromSetup(); } }, '再来一晚'),
      h('button', { class: 'btn', id: 'setupBtn', onclick: function () { play.evening = null; showScreen('setup'); } }, '换个玩法')));
    play.evening = null;
    clearAuto();
    if (play.table) { play.table.destroy(); play.table = null; }
    showScreen('result');
  };
  if (leaders.length > 1) {
    showScreen('game');
    gTitle.innerHTML = '总冠军平手';
    setExit(false);
    var group = leaders.map(function (n) { return { name: n, human: n === '你' }; });
    runTiebreak(group, '总冠军', function (w, notes) { show(w, ['总冠军平手：' + leaders.join('、') + '各赢' + ev.wins[leaders[0]] + '个。'].concat(notes)); });
  } else show(leaders[0], []);
}
function showPracticeResult(times, elapsed) {
  clearAuto();
  if (play.table) { play.table.destroy(); play.table = null; }
  var R = $('#resultIn');
  R.replaceChildren();
  var avg = times.reduce(function (a, b) { return a + b; }, 0) / Math.max(1, times.length);
  var best = Math.min.apply(null, times);
  R.appendChild(h('div', { class: 'rtitle' }, '平均' + sec(avg) + '秒'));
  R.appendChild(h('p', { class: 'rsub' }, times.length + '对 · 最快' + sec(best) + '秒 · 总用时' + fmtClock(elapsed)));
  // each tier quotes its bot's median, and you only beat it when you are actually faster than that number
  var verdict = avg < 2800 ? '比「高手」机器人（约2.8秒）还快！' : avg < 4500 ? '比「普通」机器人（约4.5秒）快。' : avg < 7000 ? '比「新手」机器人（约7秒）快。再练练就能挑战普通。' : '多练几次，先挑战「新手」机器人。';
  R.appendChild(h('p', null, verdict));
  var list = h('div', { class: 'laps', style: { justifyContent: 'flex-start' } });
  times.forEach(function (t) { list.appendChild(h('span', null, sec(t) + 's')); });
  R.appendChild(list);
  R.appendChild(h('div', { class: 'ractions' },
    h('button', { class: 'btn primary big', id: 'againBtn', onclick: function () { startSingle('practice'); } }, '再练一次'),
    h('button', { class: 'btn', id: 'setupBtn', onclick: function () { showScreen('setup'); } }, '换个玩法')));
  showScreen('result');
}

/* ================================================================ 速查
   Order on a phone (H7): 开局步骤 → the one rule → the chosen mini-game's card (chips switch it; desktop shows all
   three) → 平手 / 一晚 → the physical deck's names → collapsible: emoji table, 说明书没写清楚的地方, 小窍门. */
var REF_MODES = [
  ['tower', '玩法1', '混乱高塔',
    '<dt>准备</dt><dd>每人1张，背面朝上；其余<b>正面朝上</b>叠在中间做抓牌堆。喊「开始」后大家同时翻开自己那张。</dd>' +
    '<dt>比</dt><dd><b>你的顶牌</b> ↔ <b>抓牌堆顶</b>，大家抢同一张。</dd>' +
    '<dt>喊对</dt><dd>把抓牌堆顶那张拿来，正面朝上盖在你的牌上（你的顶牌换了）。</dd>' +
    '<dt>同时</dt><dd>谁先把那张<b>拿到手</b>，算谁的。</dd>' +
    '<dt>结束</dt><dd>抓牌堆拿完，<b>牌最多</b>的赢（开局那张也算）。</dd>'],
  ['well', '玩法2', '水井',
    '<dt>准备</dt><dd>1张正面朝上放中间，叫中央牌堆；其余平均发给每人（4人每人13张，除不尽的放回盒子），背面朝上做自己的抓牌堆。开始时整叠翻过来。</dd>' +
    '<dt>比</dt><dd><b>你的顶牌</b> ↔ <b>中央牌堆顶</b>。</dd>' +
    '<dt>喊对</dt><dd>把你的顶牌放到中央牌堆上。中央换牌了，大家重新找。</dd>' +
    '<dt>同时</dt><dd>谁的牌先<b>放上去</b>，算谁的。</dd>' +
    '<dt>结束</dt><dd><b>最先出完</b>的赢。</dd>'],
  ['potato', '玩法3', '烫手山芋',
    '<dt>准备</dt><dd>先定回合数（至少5）。每回合从放一边的牌里给每人发1张，大家同时亮牌，<b>平放在手掌上</b>。</dd>' +
    '<dt>比</dt><dd><b>你的牌</b> ↔ <b>任何一个</b>还拿着牌的人。</dd>' +
    '<dt>喊对</dt><dd>把你手里<b>所有</b>牌叠到那人牌上，你这回合安全。他用新顶牌接着比。</dd>' +
    '<dt>同时</dt><dd>谁先把牌<b>叠上去</b>，算谁的。</dd>' +
    '<dt>结束</dt><dd>只剩一人拿着牌：他输这回合，牌放自己面前。全部回合打完，<b>面前牌最少</b>的赢。</dd>']
];
var refMode = store.get('refMode', null) || (/^(tower|well|potato)$/.test(prefs.mode) ? prefs.mode : 'tower');
function buildRef() {
  var R = $('#refIn');
  var groups = nameGroups();
  var html = '' +
    '<section class="startbox" aria-labelledby="refStart"><h2 id="refStart">开局步骤</h2><ol>' +
    '<li><b>洗匀</b>55张，先<b>热身</b>几轮：翻两张，抢着喊。</li>' +
    '<li>选好玩法，一人照下面的「准备」摆牌。</li>' +
    '<li>桌上没有黄框，也没人帮你挪牌：喊对的人<b>自己动手</b>，大家盯着谁先。</li>' +
    '<li>用<b>纸笔</b>记下每局赢家，赢最多的是总冠军。</li>' +
    '<li>要喊<b>宝可梦的名字</b>。喊错不会冻结，罚不罚开局前说好<sup>1</sup>。</li>' +
    '</ol><p class="house">' + HOUSE_NAMES_REF + '</p></section>' +
    '<div class="core"><h2>唯一的规则</h2>' +
    '<p class="big">任意两张卡，有且只有1个相同符号。</p>' +
    '<p>形状、颜色一样就算，<b>大小和方向可以不同</b>。找到就<b>大声喊出它的名字</b>，最先喊对的人赢下这一次。</p></div>' +
    '<div class="rchips" role="tablist" aria-label="玩法">' +
    REF_MODES.map(function (m) { return '<button class="rchip" role="tab" id="rchip-' + m[0] + '" data-m="' + m[0] + '" aria-controls="rcard-' + m[0] + '"><small>' + m[1] + '</small>' + m[2] + '</button>'; }).join('') +
    '</div><div class="refgrid">' +
    REF_MODES.map(function (m) { return '<section class="rcard" id="rcard-' + m[0] + '" data-m="' + m[0] + '" role="tabpanel" aria-labelledby="rchip-' + m[0] + '"><h3>' + m[2] + '<small>' + m[1] + '</small></h3><dl>' + m[3] + '</dl></section>'; }).join('') +
    '</div>' +
    '<div class="rules2">' +
    '<section><h3>平手怎么办</h3><p>2人平手：各抽一张背面朝上的牌同时翻开，先喊出相同符号的赢（对决）。3人以上平手：先玩烫手山芋减到2人，再对决。<sup>2</sup></p></section>' +
    '<section><h3>一晚怎么算</h3><p>玩法顺序随意、可以重复。每赢一个玩法记1次，<b>赢得最多的是总冠军</b>。</p></section>' +
    '</div>' +
    '<div class="names"><h3>实体卡上的57个符号</h3><p>说明书里的「符号名称示例」两页有图，上桌前一起看看。下面按种类分好了。</p>' +
    '<div class="ngroup alike"><h4>长得像或名字像，别喊错（形状和颜色都一样才算同一个）</h4><div class="chips">' +
    NAME_ALIKE.map(function (n) { return '<span>' + esc(n) + '</span>'; }).join('') + '</div></div>' +
    groups.map(function (g) { return '<div class="ngroup"><h4>' + esc(g[0]) + '</h4><div class="chips">' + g[1].map(function (n) { return '<span class="pn">' + esc(n) + '</span>'; }).join('') + '</div></div>'; }).join('') +
    '</div>' +
    '<details class="emo"><summary>网页版 emoji 符号对照（57个）</summary><div class="grid">' +
    E.SYMBOLS.map(function (s) { return '<span><span class="e">' + s.e + '</span>' + esc(s.n) + '</span>'; }).join('') + '</div></details>' +
    '<details class="more foot"><summary>说明书没写清楚的地方</summary><div><ol>' +
    '<li>喊错名字：说明书没写。网页版喊错冻结1秒，是网页自己的约定，不是官方规则。</li>' +
    '<li>3人以上平手「用烫手山芋减到2位」：说明书没写怎么减。网页版每回合淘汰最后拿着牌的人，直到剩2人。</li>' +
    '<li>水井发牌除不尽时，多出来的放回盒子，保证每人张数一样（说明书只写「平均发给所有玩家」）。</li>' +
    '<li>烫手山芋里，如果你牌上的那个符号同时出现在两个人的牌上，桌上由你自己选叠给谁。网页版：电脑大屏上可以点那个人牌上的符号来选；手机上只能点自己牌上的符号，牌会叠给座位顺序上第一个有这个符号的人。</li>' +
    '</ol><p>说明书没写清楚，这里按官方规则：混乱高塔结束时数自己面前的全部牌，开局发的那张也算。</p></div></details>' +
    '<details class="more"><summary>小窍门</summary><div><ul>' +
    '<li>先盯住一张卡上的<b>一个</b>符号，去另一张卡上找；没有就换下一个。</li>' +
    '<li>先认<b>颜色</b>，比认形状快。别管方向，倒过来它还是它。</li>' +
    '<li>大符号最抢眼，可答案大小是随机的，小符号也要扫到。</li>' +
    '<li>混乱高塔和水井：中间那张一换，马上重新看，别还盯着旧的。</li>' +
    '<li>烫手山芋：你的牌能和任何人比，别只盯一家。</li>' +
    '</ul></div></details><div class="reftail"></div>';
  R.innerHTML = html;
  $$('.rchip', R).forEach(function (b) { b.addEventListener('click', function () { setRefMode(b.getAttribute('data-m')); }); });
  setRefMode(refMode);
}
function setRefMode(m) {
  refMode = m; store.set('refMode', m);
  $$('#refIn .rchip').forEach(function (b) { var on = b.getAttribute('data-m') === m; b.setAttribute('aria-selected', String(on)); });
  $$('#refIn .rcard').forEach(function (c) { c.classList.toggle('on', c.getAttribute('data-m') === m); });
}
buildRef();

/* ================================================================ boot */
(function boot() {
  var firstUndone = progress.done.indexOf(false);
  if (progress.finished) {
    lessonGo(0, 0);
    showTab('play'); showScreen('setup');
  } else {
    showTab('tutorial');
    lessonGo(firstUndone < 0 ? 0 : firstUndone, 0);
    showScreen('setup');
  }
})();

/* ================================================================ test hook */
function activeTable() { return currentTab === 'tutorial' ? tut.table : (currentTab === 'play' ? play.table : null); }
window.GameDebug = {
  setSpeed: function (f) {
    debugSpeed = Math.max(0, +f || 0); applyAnimVar();
    // the double-tap guard and the fresh-card grace scale with the test speed (0 = none)
    tapGuard.until = Math.min(tapGuard.until, now() + T(400));
    [tut.table, play.table].forEach(function (tb) { if (tb) tb.readyAt = Math.min(tb.readyAt, now() + T(350)); });
    [tut.table, play.table].forEach(function (tb) { if (tb && tb.botsOn) { tb.stopBots(); tb.syncBots(); } });
  },
  getSpeed: function () { return debugSpeed; },
  getState: function () {
    var tb = activeTable();
    return JSON.parse(JSON.stringify({
      tab: currentTab, lesson: tut.L + 1, step: tut.S + 1, steps: LESSONS[tut.L].steps.length, stepDone: tut.done,
      screen: play.screen, mode: play.mode, evening: play.evening, wins: play.session.wins, progress: progress,
      game: tb ? tb.s : null, human: tb ? tb.human : null, frozen: tb ? tb.frozen : null, times: tb ? tb.times : null,
      paused: play.table ? play.table.paused : null, ask: !!play.ask, elapsed: play.table ? Math.round(play.table.elapsed()) : null,
      coach: !!play.coach, coached: coached
    }));
  },
  lesson: function (i, step) { showTab('tutorial'); lessonGo(Math.max(0, Math.min(LESSONS.length - 1, (i | 0) - 1)), step ? step - 1 : 0); return this.getState(); },
  lessons: function () { return LESSONS.map(function (l) { return { title: l.title, steps: l.steps.length }; }); },
  table: function () { return activeTable(); },
  bots: function (on) { var tb = activeTable(); if (!tb) return false; if (tb === tut.table) tut.botsWanted = !!on; else play.botsWanted = !!on; tb.setBots(!!on); return true; },
  solve: function () {
    var tb = activeTable(); if (!tb || tb.human < 0) return null;
    var c = E.comparisons(tb.s, tb.human);
    return c.length ? { sym: c[0].sym, other: c[0].other, a: c[0].a, b: c[0].b, all: c } : null;
  },
  // click the right symbol on the human's own card (real DOM click)
  // ready(): would a real tap be accepted right now? (not locked, not frozen, past the double-tap guard)
  ready: function () { var tb = activeTable(); return !!tb && !tb.lock && !tb.paused && now() >= tb.readyAt && !inputGuarded() && !((tb.frozen[tb.human] || 0) > now()); },
  tapCorrect: function () {
    var tb = activeTable();
    if (!this.ready()) return false;
    var sol = this.solve(); if (!sol) return false;
    var el = document.querySelector('.tbl .dcard.ia[data-cardid="' + sol.a + '"] button.sym[data-sym="' + sol.sym + '"]');
    if (!el) return false;
    el.click(); return true;
  },
  tapWrong: function () {
    var tb = activeTable();
    if (!tb || tb.lock || tb.paused || now() < tb.readyAt || inputGuarded()) return false;
    var sol = this.solve(); if (!sol) return false;
    var good = sol.all.map(function (c) { return c.sym; });
    var btn = $$('.tbl .dcard.ia[data-cardid="' + sol.a + '"] button.sym').filter(function (b) { return good.indexOf(+b.getAttribute('data-sym')) < 0; })[0];
    if (!btn) return false;
    btn.click(); return +btn.getAttribute('data-sym');
  },
  // start a 实战 game from engine options (e.g. a stacked deck to force a tie); same end/tiebreak flow
  startCustom: function (engineOpts) {
    showTab('play'); play.evening = null;
    var o = Object.assign({ seed: 1, players: playersList() }, engineOpts);
    startSingle(o.mode, E.newGame(o));
    return this.getState();
  },
  noAuto: function (on) { debugNoAuto = !!on; },
  // jump to the end of an evening where 你/小东/小西 each won one mini-game (overall tie path)
  eveningTie: function () {
    showTab('play');
    play.evening = { queue: ['tower', 'well', 'potato'], idx: 3, wins: { '你': 1, '小东': 1, '小西': 1 },
      results: [{ mode: 'tower', winner: '你' }, { mode: 'well', winner: '小东' }, { mode: 'potato', winner: '小西' }] };
    showEveningResult();
    return this.getState();
  },
  botMove: function (p) { var tb = activeTable(); return tb ? tb.forceMove(p) : false; },
  start: function (opts) {
    opts = opts || {};
    ['mode', 'opp', 'bot', 'deck', 'rounds', 'practice'].forEach(function (k) { if (opts[k] != null) prefs[k] = opts[k]; });
    if (opts.coach != null) prefs.coach = !!opts.coach;
    showTab('play'); syncSetup(); startFromSetup();
    return this.getState();
  },
  E: E
};
})();
