// 第 8 课「上真桌子」：网页替你做的事 → 真牌上自己做（速查的「开局步骤」是同一套，按顺序写）
function realTableHTML() {
  return `<div class="wbox"><h3>上真桌子</h3><ol class="wlist">
    <li><b>开局</b>：108张牌全部洗匀，面朝下放中间当抽牌堆，谁发都行。每人摸：<span class="nw">2人10张</span> · <span class="nw">3人9张</span> · <span class="nw">4人8张</span> · <span class="nw">5人7张</span>，别给别人看。备好纸笔。</li>
    <li><b>出牌</b>：每人选1张，面朝下放在自己面前；大家都放好了，一起翻开。</li>
    <li><b>传牌</b>（网页的传送带）：翻开后，大家一起把剩下的手牌递给左手边的人。</li>
    <li><b>摆牌</b>（网页的自动分组）：同类的牌摆在一起，手握直接压在芥末上。</li>
    <li><b>筷子</b>：先选1张面朝下放好，喊「Sushi Go!」，再选1张；翻开后自己把筷子放进要传出去的手牌。</li>
    <li><b>记分</b>（网页的计分表）：回合结束每人报分，一个人用纸笔记下来。<b>记完再弃牌</b>，弃了就算不回来了。布丁留在面前。</li>
    <li><b>下一回合</b>：从剩下的抽牌堆接着摸，不重新洗。</li>
  </ol></div>`;
}

function menuHTML(T, all) {
  const seen = T.data.seen || {};
  const cur = T.data.menuCur;
  const items = MENU.map((m, i) => `<button class="mitem ${seen[i] ? 'seen' : ''}" data-wact="menu" data-i="${i}" aria-pressed="${cur === i}" aria-label="${m.k}">${cardDiv(m.t)}</button>`).join('');
  let detail = '<div class="mdetail" aria-live="polite"><p style="color:var(--soy-3);align-self:center">点下面任意一张牌，这里会告诉你它怎么得分。</p></div>';
  if (cur != null) {
    const m = MENU[cur];
    detail = `<div class="mdetail" aria-live="polite">${cardDiv(m.t)}<div><h3>${m.k}</h3><p>${m.d}</p><p class="ex">${m.ex}</p><p class="en">真牌卡面上的英文：<b>${m.en}</b></p>${m.also ? `<div style="display:flex;gap:6px;margin-top:6px">${m.also.map((t) => mini(t)).join('')}<span style="font-size:12px;color:var(--soy-2);align-self:center">鲑鱼2 · 鸡蛋1</span></div>` : ''}</div></div>`;
  }
  const n = Object.keys(seen).length;
  return `<div class="menuwrap">${detail}<div class="menucol"><div class="menu">${items}</div><div class="seen-count">${all || n >= MENU.length ? '8种都看过了。共108张牌。' : `已看${n}/8`}</div></div></div>`;
}

  { g: 'sashimi', cards: ['sashimi', 'sashimi'], name: '刺身2张', pts: 0, desc: '没凑齐3张 = 0',
    q: '2张刺身呢？', opts: quiz([['0分', true, '对！刺身要3张一套才10分；2张 = 0。'], ['10分', false, '还差1张！刺身凑齐3张才算，2张 = 0。'], ['6分', false, '刺身不按张数给分：3张一套10分，不满一套 = 0。']]) },
  { g: 'nigiri', cards: ['wasabi', 'salmon'], name: '芥末+鲑鱼手握', pts: 6, desc: '鲑鱼在芥末上：2×3 = 6' },
  { g: 'pudding', cards: ['pudding'], name: '布丁', pts: null, desc: '现在不算！留到游戏结束' },

function tallyHTML(T, finished, cleared) {
  const k = finished ? TALLY.length : T.data.tally;
  const sum = TALLY.slice(0, k).reduce((a, r) => a + (r.pts || 0), 0);
  const rows = TALLY.map((r, i) => {
    if (cleared && r.g !== 'pudding') return '';
    const done = i < k, cur = i === k;
    const cards = r.g === 'nigiri' ? `<span class="pair" style="display:inline-flex">${mini('wasabi')}<span style="margin-left:-12px;transform:translateY(-5px) rotate(6deg);display:inline-block">${mini('salmon', '<span class="x3">×3</span>')}</span></span>` : r.cards.map((t) => mini(t)).join('');
    const val = done ? (r.pts == null ? '—' : r.pts) : '?';
    return `<button class="trow ${done ? 'done' : ''} ${cur ? 'cur spot' : ''}" data-wact="tally" data-i="${i}" data-g="${r.g}" aria-label="${r.name}">` +
      `<span class="tl"><span class="tc">${cards}</span><span><span class="tn">${r.name}</span><br><span class="tx">${done || cleared ? r.desc : (cur ? '点这里算分' : '')}</span></span></span>` +
      `<span class="tv ${done ? '' : 'q'}">${cleared ? '' : val}</span></button>`;
  }).join('');
  if (cleared) {
    return `<div class="wbox"><h3>第2回合开始前，你面前</h3><div class="pudarea">${mini('pudding')}<span><b>布丁1张</b>：留在你面前。3个回合的布丁一起攒，游戏结束才计分。</span></div>` +
      `<p style="margin:10px 0 0;font-size:13px;color:var(--soy-2)">其他8张（寿司卷、天妇罗、刺身、芥末、鲑鱼手握）都弃掉了，这一局不会再出现。</p></div>`;
  }
  return `<div class="wbox"><h3>你的桌面（第1回合结束）</h3><div class="tally">${rows}</div>` +
    `<div class="tsum"><span>本回合合计</span><b>${sum}</b></div>` +
    (finished ? `<div style="text-align:right;margin-top:6px"><button class="btn primary" data-wact="clear" data-act="clear">收拾桌面</button></div>` : '') + '</div>';
}

const Tut = {
  li: 0, si: 0, gen: 0, st: null, view: null, data: {}, stepDone: false, snaps: {}, locked: false, note: null, menuSeen: {},
  init() {
    this.stage = $('#l-stage');
    this.edu = h('<div class="edu" style="margin-bottom:8px;font-size:13px;color:var(--soy-2)"></div>');
    this.tableHost = h('<div></div>');
    this.widgetHost = h('<div class="widget"></div>');
    this.stage.append(this.edu, this.widgetHost, this.tableHost);
    this.view = new TableView(this.tableHost);
    this.view.handler = (a, d, el) => this.onAct(a, d, el);
    this.widgetHost.addEventListener('click', (e) => {
      const b = e.target.closest('[data-wact]');
      if (b && !this.locked) this.onWidget(b.dataset.wact, b.dataset, b);
    });
    $('#l-prev').addEventListener('click', () => this.prev());
    $('#l-next').addEventListener('click', () => this.next());
    $('#l-skip').addEventListener('click', () => this.skip());
    $('#l-opts').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) this.answer(+b.dataset.i, b); });
    $('#l-cta').addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'next') this.next();
      if (b.dataset.act === 'start-play') this.finishAll();
    });
    $('#lmap').addEventListener('click', (e) => { const b = e.target.closest('[data-l]'); if (b) this.open(+b.dataset.l); });
    // 字体后台加载完、转屏：课名重新量一次
    window.addEventListener('resize', () => this.fitTitle());
    if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => this.fitTitle());
    this.renderMap();
  },
  get lesson() { return LESSONS[this.li]; },
  get step() { return this.lesson.steps[this.si]; },
  done() { return store.get('lessonsDone', []); },
  renderMap() {
    const done = this.done();
    $('#lmap').innerHTML = LESSONS.map((L, i) => `<li><button data-l="${i}" class="${done.indexOf(i) >= 0 ? 'done' : ''}" ${i === this.li ? 'aria-current="step"' : ''} aria-label="第${i + 1}课：${L.title}${done.indexOf(i) >= 0 ? '（已完成）' : ''}">` +
      `<span class="ln">${i + 1}</span><span class="lt"><span class="short">${L.short}</span><span class="full">${L.title}</span></span>${done.indexOf(i) >= 0 ? '<span class="tick" aria-hidden="true">✓</span>' : ''}</button></li>`).join('');
    const cur = $('#lmap [aria-current]');
    if (cur && cur.scrollIntoView && window.innerWidth < 980) { const m = $('.lmap'); m.scrollLeft = Math.max(0, cur.parentElement.offsetLeft - 16); }
  },
  open(li, si) {
    this.li = Math.max(0, Math.min(LESSONS.length - 1, li));
    this.si = si || 0;
    this.data = {};
    this.snaps = {};
    this.menuSeen = {};
    this.st = null;
    this.view.state = null;
    this.renderMap();
    if (window.scrollY > 0 && currentTab === 'learn') window.scrollTo({ top: 0 });
    this.enter();
  },
  snapshot() { return { st: this.st ? E.clone(this.st) : null, data: JSON.parse(JSON.stringify(this.data)), ui: JSON.parse(JSON.stringify(this.view.ui || {})), dash: this.view.dashOff }; },
  enter(fromSnap) {
    this.gen++;
    this.locked = false; this.view.busy = false; this.note = null;
    // 连点「下一步」：第二下不会落到新一步的按钮/选项上。
    // 例外：「用筷子」原地变成「不用筷子」、下一步紧接着就要点芥末——只挡这个按钮的第二下，马上点牌照常算
    if (this.quickAct) TapGuard.armAct(this.quickAct); else TapGuard.arm('learn');
    this.quickAct = null;
    const S = this.step;
    if (fromSnap) {
      this.st = fromSnap.st; this.data = fromSnap.data; this.view.ui = fromSnap.ui; this.view.dashOff = fromSnap.dash || 0;
    } else {
      this.snaps[this.si] = this.snapshot();
    }
    this.data.answers = {}; this.data.tallyAns = {};
    if (S.setup) S.setup(this);
    this.stepDone = S.expect === 'next';
    if (S.expect === 'menu') {
      // 菜单看过哪几张记在步骤快照外面：「上一步」回来不用重新点8张
      this.data.seen = Object.assign({}, this.menuSeen);
      this.stepDone = Object.keys(this.data.seen).length >= MENU.length;
    }
    const ui = this.view.ui;
    if (this.st && S.view !== 'widget') {
      Object.assign(ui, { selected: [], actions: [], abText: S.expect === 'next' ? '读完点上面的「下一步」。' : (S.expect === 'quiz' ? '在上面选一个答案。' : ''), handLocked: true, focus: S.focus || null, groupsClickable: false, hidePts: !!S.hidePts });
      if (!S.keepChop) ui.chopMode = false;
      if (S.expect === 'pick' || S.expect === 'pickAny') {
        ui.handLocked = false;
        ui.actions = [{ act: 'go', label: '出这张', cls: 'primary', disabled: true }];
        ui.abText = '点一张牌选中它。';
      } else if (S.expect === 'chop') {
        ui.handLocked = false;
        ui.actions = [{ act: 'chop', label: '用筷子', cls: 'green' }, { act: 'go', label: '出这张', cls: 'primary', disabled: true }];
        ui.abText = '你有筷子：可以一轮拿2张。';
      } else if (S.expect === 'chopPair') {
        ui.handLocked = false; ui.chopMode = true;
        ui.actions = [{ act: 'chop', label: '不用筷子', cls: '' }, { act: 'go', label: 'Sushi Go! 出2张', cls: 'primary', disabled: true }];
        ui.abText = '用筷子：按顺序选2张（先选的先放到桌上）。';
      } else if (S.expect === 'btn') {
        if (S.keepChop) { ui.handLocked = true; ui.selected = this.data.chopSel ? this.data.chopSel.slice() : []; }
        ui.actions = [{ act: S.btn, label: S.btnLabel, cls: 'primary' }];
        if (S.btn === 'go') ui.abText = this.data.chopSel ? `筷子：1. ${nameOf(this.typeOf(this.data.chopSel[0]))}，2. ${nameOf(this.typeOf(this.data.chopSel[1]))}` : '';
      } else if (S.expect === 'group') {
        ui.groupsClickable = true;
      }
      if (this.st.phase === 'roundEnd') ui.handEmptyText = '这一回合的手牌出完了。';
      this.view.render(this.st, ui);
    }
    this.renderStage();
    this.renderCoach();
    this.updateNav();
    this.scrollToFocus();
    if (S.expect === 'wbtn') this.scrollToEl($(`[data-wact="${S.wbtn}"]`, this.widgetHost));
  },
  scrollToFocus(onlyIfHidden) {
    // 手机上：让要操作的区域刚好出现在（吸顶的）教练气泡下面
    if (window.innerWidth >= 720 || currentTab !== 'learn') return;
    const S = this.step;
    if (S.view === 'widget' && this.si === 0 && !onlyIfHidden) return;
    let target = this.stage;
    if (S.view !== 'widget' && S.focus && S.focus.regions) {
      const els = S.focus.regions.map((r) => $(`[data-region="${r}"]`, this.view.el)).filter(Boolean);
      if (els.length) target = els.sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top)[0];
      if (S.focus.spot && S.expect === 'quiz') target = $(S.focus.spot, this.view.el) || target;
    }
    if (onlyIfHidden) {
      const stickyBottom = $('.lsticky').getBoundingClientRect().bottom;
      if (target.getBoundingClientRect().top >= stickyBottom - 4) return;
    }
    const top = $('.topbar').offsetHeight + $('.lsticky').offsetHeight + 8;
    let dy = target.getBoundingClientRect().top - top;
    // 要你点牌的步骤：整手牌必须露在吸底操作条上面；屏幕太矮时让上面的对手/传送带滑走一点
    if (!onlyIfHidden && S.view !== 'widget' && ['pick', 'pickAny', 'chopPair'].indexOf(S.expect) >= 0) {
      const hand = $('[data-region="hand"]', this.view.el), bar = $('.actionbar', this.view.el);
      if (hand && bar) {
        const r = hand.getBoundingClientRect();
        const bottomEdge = window.innerHeight - bar.offsetHeight - 6;
        if (r.bottom - dy > bottomEdge) dy = Math.min(r.bottom - bottomEdge, r.top - top);
      }
    }
    window.scrollTo({ top: Math.max(0, window.scrollY + dy), behavior: 'auto' });
  },
  // 手机上把某个元素（计分表亮着的那一行、「收拾桌面」按钮）滚到教练气泡下面、屏幕底边以上
  scrollToEl(el) {
    if (!el || window.innerWidth >= 720 || currentTab !== 'learn') return;
    const top = $('.topbar').offsetHeight + $('.lsticky').offsetHeight + 8;
    const r = el.getBoundingClientRect();
    let dy = 0;
    if (r.bottom > window.innerHeight - 10) dy = r.bottom - (window.innerHeight - 10);
    if (r.top - dy < top) dy = r.top - top;
    if (Math.abs(dy) >= 2) window.scrollTo({ top: Math.max(0, window.scrollY + dy), behavior: 'auto' });
  },
  typeOf(id) { const c = this.st.players[0].hand.find((x) => x.id === id) || this.st.players[0].table.find((x) => x.id === id); return c ? c.t : 'tempura'; },
  renderStage() {
    const S = this.step;
    const showTable = S.view === 'table' || S.view === 'both';
    const showWidget = S.view === 'widget' || S.view === 'both';
    this.tableHost.hidden = !showTable;
    this.widgetHost.hidden = !showWidget;
    this.edu.hidden = !showTable;
    if (showTable) this.edu.innerHTML = `<span class="edu-tag">教学局</span>3人 · 规则和正式局一样`;
    if (showWidget) this.widgetHost.innerHTML = S.widget ? S.widget(this) : '';
    if (showTable) this.view.layoutBelt();
  },
  renderCoach() {
    const S = this.step, L = this.lesson;
    $('#l-title').innerHTML = `<span class="lnum">${this.li + 1}</span>${esc(L.title)}`;
    $('#l-step').textContent = `${this.si + 1}/${L.steps.length}`;
    this.fitTitle(); // 步数（「1/5」「2/5」宽度不一样）先写好再量
    $('#l-say').innerHTML = typeof S.say === 'function' ? S.say(this) : S.say;
    const nt = this.note;
    $('#l-note').innerHTML = nt ? `<p class="note ${nt.cls}">${nt.html}</p>` : '';
    // 脚注放在画面下面（不放进吸顶的教练气泡里，手机上气泡别太高）
    $('#l-foot').innerHTML = S.foot && (this.stepDone || S.expect === 'next') ? `<p class="foot">${S.foot}</p>` : '';
    const opts = $('#l-opts');
    if (S.expect === 'quiz') {
      const ans = this.data.answers || {};
      // 选项位置固定打乱；答对以后只留下正确的那个（气泡变矮，下面的图能露出来）
      const order = seededOrder(`q${this.li}.${this.si}`, S.quiz.length).filter((i) => !this.stepDone || S.quiz[i].ok);
      opts.innerHTML = order.map((i) => { const o = S.quiz[i]; return `<button class="btn ${ans[i] === true || (this.stepDone && o.ok) ? 'right' : ans[i] === false ? 'wrong' : ''}" data-i="${i}" ${this.stepDone ? 'disabled' : ''}>${this.stepDone ? '✓ ' : ''}${o.t}</button>`; }).join('');
    } else if (S.expect === 'tally' && this.data.tallyQ != null) {
      const r = TALLY[this.data.tallyQ];
      const ans = this.data.tallyAns || {};
      opts.innerHTML = `<div style="font-weight:700">${r.q}</div>` + seededOrder('t' + this.data.tallyQ, r.opts.length).map((i) => `<button class="btn ${ans[i] === false ? 'wrong' : ''}" data-i="${i}">${r.opts[i].t}</button>`).join('');
    } else opts.innerHTML = '';
    const cta = $('#l-cta');
    const last = this.si === L.steps.length - 1;
    if (S.expect === 'final') cta.innerHTML = '';
    else if (this.stepDone && !this.locked) cta.innerHTML = `<button class="btn primary" data-act="next">${last ? (this.li === LESSONS.length - 1 ? '完成' : '下一课 →') : '下一步 →'}</button>`;
    else cta.innerHTML = '';
  },
  // 课名永远一行：窄屏放不下（「天妇罗·刺身·煎饺」）就把字缩小一点，不让最后一个字掉到第二行、把吸顶气泡撑高
  // 量的是文字的实际宽度（带小数）：差不到1px也会被「…」截掉，所以留半个像素的余量，缩完再量一次
  fitTitle() {
    const t = $('#l-title');
    t.style.fontSize = '';
    const box = t.getBoundingClientRect().width;
    if (!box) return;
    t.style.textOverflow = 'clip'; // 量的时候别让「…」先把字截短
    const rg = document.createRange();
    const need = () => { rg.selectNodeContents(t); return rg.getBoundingClientRect().width; };
    let w = need();
    if (w > box - 0.5) {
      let fs = parseFloat(getComputedStyle(t).fontSize);
      fs = Math.max(12, Math.floor(2 * fs * (box - 1) / w) / 2);
      t.style.fontSize = fs + 'px';
      while (fs > 12 && (w = need()) > box - 0.5) { fs -= 0.5; t.style.fontSize = fs + 'px'; }
    }
    t.style.textOverflow = '';
  },
  updateNav() {
    $('#l-prev').disabled = this.si === 0 || this.locked;
    $('#l-next').disabled = !this.stepDone || this.locked || this.step.expect === 'final';
    const sk = this.li === LESSONS.length - 1 || window.innerWidth < 720 ? '跳过' : '跳过本课';
    if ($('#l-skip').textContent !== sk) { $('#l-skip').textContent = sk; this.fitTitle(); } // 按钮变宽：课名重新量
  },
  setNote(html, cls, el) {
    this.note = { html, cls };
    this.renderCoach();
    if (el && el.classList) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    if (window.innerWidth < 720 && !this.locked) this.scrollToFocus(true);
  },
  checker() { const gen = this.gen; return () => { if (gen !== this.gen) throw CANCEL; }; },
  async complete(arg) {
    const S = this.step;
    const ck = this.checker();
    this.stepDone = true;
    if (S.after) {
      this.locked = true; this.view.busy = true;
      this.view.ui.actions = []; this.view.renderActions();
      this.renderCoach(); this.updateNav();
      try { await S.after(this, ck, arg); } catch (e) { if (e === CANCEL) return; throw e; }
      if (!this.alive(ck)) return;
      this.locked = false; this.view.busy = false;
    }
    if (S.stay) { this.renderCoach(); this.updateNav(); return; }
    this.go(this.si + 1);
  },
  alive(ck) { try { ck(); return true; } catch (e) { return false; } },
  go(si) {
    if (si >= this.lesson.steps.length) { this.finishLesson(); return; }
    this.si = si;
    this.enter();
  },
  next() {
    if (!this.stepDone || this.locked) return;
    this.go(this.si + 1);
  },
  prev() {
    if (this.si === 0 || this.locked) return;
    const snap = this.snaps[this.si - 1];
    this.si -= 1;
    if (snap) this.enter(JSON.parse(JSON.stringify(snap))); else this.enter();
    if (this.step.expect !== 'next' && this.step.expect !== 'menu') { this.stepDone = false; this.renderCoach(); this.updateNav(); }
  },
  skip() {
    if (this.li < LESSONS.length - 1) this.open(this.li + 1);
    else this.finishAll(true);
  },
  markDone(li) {
    const done = this.done();
    if (done.indexOf(li) < 0) { done.push(li); store.set('lessonsDone', done); }
  },
  finishLesson() {
    this.markDone(this.li);
    if (this.li < LESSONS.length - 1) this.open(this.li + 1);
    else this.finishAll();
  },
  finishAll(skipped) {
    if (!skipped) this.markDone(LESSONS.length - 1);
    if (!skipped || this.done().length >= LESSONS.length) store.set('tutorialDone', true);
    this.renderMap();
    // 实战里还有一局没打完：不悄悄丢掉，回到实战后先问「继续这一局」还是放弃
    const live = Game.inProgress();
    if (!live) Game.showSetup();
    showTab('play', { noUnpark: live, hold: live });
    if (live) Game.askResume();
  },
  // ---------------------------------------------------------------- 场景 & 动作
  scene(spec, label) {
    this.st = E.scenario(Object.assign({ names: NAMES3 }, spec));
    this.data.sceneLabel = label || '';
    this.view.dashOff = 0;
    this.view.ui = TableView.freshUI();
    this.view.ui.msg = label ? `${esc(label)}<br><span class="dir">传给左边：小东 ↻</span>` : '';
    this.view.render(this.st, this.view.ui);
  },
  setBots(spec) {
    const st = this.st;
    for (let p = 1; p < st.players.length; p++) {
      if (st.players[p].pick) continue;
      const t = spec && spec !== 'ai' ? spec[p] : null;
      const c = t ? st.players[p].hand.find((x) => x.t === t) : null;
      E.setPick(st, p, c ? [c.id] : E.botPick(st, p));
    }
  },
  onAct(act, d, el) {
    if (this.locked) return;
    const S = this.step, ui = this.view.ui, st = this.st;
    if (!st) return;
    const me = st.players[0];
    if (S.expect === 'pick' || S.expect === 'pickAny') {
      if (act === 'card') {
        const id = +d.id;
        ui.selected = ui.selected[0] === id ? [] : [id];
        ui.actions = [{ act: 'go', label: '出这张', cls: 'primary', disabled: !ui.selected.length }];
        ui.abText = ui.selected.length ? gainText(st, 0, d.t) : '点一张牌选中它。';
        this.view.renderHand(); this.view.renderActions();
      } else if (act === 'go' && ui.selected.length) {
        const c = me.hand.find((x) => x.id === ui.selected[0]);
        if (S.expect === 'pick' && c.t !== S.pick) {
          const msg = (S.wrong && (S.wrong[c.t] || S.wrong.default)) || `这一步要练的是${E.TYPES[S.pick].name}。`;
          ui.selected = []; ui.actions = [{ act: 'go', label: '出这张', cls: 'primary', disabled: true }]; ui.abText = '再选一次。';
          this.view.renderHand(); this.view.renderActions();
          this.setNote(msg, 'bad', $(`.card[data-id="${c.id}"]`, this.view.hand));
          return;
        }
        this.note = null;
        this.complete();
      }
      return;
    }
    if (S.expect === 'chop') {
      if (act === 'chop') { ui.chopMode = true; this.note = null; this.quickAct = 'chop'; this.complete(); this.quickAct = null; }
      else if (act === 'card') this.setNote(S.wrongCard, 'bad', el);
      return;
    }
    if (S.expect === 'chopPair') {
      if (act === 'chop') { this.setNote('这一课就是练筷子，留着它：先点<b>芥末</b>，再点<b>鱿鱼手握</b>。', 'bad', el); return; }
      if (act !== 'card') return;
      const id = +d.id, t = d.t;
      const [a, b] = S.pair;
      if (ui.selected.indexOf(id) >= 0) { ui.selected = ui.selected.filter((x) => x !== id); this.view.renderHand(); return; }
      if (!ui.selected.length) {
        if (t === a) { ui.selected = [id]; this.note = null; this.renderCoach(); }
        else if (t === b) { this.setNote('先拿手握的话，芥末还没放下，鱿鱼就只值3分。<b>先点芥末</b>。', 'bad', el); return; }
        else { this.setNote('这次试试<b>芥末+鱿鱼手握</b>的组合：一轮拿到9分！先点芥末。', 'bad', el); return; }
      } else if (t === b) {
        ui.selected.push(id);
        this.data.chopSel = ui.selected.slice();
        this.view.renderHand();
        this.complete();
        return;
      } else { this.setNote('第二张选<b>鱿鱼手握</b>，让它落在芥末上。', 'bad', el); return; }
      ui.abText = `筷子：1. ${nameOf(t)}，再选1张`;
      this.view.renderHand(); this.view.renderActions();
      return;
    }
    if (S.expect === 'btn') {
      if (act === S.btn) { this.note = null; this.complete(); }
      else if (act === 'card') this.setNote(`现在点下面的<b>「${S.btnLabel}」</b>。`, 'bad', el);
      return;
    }
    if (S.expect === 'group') {
      if (act === 'group' && d.g === S.group) { this.note = null; this.complete(); }
      else if (act === 'group' || act === 'card') this.setNote(S.wrongGroup, 'bad', el);
      return;
    }
    if (act === 'card' && S.expect === 'next') this.setNote('这一步先看说明，看完点<b>「下一步」</b>。', 'info', null);
  },
  onWidget(act, d, el) {
    const S = this.step;
    if (act === 'menu' && S.expect === 'menu') {
      const i = +d.i;
      this.data.seen = this.data.seen || {};
      this.data.seen[i] = true;
      this.menuSeen[i] = true;
      this.data.menuCur = i;
      this.renderStage();
      const btn = $(`.mitem[data-i="${i}"]`, this.widgetHost);
      if (btn) btn.focus({ preventScroll: true });
      if (Object.keys(this.data.seen).length >= MENU.length && !this.stepDone) {
        this.stepDone = true;
        this.setNote('8种都看过了！不用背：实战时下面会提示；真牌的卡面上也印着得分（英文，比如「SASHIMI ×3=10」）。', 'good');
        this.updateNav();
      }
      return;
    }
    if (act === 'menu' && S.expect === 'next') { this.data.menuCur = +d.i; this.renderStage(); return; }
    if (act === 'tally' && S.expect === 'tally') {
      const i = +d.i, k = this.data.tally;
      if (this.data.tallyQ != null) { this.setNote('先回答上面的问题。', 'bad', el); return; }
      if (i !== k) { this.setNote(`按顺序来：先算亮着的<b>${TALLY[k].name}</b>。`, 'bad', el); return; }
      if (TALLY[k].q) { this.data.tallyQ = k; this.data.tallyAns = {}; this.note = null; this.renderCoach(); return; }
      this.advanceTally();
      return;
    }
    if (act === 'clear' && S.expect === 'wbtn' && S.wbtn === 'clear') { this.complete(); return; }
    if (act === 'start-play' && S.expect === 'final') { this.finishAll(); }
  },
  advanceTally(why) {
    const r = TALLY[this.data.tally];
    this.data.tally += 1;
    this.data.tallyQ = null;
    TapGuard.arm('learn'); // 连点同一行：第二下不会变成「按顺序来」的错误
    this.renderStage();
    this.setNote(why || `<b>${r.name}</b>：${r.desc}${r.pts != null ? `，<b>${r.pts}分</b>` : ''}。`, 'good');
    if (this.data.tally >= TALLY.length) {
      this.stepDone = true;
      this.setNote('全部算完：<span class="nw">3 + 5 + 0 + 6 = <b>14分</b></span>。布丁不在这里算。', 'good');
      this.updateNav();
    }
    // 下一行亮起来时可能在屏幕下面：滚到看得见
    this.scrollToEl($('.trow.cur', this.widgetHost) || $('.tsum', this.widgetHost));
  },
  answer(i, btn) {
    const S = this.step;
    if (this.locked) return;
    if (S.expect === 'tally' && this.data.tallyQ != null) {
      const r = TALLY[this.data.tallyQ];
      const o = r.opts[i];
      if (o.ok) this.advanceTally(o.why);
      else { this.data.tallyAns[i] = false; this.setNote(o.why, 'bad', btn); }
      return;
    }
    if (S.expect !== 'quiz' || this.stepDone) return;
    const o = S.quiz[i];
    this.data.answers = this.data.answers || {};
    this.data.answers[i] = o.ok;
    if (o.ok) {
      this.stepDone = true;
      TapGuard.arm('learn');
      if (S.onRight) S.onRight(this);
      // 测验时藏起来的分数（不然题目自己就把答案写出来了）：答对以后再亮出来当确认
      if (this.view.ui.hidePts && S.view !== 'widget') { this.view.ui.hidePts = false; this.view.render(); }
      this.renderStage();
      this.setNote(o.why, 'good');
      this.updateNav();
    } else {
      this.setNote(o.why, 'bad', btn);
    }
  },
  // ---------------------------------------------------------------- 动画流程（教程用）
  async revealOnly(ck) {
    const st = this.st, v = this.view;
    const prev = E.clone(st);
    v.ui.msg = '大家一起翻开！';
    const info = E.resolvePicks(st);
    this.data.info = info;
    await v.revealAnim(prev, st, info); ck();
    v.ui.msg = '翻开了！<br><span class="dir">传给左边：小东 ↻</span>';
    v.msgEl.innerHTML = v.ui.msg;
    return info;
  },
  async passOnly(ck) {
    const st = this.st, v = this.view;
    const info = this.data.info || st.last;
    if (info && info.plays.some((p) => p.chopsticks != null && p.p !== 0)) { await v.chopReturnAnim({ plays: info.plays.filter((p) => p.p !== 0) }); ck(); }
    if (st.players.every((p) => p.hand.length === 0) && !st.players.some((p) => p.table.some((c) => c.pendingReturn))) {
      E.passHands(st);
      v.ui.msg = '这一回合结束了！';
      v.ui.handEmptyText = '这一回合的手牌出完了。';
      v.render(st);
      return;
    }
    const n = st.players.length, dir = info ? info.dir : 1;
    v.ui.msg = `把手牌传给左边的<b>${esc(st.players[(dir + n) % n].name)}</b>`;
    v.msgEl.innerHTML = v.ui.msg;
    await wait(200); ck();
    await v.handToPlate(); ck();
    E.passHands(st);
    await v.beltMove(dir); ck();
    const from = st.last.from[0];
    const ui = TableView.freshUI();
    ui.handFrom = from;
    ui.msg = `你收到<b>${esc(st.players[from].name)}</b>的手牌<br><span class="dir">传给左边：小东 ↻</span>`;
    v.render(st, ui);
    await v.plateToHand(); ck();
  },
  async humanTurn(ck, ids, bots) {
    const st = this.st, v = this.view;
    E.setPick(st, 0, ids);
    this.setBots(bots);
    await v.pickDown(ids); ck();
    for (let p = 1; p < st.players.length; p++) v.ui.opp[p] = 'ready';
    v.renderOpps();
    await wait(350); ck();
    await this.revealOnly(ck);
    await this.passOnly(ck);
  },
  async lastCardTurn(ck) {
    const st = this.st, v = this.view;
    if (st.phase !== 'pick' || st.players[0].hand.length !== 1) return;
    v.ui.abText = '最后1张：直接打出。';
    v.renderActions();
    v.ui.msg = '每人只剩1张：直接打出';
    v.msgEl.innerHTML = v.ui.msg;
    await wait(700); ck();
    st.players.forEach((pl, p) => { if (p) E.setPick(st, p, [pl.hand[0].id]); });
    await this.humanTurn(ck, [st.players[0].hand[0].id], 'ai');
  },
  async fastForward(ck) {
    const st = this.st;
    let guard = 0;
    while (st.phase === 'pick' && guard++ < 20) {
      if (st.players[0].hand.length === 1) { await this.lastCardTurn(ck); break; }
      const ids = E.botPick(st, 0);
      this.view.ui.abText = '快进中：替你选了' + ids.map((id) => nameOf(this.typeOf(id))).join('、');
      this.view.renderActions();
      await this.humanTurn(ck, ids.slice(0, 1), 'ai');
    }
  },
  async chopReveal(ck) {
    const st = this.st, v = this.view;
    const ids = this.data.chopSel;
    E.setPick(st, 0, ids);
    this.setBots({ 1: 'tempura', 2: 'maki3' });
    shout(v.abBtns, 'Sushi Go!', 1300);
    await wait(500); ck();
    await v.pickDown(ids); ck();
    for (let p = 1; p < st.players.length; p++) v.ui.opp[p] = 'ready';
    v.renderOpps();
    await wait(300); ck();
    const prev = E.clone(st);
    v.ui.msg = '大家一起翻开！';
    const info = E.resolvePicks(st, { deferChopsticks: true });
    this.data.info = info;
    await v.revealAnim(prev, st, info); ck();
    v.ui.msg = '用过的筷子 → 放回手牌';
    v.msgEl.innerHTML = v.ui.msg;
  },
  async chopReturnAndPass(ck) {
    const st = this.st, v = this.view;
    const g = $('.grp[data-g="chopsticks"]', v.groupsEl);
    const from = g ? g.getBoundingClientRect() : null;
    const id = E.returnChopsticks(st, 0);
    v.ui.groupsClickable = false;
    v.ui.handTags = { [id]: '要传出' };
    v.ui.focus = { regions: ['hand', 'mine'] };
    v.render(st);
    await v.chopReturnAnim({ plays: [{ p: 0, chopsticks: id }] }, from); ck();
    await wait(900); ck();
    await this.passOnly(ck);
  },
  async clearTable(ck) {
    const rows = $$('.trow', this.widgetHost).filter((r) => r.dataset.g !== 'pudding');
    await Promise.all(rows.map((r, i) => anim(r, [{ transform: 'translateX(0)', opacity: 1 }, { transform: 'translateX(60px)', opacity: 0 }], 380, { delay: D(i * 60), fill: 'forwards' })));
    ck();
  },
};
// 出牌类步骤：选对后真正打出这张牌（补上 after）
LESSONS.forEach((L) => L.steps.forEach((S) => {
  if ((S.expect === 'pick' || S.expect === 'pickAny') && !S.after) {
    S.after = async (T, ck) => {
      const st = T.st, v = T.view;
      const ids = v.ui.selected.slice();
      if (S.holdReveal) {
        E.setPick(st, 0, ids);
        T.setBots(S.bots);
        await v.pickDown(ids); ck();
        for (let p = 1; p < st.players.length; p++) v.ui.opp[p] = 'thinking';
        v.renderOpps();
        await wait(500); ck();
        for (let p = 1; p < st.players.length; p++) v.ui.opp[p] = 'ready';
        v.renderOpps(); v.renderPlates();
        return;
      }
      await T.humanTurn(ck, ids, S.bots);
      if (S.lastCard) await T.lastCardTurn(ck);
    };
  }
}));

function renderRef() {
  const row = (t, n, en, r) => `<li>${mini(t)}<div><div class="rn">${n}<span class="ren">${en}</span></div><div class="rr">${r}</div></div></li>`;
  // 计分格子里每一小段不拆行（窄屏上别把「鸡蛋1」「最少−6」拆成两行），只在「·」处换行
  const sc = (t, n, ...parts) => `<div class="sc">${mini(t)}<span><b>${n}</b>${parts.map((x) => `<span class="nw">${x}</span>`).join(' · ')}</span></div>`;
  // 顺序（手机上从上往下看）：开局步骤 → 计分（最常看）→ 卡牌说明 → 折叠起来的变体 / 小贴士 / 说明书没写清楚的地方
  $('#ref-body').innerHTML = `
  <div class="rbox">
    <h3>开局步骤（真牌）</h3>
    <ol class="steps">
      <li><b>洗匀</b>全部108张，面朝下放中间当<b>抽牌堆</b>。备好<b>纸笔</b>记分。</li>
      <li>每人摸手牌，别给别人看：</li>
    </ol>
    <div class="hs"><div><b>10</b>2人</div><div><b>9</b>3人</div><div><b>8</b>4人</div><div><b>7</b>5人</div></div>
    <ol class="steps" start="3">
      <li><b>每轮</b>：各选1张面朝下放在面前 → 一起翻开 → 把剩下的手牌递给<b>左手边</b>的人。最后1张直接打出。</li>
      <li>翻开的牌<b>同类摆在一起</b>，手握直接压在芥末上。</li>
      <li><b>回合结束</b>：每人报分、写在纸上，<b>记完再弃牌</b>（布丁留在面前）。共3个回合，下一回合从同一个抽牌堆接着摸，<b>不重新洗</b>。</li>
      <li><b>3个回合后</b>算布丁，剩下的抽牌堆不用了。总分最高的赢；同分比布丁多少<sup>*</sup>。</li>
    </ol>
    <p class="rnote"><b>和网页不一样</b>：没有传送带、提示和自动计分，都要自己来。用筷子要自己喊「Sushi Go!」，再自己把筷子放回要传出去的手牌。</p>
  </div>
  <div class="rbox">
    <h3>计分（每回合结束）</h3>
    <div class="sgrid">
      ${sc('maki3', '寿司卷', '标记最多6', '第二多3')}
      ${sc('tempura', '天妇罗', '每2张 = 5')}
      ${sc('sashimi', '刺身', '每3张 = 10')}
      ${sc('dumpling', '煎饺', '1', '3', '6', '10', '15')}
      ${sc('squid', '手握', '鱿鱼3', '鲑鱼2', '鸡蛋1')}
      ${sc('wasabi', '芥末', '下一张手握×3<sup>*</sup>')}
      ${sc('chopsticks', '筷子', '0分', '一轮拿2张')}
      ${sc('pudding', '布丁', '游戏结束算', '最多+6', '最少−6<sup>*</sup>')}
    </div>
    <p class="rnote">没凑齐的天妇罗、刺身 = 0；单独的芥末 = 0。布丁不在回合里算，留到游戏结束。</p>
  </div>
  <div class="rbox">
    <h3>卡牌说明</h3>
    <ul class="rlist">
      ${row('maki3', '寿司卷', 'MAKI ROLL · 26张', '卡上画着1–3个卷（标记）。比标记总数：最多<b>6</b>，第二多<b>3</b>。并列就平分（舍去小数）；并列第一时不给第二名<sup>*</sup>；0个标记不参加。')}
      ${row('tempura', '天妇罗', 'TEMPURA · 14张', '每2张<b>5</b>；单张0。')}
      ${row('sashimi', '刺身', 'SASHIMI · 14张', '每3张<b>10</b>；1、2张0。')}
      ${row('dumpling', '煎饺', 'DUMPLING · 14张', '1 / 2 / 3 / 4 / 5张以上 = <b>1 / 3 / 6 / 10 / 15</b>。')}
      ${row('squid', '手握', 'NIGIRI · 20张', '鱿鱼<b>3</b> · 鲑鱼<b>2</b> · 鸡蛋<b>1</b>；压在芥末上×3 → <b>9 / 6 / 3</b>。')}
      ${row('wasabi', '芥末', 'WASABI · 6张', '0分。之后的下一张手握<b>必须</b>压上去，×3<sup>*</sup>；一张芥末只放一张手握；之前打出的手握不挪过去。')}
      ${row('chopsticks', '筷子', 'CHOPSTICKS · 4张', '0分。之后某一轮：先选1张 → 喊「Sushi Go!」→ 再选1张，和大家一起翻开；然后把筷子<b>放回要传出去的手牌</b><sup>*</sup>（卡上写着「SWAP FOR 2」）。每轮最多用1张；手牌至少2张；当轮拿到的下一轮才能用。配芥末：先芥末、后手握才×3。')}
      ${row('pudding', '布丁', 'PUDDING · 10张', '<b>游戏结束</b>才算：最多<b>+6</b>，最少<b>−6</b><sup>*</sup>（0张也算最少）；并列平分。2人局不扣分；大家一样多都不得分。')}
    </ul>
    <p class="fn">标<sup>*</sup>的地方说明书写得不清楚，点开「说明书没写清楚的地方」看。</p>
  </div>
  <details class="rbox">
    <summary>变体（可选）</summary>
    <div class="dbody">
      <p><b>两边传递</b>：第1、3回合传给左边，第2回合传给右边。</p>
      <p><b>两人「虚拟玩家」</b>：按3人局发牌（每份9张），第三份面朝下当虚拟玩家的牌堆。两人轮流替它出牌：轮到你时先从它的牌堆摸1张放进自己手牌，然后你给自己选1张、再给虚拟玩家选1张；对手只给自己选。翻开、传牌，按正常规则计分。（网页实战用的是标准2人局：每人10张。）</p>
    </div>
  </details>
  <details class="rbox">
    <summary>上桌小贴士</summary>
    <div class="dbody"><ul>
      <li>先看别人的桌面：谁在拼刺身？谁在抢寿司卷？</li>
      <li>刺身只在剩下的轮数够时才开始拼。</li>
      <li>芥末早拿，留给鱿鱼。别把鱿鱼传给有空芥末的人。</li>
      <li>布丁至少拿1–2张：最少的−6。</li>
      <li>人少时，你传出去的牌还会转回来。</li>
    </ul></div>
  </details>
  <details class="rbox">
    <summary>说明书没写清楚的地方（5条）</summary>
    <div class="dbody">
      <p class="fn"><b>* 筷子放回手牌</b>：中文说明书漏写了这一步（卡上写着「SWAP FOR 2」）。说明书没写清楚，这里按官方规则：放回你要传出去的手牌——这样大家手牌张数才一样。</p>
      <p class="fn"><b>* 寿司卷并列第一</b>：说明书只写了「平分6分」，没说还给不给第二名。说明书没写清楚，这里按官方规则：不给。</p>
      <p class="fn"><b>* 芥末×3、布丁−6</b>：说明书上的「游戏概要」写着芥末「分数翻倍」、布丁「最少:6」，和正文对不上。以正文为准：手握压在芥末上<b>×3</b>（9 / 6 / 3），布丁最少的<b>扣6分</b>。说明书没写清楚，这里按官方规则。</p>
      <p class="fn"><b>* 布丁也一样多</b>：说明书只说同分比布丁。再一样多怎么办没写，这里按官方规则：并列获胜。</p>
      <p class="fn"><b>平分「忽略余数」</b>：舍去小数，负分也往0舍。两人分3分各1；四人分6分各1；布丁两人分−6各−3，四人分−6各−1（不是−2）。</p>
    </div>
  </details>`;
}

// =====================================================================================================
// 标签页 / 设置 / 启动
// =====================================================================================================
// opts.noUnpark：先别重新打开收起的计分弹窗；opts.hold：切过去以后实战先别动（马上要问一句）
function showTab(name, opts) {
  opts = opts || {};
  const prevTab = currentTab;
  currentTab = name;
  document.body.dataset.tab = name;
  $$('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
  ['learn', 'play', 'ref'].forEach((id) => { $('#' + id).hidden = id !== name; });
  if (name !== prevTab) {
    // 回合计分 / 结果弹窗属于实战：切走时收起来（标签上亮一个点），回到实战再打开；别的弹窗直接关掉
    if (!modal.hidden) {
      const k = modal.dataset.kind;
      if (k === 'roundEnd' || k === 'gameOver') Game.park(k); else closeModal();
    }
    $$('.ghost, .shout, .float-pts').forEach((e) => e.remove()); // 正在飞的牌、气泡不跟到别的页面
  }
  toggleSettings(false);
  if (name === 'learn') Tut.fitTitle(); // 在别的标签页上量不到宽度
  requestAnimationFrame(() => { Tut.view.layoutBelt(); Game.view.layoutBelt(); });
  if (opts.hold) Pause.hold = true;
  Game.syncParkDot();
  if (name === 'play' && !opts.noUnpark) Game.restoreSheet();
  Pause.check();
}
$$('.tab').forEach((t) => t.addEventListener('click', () => showTab(t.dataset.tab)));
$('.tabs').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const tabs = $$('.tab');
  const i = tabs.findIndex((t) => t.getAttribute('aria-selected') === 'true');
  const j = (i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
  showTab(tabs[j].dataset.tab); tabs[j].focus();
});
function toggleSettings(open) {
  const s = $('#settings'), g = $('#gear');
  const o = open == null ? s.hidden : open;
  s.hidden = !o;
  g.setAttribute('aria-expanded', String(o));
}
$('#gear').addEventListener('click', (e) => { e.stopPropagation(); toggleSettings(); });
document.addEventListener('click', (e) => { if (!$('#settings').hidden && !e.target.closest('#settings') && !e.target.closest('#gear')) toggleSettings(false); });
function syncSpeed() { $$('#speed-seg [data-speed]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.speed === userSpeed))); }
$('#speed-seg').addEventListener('click', (e) => {
  const b = e.target.closest('[data-speed]');
  if (!b) return;
  userSpeed = b.dataset.speed; store.set('speed', userSpeed); syncSpeed();
});
syncSpeed();

Tut.init();
Game.init();
renderRef();
(function boot() {
  const hash = (location.hash || '').replace('#', '');
  const done = store.get('lessonsDone', []);
  let first = LESSONS.findIndex((_, i) => done.indexOf(i) < 0);
  if (first < 0) first = 0;
  Tut.open(first);
  if (hash === 'ref') showTab('ref');
  else if (hash === 'play' || (store.get('tutorialDone', false) && hash !== 'learn')) { showTab('play'); Game.showSetup(); }
  else showTab('learn');
})();

// =====================================================================================================
// 测试钩子（普通用户看不到）
// =====================================================================================================
window.GameDebug = {
  engine: E,
  setSpeed(f) { debugSpeed = Math.max(0, Number(f) || 0); return debugSpeed; },
  getState() { const st = currentTab === 'learn' ? Tut.st : Game.st; return st ? E.clone(st) : null; },
  gameState() { return Game.st ? E.clone(Game.st) : null; }, // 实战的状态（不管现在在哪个标签页）
  tab(name) { showTab(name); return currentTab; },
  lesson(i) { showTab('learn'); Tut.open(i - 1); return this.tut(); },
  lessonCount: LESSONS.length,
  tut() {
    const S = Tut.step;
    const tq = Tut.data.tallyQ;
    return {
      lesson: Tut.li + 1, step: Tut.si + 1, steps: Tut.lesson.steps.length, expect: S.expect, view: S.view,
      pick: S.pick || null, btn: S.btn || null, group: S.group || null, pair: S.pair || null, wbtn: S.wbtn || null,
      quizRight: S.quiz ? S.quiz.findIndex((o) => o.ok) : null, quizWrong: S.quiz ? S.quiz.findIndex((o) => !o.ok) : null,
      // 屏幕上从左到右的选项顺序（data-i 序号）；quizRight/quizWrong 仍是 data-i
      quizOrder: S.quiz ? seededOrder(`q${Tut.li}.${Tut.si}`, S.quiz.length) : null,
      tallyQ: tq == null ? null : tq, tallyRight: tq == null ? null : TALLY[tq].opts.findIndex((o) => o.ok),
      done: Tut.stepDone, busy: Tut.locked, note: Tut.note ? Tut.note.html : null,
    };
  },
  lessonsDone() { return store.get('lessonsDone', []); },
  startGame(opts) { showTab('play'); Game.start(Object.assign({}, Game.cfg, opts || {})); return this.game(); },
  game() {
    const st = Game.st;
    if (!st) return { phase: 'setup' };
    return { phase: st.phase, round: st.round, turn: st.turn, myTurn: st.phase === 'pick' && !st.players[0].pick && !Game.view.busy && st.players[0].hand.length > 1,
      resolving: Game.resolving, busy: Game.view.busy, modal: modal.hidden ? null : modal.dataset.kind, parked: Game.parked, paused: Pause.on(),
      canChop: st.phase === 'pick' ? E.canUseChopsticks(st, 0) : false, totals: st.players.map((p) => p.total) };
  },
  suggest() { return Game.st && Game.st.phase === 'pick' ? E.botPick(E.clone(Game.st), 0) : null; },
};
})();
</script>
