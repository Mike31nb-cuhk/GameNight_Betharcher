<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sushi Go! 新手课</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>/* 字体后台加载：连不上 Google Fonts 时页面照样立刻显示（用系统字体） */(function(){var l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=ZCOOL+KuaiLe&display=swap";document.head.appendChild(l);})();</script>
<style>
:root{
  color-scheme: light;
  --wood:#F0D8B2; --wood-2:#E8C998; --wood-edge:#B98A55; --counter:#F8EBD3; --counter-2:#F3DFBE;
  --soy:#3B2416; --soy-2:#6A4A35; --soy-3:#8C6A52;
  --nori:#1C2420; --nori-2:#2C3732; --on-nori:#F7EEDF; --on-nori-2:#B9B2A4;
  --salmon:#EE6E48; --salmon-d:#C24F2C; --salmon-l:#FFD9C9;
  --wasabi:#86B83A; --wasabi-d:#557F1C; --wasabi-l:#E4F1C9;
  --tamago:#F5C443; --tamago-d:#B98512; --tamago-l:#FDF0C4;
  --rice:#FFFCF5; --paper:#FFF8EA; --line:#D9BC91;
  --belt:#87929A; --belt-d:#5E6870; --belt-l:#C3CBD0; --plate:#FFFFFF;
  --warn:#B4441E; --ok:#3F7A16;
  --c-tempura:#C9B6EA; --c-sashimi:#BBD34C; --c-dumpling:#8FB5F1; --c-maki:#E2474E;
  --c-nigiri:#EDBC4E; --c-pudding:#F6B5C7; --c-wasabi:#F3E36B; --c-chop:#9DD9D3;
  --card-back:#7E1E2B; --card-back-2:#9B2C3A;
  --focus:#1E6FD9;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;
  --font-display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --font-num:"Fredoka","ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --top-h:52px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--wood)}
body{
  margin:0; min-height:100vh; color:var(--soy); font-family:var(--font-body); font-size:15px; line-height:1.5;
  background-color:var(--wood);
  background-image:
    repeating-linear-gradient(92deg, rgba(150,95,40,.055) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(88deg, rgba(255,255,255,.10) 0 2px, transparent 2px 31px),
    linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,0));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}
b,strong{font-weight:700}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{
  /* 顶栏永远在最上层（弹窗从顶栏下面开始），这样回合计分弹窗打开时也能切到「速查」再回来 */
  position:sticky; top:0; z-index:95; background:var(--nori); color:var(--on-nori);
  padding:var(--sat) calc(10px + var(--sar)) 0 calc(10px + var(--sal));
  box-shadow:0 3px 0 var(--wood-edge), 0 6px 14px rgba(40,20,5,.18);
}
.topbar-in{max-width:1180px;margin:0 auto;height:var(--top-h);display:flex;align-items:center;gap:6px}
.back-link{
  display:inline-flex;align-items:center;min-height:40px;padding:0 8px 0 4px;color:var(--on-nori-2);text-decoration:none;
  font-size:14px;white-space:nowrap;border-radius:8px
}
.back-link:hover{color:var(--on-nori)}
.brand{display:flex;align-items:baseline;gap:6px;min-width:0;margin-right:auto}
.brand .logo{font-family:"Fredoka",var(--font-display);font-weight:700;font-size:20px;letter-spacing:.2px;white-space:nowrap;color:#fff}
.brand .logo i{font-style:normal;color:var(--salmon)}
.brand .sub{font-family:var(--font-display);font-size:14px;color:var(--on-nori-2);white-space:nowrap}
.tabs{display:flex;align-items:stretch;height:100%}
.tab{
  background:none;border:0;color:var(--on-nori-2);min-width:46px;padding:0 8px;font-size:15px;position:relative;
  font-family:var(--font-display);letter-spacing:1px
}
.tab[aria-selected="true"]{color:#fff}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:6px;height:4px;border-radius:2px;background:var(--salmon)}
.tab.has-dot::before{content:"";position:absolute;top:9px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--salmon);box-shadow:0 0 0 2px var(--nori)}
.gear{
  width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--on-nori-2);display:grid;place-items:center
}
.gear:hover,.gear[aria-expanded="true"]{background:var(--nori-2);color:#fff}
.settings{
  position:absolute; right:calc(10px + var(--sar)); top:calc(var(--top-h) + var(--sat) + 8px); z-index:60;
  background:var(--paper); color:var(--soy); border-radius:12px; padding:14px; width:250px;
  box-shadow:0 10px 30px rgba(40,20,5,.28), 0 0 0 2px var(--wood-edge);
}
.settings h3{margin:0 0 8px;font-size:14px;font-weight:700}
.seg{display:flex;border:2px solid var(--soy-2);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:40px;border:0;background:transparent;font-size:14px}
.seg button + button{border-left:2px solid var(--soy-2)}
.seg button[aria-pressed="true"]{background:var(--soy);color:var(--paper)}
.settings p{margin:10px 0 0;font-size:12px;color:var(--soy-3)}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:14px calc(16px + var(--sar)) calc(28px + var(--sab)) calc(16px + var(--sal))}
.panel[hidden]{display:none}
h1,h2,h3{font-family:var(--font-display);font-weight:400;letter-spacing:.5px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;
  border:2px solid var(--soy);background:var(--paper);color:var(--soy);font-weight:700;font-size:15px;
  box-shadow:0 3px 0 var(--soy);transition:transform .08s, box-shadow .08s;white-space:nowrap
}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--soy)}
.btn.primary{background:var(--salmon);border-color:var(--salmon-d);color:#fff;box-shadow:0 3px 0 var(--salmon-d)}
.btn.green{background:var(--wasabi-d);border-color:#3F6413;color:#fff;box-shadow:0 3px 0 #3F6413}
.btn.dark{background:var(--nori);border-color:var(--nori);color:#fff;box-shadow:0 3px 0 #000}
.btn:disabled{opacity:.45;box-shadow:none;transform:none}
.btn.big{min-height:54px;font-size:18px;padding:0 26px;border-radius:12px}
.btn.small{min-height:40px;font-size:14px;padding:0 12px}
.linkbtn{background:none;border:0;color:var(--soy-2);text-decoration:underline;min-height:40px;padding:0 6px;font-size:14px}

/* ---------- cards ---------- */
.card{
  --cw:64px; position:relative; width:var(--cw); height:calc(var(--cw) * 1.4); border-radius:calc(var(--cw) * .12);
  background:var(--cc); border:2px solid rgba(59,36,22,.55); padding:0; overflow:hidden; flex:none;
  box-shadow:0 2px 0 rgba(59,36,22,.35), 0 4px 8px rgba(59,36,22,.12); color:var(--soy);
  transition:transform .15s ease, box-shadow .15s ease; display:block; text-align:left
}
.card::before{ /* conveyor strip like the physical cards */
  content:""; position:absolute; left:0; right:0; top:58%; height:16%; background:rgba(110,120,128,.28);
  border-top:2px solid rgba(255,255,255,.55); border-bottom:2px solid rgba(80,88,95,.25)
}
.card .art{position:absolute;left:8%;top:14%;width:84%;height:62%}
.card .cv{
  position:absolute;left:5%;top:3%;font-family:var(--font-num);font-weight:700;font-size:calc(var(--cw) * .16);line-height:1.15;
  color:var(--soy);background:rgba(255,255,255,.72);border-radius:5px;padding:0 3px;max-width:90%;white-space:nowrap
}
.card .cn{
  position:absolute;left:0;right:0;bottom:0;padding:2px 2px 3px;text-align:center;font-weight:700;
  font-size:calc(var(--cw) * .165);line-height:1.15;background:rgba(255,252,245,.9);white-space:nowrap;overflow:hidden
}
.card .cv.sm{font-size:calc(var(--cw) * .122);letter-spacing:-.3px;padding:0 2px}
.card .mk{display:inline-flex;gap:2px;vertical-align:middle;padding:1px 0}
.card .mk i{width:calc(var(--cw) * .13);height:calc(var(--cw) * .13);border-radius:50%;background:var(--nori);box-shadow:inset 0 0 0 calc(var(--cw) * .03) #fff}
.card.back{background:var(--card-back);background-image:radial-gradient(circle at 50% 50%, var(--card-back-2) 0 28%, transparent 29%),repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 4px, transparent 4px 9px)}
.card.back::before{display:none}
.card.back::after{content:"SUSHI GO!";position:absolute;left:0;right:0;top:42%;text-align:center;font-family:"Fredoka",sans-serif;font-weight:700;color:#FFD9C9;font-size:calc(var(--cw) * .15);letter-spacing:.5px}
button.card:not(:disabled):hover{transform:translateY(-3px)}
.card.sel{transform:translateY(-10px);box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--salmon),0 10px 16px rgba(59,36,22,.25)}
button.card.sel:hover{transform:translateY(-10px)}
.card .order{
  position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;background:var(--salmon);color:#fff;
  font-family:var(--font-num);font-weight:700;font-size:14px;display:grid;place-items:center;box-shadow:0 0 0 2px #fff
}
.card .tag{
  position:absolute;left:3px;right:3px;top:38%;text-align:center;background:var(--nori);color:#fff;border-radius:6px;font-size:11px;
  padding:1px 2px;font-weight:700
}
.mini{
  --mw:24px; position:relative; display:inline-block; width:var(--mw); height:calc(var(--mw) * 1.38); border-radius:4px;
  background:var(--cc); border:1.5px solid rgba(59,36,22,.5); overflow:hidden; flex:none; vertical-align:middle
}
.mini svg{position:absolute;left:4%;top:8%;width:92%;height:84%}
.mini .mkd{position:absolute;left:1px;top:1px;display:flex;gap:1px}
.mini .mkd i{width:4px;height:4px;border-radius:50%;background:var(--nori);box-shadow:0 0 0 1px #fff}
.chip small{font-size:9px;font-family:var(--font-num);margin-left:1px}
.mini.back{background:var(--card-back);background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.08) 0 3px, transparent 3px 6px)}
.mini .x3{
  position:absolute;right:-1px;bottom:-1px;background:var(--wasabi-d);color:#fff;font-size:9px;font-weight:700;line-height:1;
  padding:2px 2px 1px;border-radius:3px 0 0 0;font-family:var(--font-num)
}

/* ---------- table ---------- */
.table{display:flex;flex-direction:column;gap:10px;position:relative}
.tv-left,.tv-right{display:flex;flex-direction:column;gap:10px;min-width:0}
.region-dim [data-region]{transition:opacity .25s, filter .25s}
.region-dim [data-region]:not(.focus){opacity:.38;filter:saturate(.6)}
/* 教程里这一步用不上操作条（只写着「读完点上面的「下一步」」）：它变淡以后是半透明的，别再吸在屏幕底边、
   叠在教练正在说的「你的桌面」/手牌上面——留在原来的位置（手牌下面） */
.region-dim .actionbar[data-region]:not(.focus){position:relative}
.spot{animation:spot 1.4s ease-in-out infinite;position:relative;z-index:2}
@keyframes spot{0%,100%{box-shadow:0 0 0 3px rgba(238,110,72,.0), 0 0 0 0 rgba(238,110,72,.0)}50%{box-shadow:0 0 0 3px var(--salmon), 0 0 0 9px rgba(238,110,72,.25)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{translate:0}20%{translate:-6px}40%{translate:6px}60%{translate:-4px}80%{translate:3px}}

.opps{display:grid;grid-template-columns:repeat(var(--no,2),minmax(0,1fr));gap:6px;padding:0 14px}
.opp{
  background:var(--counter);border:2px solid var(--line);border-radius:10px;padding:5px 6px 6px;text-align:left;min-height:62px;
  display:flex;flex-direction:column;gap:3px;position:relative;min-width:0
}
.opp:hover{border-color:var(--soy-3)}
.opp-top{display:flex;align-items:center;gap:3px;min-width:0;flex-wrap:wrap;row-gap:0}
.opp-top b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdot{width:9px;height:9px;border-radius:50%;background:var(--pc);flex:none}
.opp-score{margin-left:auto;font-family:var(--font-num);font-weight:600;font-size:14px;white-space:nowrap;padding-left:2px}
.opp-pick{display:flex;align-items:center;gap:2px;flex:none;height:24px;--pw:17px}
.opp-pick .mini{--mw:var(--pw)}
/* 「思考中」的点点和背面小牌一样宽：机器人选好的那一刻这一行宽度不变，不会忽然换行、对手框高度不跳。
   点点用 CSS 画（不用「·」字符：中文字体里它是全角的，三个点会撑到40多px宽、或者被裁得只剩一个点）；
   减少动画时停在三个点 */
.opp-pick .thinking{display:block;flex:none;width:var(--pw);height:6px;overflow:hidden}
.opp-pick .thinking::after{content:"";display:block;width:13.8px;height:6px;
  background:radial-gradient(circle at 2.3px 3px,var(--soy-2) 1.5px,transparent 1.9px) 0 0/4.6px 6px repeat-x;
  animation:dotsw 1.2s steps(4,end) infinite}
@keyframes dotsw{from{width:0}to{width:18.4px}}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{
  display:inline-flex;align-items:center;gap:1px;height:18px;padding:0 4px;border-radius:5px;background:var(--cc);
  font-size:11px;font-weight:700;line-height:1;border:1px solid rgba(59,36,22,.35);white-space:nowrap
}
.chip b{font-family:var(--font-num);font-weight:600;font-size:12px}
.chip.open{outline:2px dashed var(--wasabi-d);outline-offset:-1px}
.thinking::after{content:"";display:inline-block;width:18px;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"·"}50%{content:"··"}75%{content:"···"}}

.belt{position:relative;height:166px;margin:0 -4px}
.belt-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.b-edge{fill:none;stroke:var(--belt-d);stroke-width:30}
.b-band{fill:none;stroke:var(--belt);stroke-width:24}
.b-dash{fill:none;stroke:var(--belt-l);stroke-width:18;stroke-dasharray:3 15;opacity:.8}
.island{
  position:absolute;left:30px;right:30px;top:30px;bottom:30px;border-radius:16px;
  background:var(--counter-2);
  background-image:repeating-linear-gradient(90deg, rgba(150,95,40,.07) 0 1px, transparent 1px 8px);
  box-shadow:inset 0 2px 6px rgba(80,50,20,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px 8px 0;
}
.isl-msg{text-align:center;font-size:13px;line-height:1.35;color:var(--soy);max-width:100%;min-height:36px;padding-top:4px}
.isl-msg b{color:var(--salmon-d)}
.isl-msg .dir{display:inline-flex;align-items:center;gap:3px;color:var(--soy-2);font-size:12px}
.my-slot{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);display:flex;gap:4px;align-items:flex-end;min-height:20px}
.my-slot .card{--cw:38px;box-shadow:0 2px 0 rgba(59,36,22,.35)}
.my-slot .card .cn{font-size:8px}
.plate{
  position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, var(--plate) 0 54%, var(--prim, #D6564B) 55% 70%, var(--plate) 71% 100%);
  box-shadow:0 2px 0 rgba(0,0,0,.25), 0 0 0 1.5px rgba(0,0,0,.12);will-change:transform;z-index:3
}
.plate .stk{position:absolute;left:50%;top:50%;width:16px;height:22px;margin:-12px 0 0 -8px}
.plate .stk i{position:absolute;inset:0;border-radius:3px;background:var(--card-back);border:1px solid rgba(255,255,255,.65)}
.plate .stk i:nth-child(2){transform:translate(2px,-2px) rotate(6deg)}
.plate .stk i:nth-child(3){transform:translate(-2px,-3px) rotate(-7deg)}
.plate .pc{
  position:absolute;right:-8px;top:-7px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--nori);color:#fff;
  font-family:var(--font-num);font-size:12px;font-weight:600;display:grid;place-items:center;box-shadow:0 0 0 2px var(--plate)
}
.plate.empty .stk{opacity:0}
.plate.empty .pc{display:none}
.plate.me{box-shadow:0 2px 0 rgba(0,0,0,.25), 0 0 0 3px var(--salmon)}

.mine{background:rgba(255,250,240,.55);border:2px solid var(--line);border-radius:12px;padding:8px 10px 10px}
.mine-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:13px;color:var(--soy-2);margin-bottom:6px}
.mine-head .mt{font-family:var(--font-display);font-size:16px;color:var(--soy)}
.mine-head .est b{font-family:var(--font-num);font-size:18px;color:var(--salmon-d)}
.groups{display:flex;flex-wrap:wrap;gap:8px 10px;min-height:40px}
.groups .empty-note{font-size:13px;color:var(--soy-3);align-self:center}
.grp{
  display:flex;flex-direction:column;gap:2px;min-width:0;background:none;border:0;padding:4px;border-radius:8px;text-align:left;
  position:relative
}
button.grp:hover{background:rgba(255,255,255,.5)}
.g-cards{display:flex;align-items:flex-end;min-height:36px;padding-left:2px}
.g-cards > *{margin-left:-9px}
.g-cards > *:first-child{margin-left:0}
.g-cards .pair{display:inline-flex;position:relative;margin-right:6px}
.g-cards .pair .mini + .mini{margin-left:-14px;margin-top:-8px;transform:translateY(-6px) rotate(6deg)}
.g-cards .wopen{outline:2px dashed var(--wasabi-d);outline-offset:1px}
.g-txt{font-size:12px;line-height:1.25;white-space:nowrap}
.g-txt b{font-size:13px}
.g-pts{font-size:12px;line-height:1.25;white-space:nowrap;color:var(--soy-2)}
.g-pts .p{font-family:var(--font-num);font-weight:600;color:var(--soy);font-size:13px}
.g-pts .w{color:var(--warn);font-weight:700}
.g-pts .k{color:var(--ok);font-weight:700}
.grp.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

.handbox{position:relative}
.hand-head{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--soy-2);margin:0 2px 6px}
.hand-head .ht{font-family:var(--font-display);font-size:16px;color:var(--soy)}
.hand-head .from{color:var(--salmon-d);font-weight:700}
.hand{display:flex;flex-wrap:wrap;gap:8px;min-height:92px;padding-top:10px}
.hand .card{--cw:64px}
/* 手牌上的分值/名字是新手做决定时看的：手机上也不小于 ~11px */
.hand .card .cn{font-size:max(11px, calc(var(--cw) * .165))}
.hand .card .cv{font-size:max(10.5px, calc(var(--cw) * .16))}
.hand .card .cv.sm{font-size:max(10px, calc(var(--cw) * .122))}
.card .cv .short{display:none}
.hand .none{font-size:13px;color:var(--soy-3);align-self:center}

.actionbar{
  position:sticky;bottom:0;z-index:20;margin:0 -16px;padding:10px 16px calc(10px + var(--sab));
  background:var(--wood-2);border-top:2px solid var(--wood-edge);box-shadow:0 -4px 12px rgba(80,50,20,.12);
  display:flex;align-items:center;gap:8px;min-height:64px
}
.ab-text{flex:1;min-width:0;font-size:13px;line-height:1.35;color:var(--soy)}
.ab-text b{color:var(--salmon-d)}
.ab-btns{display:flex;gap:8px;flex:none}
.ab-text .warn{color:var(--warn);font-weight:700}

.shout{
  position:fixed;z-index:80;pointer-events:none;background:#fff;color:var(--salmon-d);border:3px solid var(--salmon-d);border-radius:14px;
  font-family:"Fredoka",var(--font-display);font-weight:700;font-size:22px;padding:4px 12px;white-space:nowrap;
  box-shadow:0 4px 0 var(--salmon-d)
}
.shout::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--salmon-d);border-bottom:0}
.ghost{position:fixed;z-index:70;pointer-events:none;margin:0;transform-origin:50% 50%}
.ghost .card{box-shadow:0 8px 18px rgba(0,0,0,.25)}
.float-pts{position:fixed;z-index:75;pointer-events:none;font-family:var(--font-num);font-weight:700;font-size:20px;color:var(--wasabi-d);text-shadow:0 1px 0 #fff,0 0 6px #fff}
/* 飞行中的牌 / 气泡只属于产生它的标签页：切走以后绝不画在别的页面上 */
body:not([data-tab="play"]) [data-owner="play"], body:not([data-tab="learn"]) [data-owner="learn"]{display:none !important}

/* ---------- coach ---------- */
.coach{display:flex;gap:10px;align-items:flex-start}
.coach-av{width:52px;height:52px;flex:none;margin-top:2px}
.coach-av svg{width:100%;height:100%}
.bubble{
  flex:1;min-width:0;background:var(--rice);border:2px solid var(--soy);border-radius:14px;padding:10px 12px;position:relative;
  box-shadow:0 3px 0 var(--soy)
}
.bubble::before{content:"";position:absolute;left:-10px;top:16px;border:9px solid transparent;border-right-color:var(--soy);border-left:0}
.bubble::after{content:"";position:absolute;left:-7px;top:17px;border:8px solid transparent;border-right-color:var(--rice);border-left:0}
.bubble .who{font-family:var(--font-display);font-size:13px;color:var(--salmon-d);margin-bottom:2px}
.say{margin:0;font-size:15px;line-height:1.55}
.say b{color:var(--salmon-d)}
.note{margin:8px 0 0;padding:8px 10px;border-radius:10px;font-size:14px;line-height:1.5;background:var(--tamago-l);border-left:4px solid var(--tamago-d)}
.note.bad{background:#FFE6DC;border-left-color:var(--warn)}
.note.good{background:var(--wasabi-l);border-left-color:var(--ok)}
.foot{margin:8px 0 0;font-size:12px;color:var(--soy-3);line-height:1.45}
.foot::before{content:"注：";font-weight:700;color:var(--soy-2)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opts > div{flex:1 0 100%}
.opts .btn{flex:1 1 auto;justify-content:center;white-space:normal;text-align:center;min-height:44px;padding:6px 14px;line-height:1.3;font-weight:600}
.opts .btn.right{background:var(--wasabi-l);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.opts .btn.right:disabled{opacity:1;color:var(--ok)}
.opts .btn.wrong{background:#FFE6DC;border-color:var(--warn);box-shadow:0 3px 0 var(--warn)}
.cta{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- learn ---------- */
.learn{display:grid;grid-template-columns:1fr;gap:12px}
.lmap{overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.lmap::-webkit-scrollbar{display:none}
.lmap ol{list-style:none;margin:0;padding:0;display:flex;gap:6px}
.lmap button{
  display:flex;align-items:center;gap:6px;min-height:40px;padding:0 10px 0 4px;border-radius:20px;border:2px solid var(--line);
  background:var(--counter);white-space:nowrap;font-size:13px
}
.lmap .ln{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2px solid var(--soy-3);
  font-family:var(--font-num);font-weight:700;font-size:14px;flex:none
}
.lmap .lt .full{display:none}
.lmap button[aria-current="step"]{border-color:var(--soy);background:var(--rice);box-shadow:0 2px 0 var(--soy)}
.lmap button[aria-current="step"] .ln{background:var(--soy);color:#fff;border-color:var(--soy)}
.lmap button.done .ln{background:var(--wasabi);border-color:var(--wasabi-d);color:#fff}
.lmap .tick{color:var(--ok);font-weight:700;font-size:13px}
.lplayer{display:flex;flex-direction:column;gap:12px;min-width:0}
.lsticky{display:flex;flex-direction:column;gap:12px}
.lhead{display:flex;align-items:center;gap:6px}
.lhead h2{margin:0;font-size:20px;line-height:1.2;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead h2 .lnum{font-family:var(--font-num);font-weight:700;color:var(--salmon-d);margin-right:6px}
.lhead .lstep{font-family:var(--font-num);font-size:13px;color:var(--soy-3);white-space:nowrap}
.iconbtn{
  width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--counter);display:grid;place-items:center;flex:none;font-size:18px;line-height:1
}
.iconbtn:disabled{opacity:.35}
.stage{position:relative;min-width:0}
.edu-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;color:#fff;background:var(--soy-2);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:2px}

/* menu (lesson 1) */
.menu{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;justify-items:center}
.menu .mitem{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:4px;border-radius:10px;position:relative}
.menu .mitem .card{--cw:70px;pointer-events:none}
.menu .mitem .lbl{font-size:12px;font-weight:700}
.menu .mitem.seen::after{content:"✓";position:absolute;right:2px;top:0;width:22px;height:22px;border-radius:50%;background:var(--wasabi);color:#fff;font-size:13px;display:grid;place-items:center;font-weight:700}
.menu .mitem[aria-pressed="true"] .card{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--salmon)}
.mdetail{margin-bottom:12px;background:var(--rice);border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:flex-start;min-height:120px}
.mdetail .card{--cw:76px}
.mdetail h3{margin:0 0 4px;font-size:18px}
.mdetail p{margin:0;font-size:14px}
.mdetail .ex{margin-top:6px;font-size:13px;color:var(--soy-2)}
.mdetail .en{margin-top:4px;font-size:12px;color:var(--soy-3)}
.mdetail .en b{font-family:"Fredoka",var(--font-body);font-weight:600;letter-spacing:.3px;color:var(--soy-2)}
.seen-count{font-size:13px;color:var(--soy-2);margin-top:8px;text-align:center}

/* widgets */
.wbox{background:var(--rice);border:2px solid var(--line);border-radius:12px;padding:12px}
.wbox h3{margin:0 0 8px;font-size:16px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:44px 1fr 64px;align-items:center;gap:8px;font-size:14px}
.bar .bn{font-weight:700}
.bar .bt{height:22px;border-radius:6px;background:var(--counter-2);position:relative;overflow:hidden}
.bar .bt i{position:absolute;left:0;top:0;bottom:0;background:var(--c-maki);border-radius:6px}
.bar .bt i.pud{background:var(--c-pudding)}
.bar .bt i.pud + span{color:var(--soy);text-shadow:none} /* 浅粉色/空的布丁条上白字看不清 */
.bar .bt span{position:absolute;left:8px;top:0;line-height:22px;font-family:var(--font-num);font-weight:600;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.bar .bp{font-family:var(--font-num);font-weight:700;text-align:right}
.bar .bp.neg{color:var(--warn)}
.bar .bp.pos{color:var(--ok)}
.tally{display:flex;flex-direction:column;gap:6px}
.trow{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;border:2px solid transparent;
  background:rgba(255,255,255,.55);text-align:left;width:100%
}
.trow .tl{display:flex;align-items:center;gap:8px;min-width:0}
.trow .tc{display:flex;flex:none}
.trow .tc .mini{--mw:20px;margin-left:-7px}
.trow .tc .mini:first-child{margin-left:0}
.trow .tn{font-weight:700;font-size:14px;white-space:nowrap}
.trow .tx{font-size:12px;color:var(--soy-2);line-height:1.35}
.trow .tv{font-family:var(--font-num);font-weight:700;font-size:20px;min-width:44px;text-align:right}
.trow .tv.q{color:var(--soy-3)}
.trow.cur{border-color:var(--salmon);background:#fff}
.trow.done .tv{color:var(--ok)}
.tsum{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding:8px 10px;border-top:2px dashed var(--line);font-size:15px}
.tsum b{font-family:var(--font-num);font-size:26px;color:var(--salmon-d)}
.mini-table{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end}
.mini-table .mini{--mw:30px}
.wlist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:1.5}
.wlist li::marker{font-family:var(--font-num);font-weight:700;color:var(--salmon-d)}
.wnote{margin:10px 0 0;font-size:13px;color:var(--soy-2)}
#l-foot .foot{margin:0}
.pudarea{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px;border-radius:10px;border:2px dashed var(--c-pudding);font-size:13px}

/* ---------- play ---------- */
.setup{max-width:560px;margin:8px auto 0;background:var(--rice);border:2px solid var(--soy);border-radius:16px;padding:18px;box-shadow:0 4px 0 var(--soy)}
.setup h2{margin:0 0 4px;font-size:24px}
.setup .lead{margin:0 0 14px;color:var(--soy-2);font-size:14px}
.field{margin:14px 0}
.field > .lab{display:block;font-weight:700;margin-bottom:6px}
.field .hint{font-size:12px;color:var(--soy-3);margin-top:4px}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;background:none;border:0;padding:0;text-align:left}
.toggle .sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .2s}
.toggle[aria-checked="true"] .sw{background:var(--wasabi)}
.toggle[aria-checked="true"] .sw::after{left:21px}
.toggle .tt{display:flex;flex-direction:column;line-height:1.3}
.toggle .tt small{color:var(--soy-3);font-size:12px}
.who-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px}
.who-list span{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;background:var(--counter)}
.game-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.game-top .gt-status{font-family:var(--font-display);font-size:17px;margin-right:auto;white-space:nowrap}
.game-top .gt-status .num{font-size:18px}
.chipbtn{min-height:40px;padding:0 12px;border-radius:20px;border:2px solid var(--line);background:var(--counter);font-size:13px;white-space:nowrap}
.chipbtn[aria-pressed="true"]{border-color:var(--wasabi-d);background:var(--wasabi-l)}
.coach.mini-coach .coach-av{width:40px;height:40px}
.coach.mini-coach .say{font-size:14px}
.coach.mini-coach .bubble{padding:8px 10px}
.coach.mini-coach .bubble::before{top:12px}
.coach.mini-coach .bubble::after{top:13px}
.confirm-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#FFE6DC;border:2px solid var(--warn);border-radius:10px;padding:6px 10px;margin-bottom:8px;font-size:14px}

/* ---------- modal ---------- */
.modal{
  position:fixed;left:0;right:0;bottom:0;top:calc(var(--top-h) + var(--sat));z-index:90;background:rgba(28,36,32,.55);
  display:flex;align-items:flex-end;justify-content:center;padding:0
}
.modal-card{
  background:var(--paper);width:100%;max-width:640px;max-height:calc(100% - 10px);overflow:auto;border-radius:18px 18px 0 0;
  padding:18px 16px calc(18px + var(--sab));box-shadow:0 -6px 24px rgba(0,0,0,.25)
}
.modal-card h2{margin:0 0 4px;font-size:24px}
.modal-card .sub{margin:0 0 10px;color:var(--soy-2);font-size:14px}
.modal-card .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.score-table{width:100%;border-collapse:collapse;font-size:14px}
.score-table th,.score-table td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
.score-table th{font-size:11px;font-weight:700;color:var(--soy-2);line-height:1.2}
.score-table th .mini{--mw:16px;display:block;margin:0 auto 2px}
.score-table td.nm{text-align:left;font-weight:700;white-space:nowrap}
.score-table td .num{font-weight:600}
.score-table td.tot{font-family:var(--font-num);font-weight:700;font-size:16px}
.score-table td small{display:block;font-size:10px;color:var(--soy-3);line-height:1.1}
.score-table tr.me td{background:var(--salmon-l)}
.score-table tr.win td.nm::after{content:"冠军";margin-left:4px;font-size:11px;color:var(--tamago-d)}
.explain{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--soy-2)}
.explain li{padding:3px 0}
.explain li b{color:var(--soy)}
.winner{display:flex;gap:12px;align-items:center;margin:4px 0 12px}
.winner svg{width:64px;height:64px;flex:none}
.winner .wt{font-family:var(--font-display);font-size:20px;line-height:1.3}
.detail-groups .groups{gap:10px 14px}

/* ---------- reference ---------- */
.ref{display:grid;grid-template-columns:1fr;gap:12px}
.ref .rbox{break-inside:avoid}
.rbox{background:var(--rice);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.rbox h3{margin:0 0 6px;font-size:18px}
.rbox p,.rbox li{font-size:14px;margin:4px 0}
.rbox ol,.rbox ul{margin:4px 0;padding-left:20px}
.rbox .rlist{list-style:none;margin:0;padding:0}
.rlist li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);margin:0}
.rlist li:last-child{border-bottom:0}
.rlist .mini{--mw:32px}
.rlist .rn{font-weight:700}
.rlist .rr{font-size:13px;color:var(--soy-2)}
.hs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:6px 0}
.hs div{background:var(--counter);border-radius:8px;padding:4px 0;font-size:12px}
.hs b{display:block;font-family:var(--font-num);font-size:20px}
.fn{font-size:12px;color:var(--soy-3)}
.rbox ol.steps{padding-left:22px}
.rbox ol.steps li{margin:3px 0}
.rbox ol.steps li::marker{font-family:var(--font-num);font-weight:700;color:var(--salmon-d)}
.rbox .rnote{font-size:13px;color:var(--soy-2);margin:8px 0 0}
.rbox sup{font-size:10px;color:var(--salmon-d);font-weight:700}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 10px}
.sc{display:flex;gap:7px;align-items:center;font-size:13px;line-height:1.3;padding:5px 0;border-bottom:1px dashed var(--line);min-width:0}
.sc .mini{--mw:24px}
.sc b{display:block;font-size:14px}
.nw{white-space:nowrap}
.rlist .ren{font-family:"Fredoka",var(--font-body);font-weight:500;font-size:11.5px;color:var(--soy-3);margin-left:6px;letter-spacing:.3px}
details.rbox{padding:0}
details.rbox > summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;padding:6px 14px;font-family:var(--font-display);font-size:17px;border-radius:10px}
details.rbox > summary::-webkit-details-marker{display:none}
details.rbox > summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2.5px solid var(--soy-2);border-bottom:2.5px solid var(--soy-2);transform:translateY(-2px) rotate(45deg);flex:none}
details.rbox[open] > summary::after{transform:translateY(2px) rotate(-135deg)}
details.rbox > .dbody{padding:0 14px 10px}
.fn b{color:var(--soy-2)}

@media (max-width: 719px){
  .opps[data-k="4"] .pdot{display:none}
  .opps[data-k="4"]{padding:0 8px;gap:5px}
  .opps[data-k="4"] .opp{padding:4px 5px 5px}
  .opps[data-k="4"] .opp-pick{--pw:14px}
  .tv-right .handbox{order:1}
  .tv-right .actionbar{order:2}
  .tv-right .mine{order:3}
  /* 教程里教练同时说到上面（对手/传送带）和「你的桌面」、这一步又用不上手牌：桌面挪到手牌上面，一屏都看得见 */
  .table.mine-up .tv-right .mine{order:0}
  .gsticky{position:sticky;top:calc(var(--top-h) + var(--sat));z-index:15;margin:-14px -16px 0;padding:10px 16px 8px;background:var(--wood);box-shadow:0 6px 8px -6px rgba(80,50,20,.25)}
  .gsticky .game-top{margin-bottom:6px}
  .gsticky .chipbtn{min-height:40px;padding:0 10px}
  #g-coachbox .say{font-size:13.5px;line-height:1.45}
  .belt{height:142px}
  .my-slot{left:auto;right:8px;transform:none;bottom:5px}
  .isl-msg{max-width:calc(100% - 64px);font-size:12.5px}
  .table,.tv-left,.tv-right{gap:8px}
  .game-top{margin-bottom:6px}
  .hand{padding-top:8px}
  /* 手机：一排正好5张（360–430px 宽都一样），10张手牌只占2排 */
  .hand .card{--cw:clamp(52px, calc((100vw - 64px - var(--sal) - var(--sar)) / 5), 64px)}
  .hand .card .cv .long{display:none}
  .hand .card .cv .short{display:inline}
  .hand .card .cv.sm{font-size:max(10.5px, calc(var(--cw) * .16));letter-spacing:0;padding:0 3px}
  .plate{width:40px;height:40px;margin:-20px 0 0 -20px}
  .island{padding-top:6px}
  .isl-msg{padding-top:0;min-height:0}
  .my-slot .card{--cw:34px}
  .my-slot .card .cn{font-size:7px}
  .lsticky{position:sticky;top:calc(var(--top-h) + var(--sat));z-index:15;margin:-8px -16px 0;padding:8px 16px 8px;background:var(--wood);box-shadow:0 6px 8px -6px rgba(80,50,20,.25);display:flex;flex-direction:column;gap:8px}
  .lhead h2{font-size:18px}
  .lhead .iconbtn{width:40px;height:40px}
  #l-coach .who{display:none}
  .coach-av{width:42px;height:42px}
  .say{font-size:14.5px;line-height:1.5}
  .bubble{padding:8px 11px}
  .cta .btn{min-height:42px}
}
@media (min-width: 720px){
  .card{--cw:76px}
  .hand .card{--cw:84px}
  .hand{gap:10px;min-height:128px}
  .belt{height:200px}
  .plate{width:52px;height:52px;margin:-26px 0 0 -26px}
  .my-slot .card{--cw:46px}
  .isl-msg{font-size:15px}
  .opp{min-height:72px}
  .opp-top b{font-size:15px}
  .chip{height:20px;font-size:12px}
  .mini{--mw:28px}
  .modal{align-items:center;padding:20px}
  .modal-card{border-radius:18px;padding:22px;max-height:100%}
  .ref{display:block;columns:2;column-gap:12px}
  .ref .rbox{margin:0 0 12px}
  .menu .mitem .card{--cw:84px}
  .actionbar{margin:0;border-radius:14px;padding:10px 14px calc(10px + var(--sab))}
}
@media (min-width: 980px){
  .learn{grid-template-columns:236px minmax(0,1fr);align-items:start}
  .lmap{margin:0;padding:0;overflow:visible;position:sticky;top:calc(var(--top-h) + var(--sat) + 14px)}
  .lmap ol{flex-direction:column}
  .lmap button{width:100%;border-radius:12px;padding:4px 10px 4px 6px;white-space:normal;text-align:left}
  .lmap .lt .short{display:none}
  .lmap .lt .full{display:inline}
  .lmap .tick{margin-left:auto}
  .ref{columns:3}
}
@media (min-width: 980px){
  .widget .wbox{max-width:760px}
  .trow .tc .mini{--mw:26px}
  .menuwrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}
  .menuwrap .mdetail{margin:0;order:2;min-height:180px}
  .menuwrap .menucol{order:1}
  .menu .mitem .card{--cw:80px}
}
@media (min-width: 1100px){
  .table{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:14px 18px;align-items:start}
  .belt{height:236px}
  .hand .card{--cw:78px}
  .hand{min-height:118px}
  .actionbar{position:static;margin:0}
  .mine{min-height:120px}
}
@media (max-width: 374px){
  .lhead h2{font-size:16px}
  .brand .sub{display:none}
  .tab{min-width:42px;padding:0 6px;font-size:14px}
  .opps{padding:0 10px}
}
@media (max-width: 389px){
  /* 5人局的窄屏：一行放不下「名字+选牌状态+两位数总分」→ 固定两行（名字·总分 / 选牌状态）。

// 飞行动画（克隆一张牌从 A 飞到 B）

function rectOf(x) { return x && x.getBoundingClientRect ? x.getBoundingClientRect() : x; }

function ownerOf(...xs) {

}
function ownerHidden(owner) { return !!owner && owner !== currentTab; }

  const g = document.createElement('div');

    { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1 },
    { transform: `translate(${dx * 0.5}px,${dy * 0.5 - (opts.arc || 30)}px) scale(${(1 + s) / 2}) rotate(${opts.rot || 0}deg)`, opacity: 1, offset: 0.5 },
    { transform: `translate(${dx}px,${dy}px) scale(${s}) rotate(0deg)`, opacity: opts.fade ? 0 : 1 },

  for (let el = anchor, k = 0; noSize(r) && el && el.parentElement && k < 3; k++) { el = el.parentElement; r = el.getBoundingClientRect(); }

    if (st) this.state = st;

    st = this.state; ui = this.ui;
    if (!st || this.dead) return;
    this.el.style.setProperty('--no', Math.max(1, st.players.length - 1));
    this.renderOpps(); this.renderPlates(); this.renderSlot(); this.renderMine(); this.renderHand(); this.renderActions();
    this.msgEl.innerHTML = ui.msg || '';
    this.applyFocus();
    this.layoutBelt();
  }
  renderOpps() {
    const st = this.state, ui = this.ui;
    this.oppsEl.dataset.k = st.players.length - 1;
    this.oppsEl.innerHTML = st.players.slice(1).map((pl, k) => {
      const p = k + 1;
      const o = ui.opp[p];
      let pick = '', stTxt = '';
      if (o === 'thinking') { pick = '<span class="thinking"></span>'; stTxt = '思考中'; }
      else if (o === 'ready') { pick = mini('back'); stTxt = '已选好'; }
      else if (o && o.shown) { pick = o.shown.map((t) => mini(t)).join(''); stTxt = '刚拿了' + o.shown.map((t) => E.TYPES[t].name).join('、'); }
      return `<button class="opp" data-act="opp" data-p="${p}" aria-label="${esc(pl.name)}，${stTxt ? stTxt + '，' : ''}总分${pl.total}，点开看桌面">` +
        `<div class="opp-top"><span class="pdot" style="--pc:${PCOL[p % PCOL.length]}"></span><b>${esc(pl.name)}</b><span class="opp-pick" title="${stTxt}">${pick}</span><span class="opp-score">${pl.total}</span></div>` +
        `<div class="chips">${chipsHTML(pl)}</div></button>`;
    }).join('');
  }
  handCount(p) {
    const pl = this.state.players[p];
    let n = pl.hand.length;
    if (p === 0) n -= (this.ui.pickedIds || []).length;
    else if (pl.pick && this.state.phase === 'pick') n -= pl.pick.length;
    return Math.max(0, n);
  }
  renderPlates() {
    const st = this.state;
    this.plates.innerHTML = st.players.map((pl, p) => {
      const n = this.handCount(p);
      return `<div class="plate ${p === 0 ? 'me' : ''} ${n ? '' : 'empty'}" data-p="${p}" title="${esc(pl.name)}的手牌${n}张"><div class="stk"><i></i><i></i><i></i></div><b class="pc">${n}</b></div>`;
    }).join('');
    this.placePlates();
  }
  renderSlot() {
    const s = this.ui.slot;
    if (!s) { this.slot.innerHTML = ''; return; }
    if (s.faceDown) this.slot.innerHTML = Array.from({ length: s.faceDown }, () => cardDiv('back')).join('');
    else this.slot.innerHTML = s.types.map((t) => cardDiv(t)).join('');
  }
  renderMine() {
    const st = this.state, ui = this.ui;
    const me = st.players[0];
    const pv = E.roundPreview(st)[0];
    this.headEl.innerHTML = `<span class="mt">你的桌面</span>` +
      (ui.hidePts ? '' : `<span class="est">${roundOver(st) ? '本回合得分' : '本回合预估'}<b>${pv.total}</b>分</span>`) +
      `<span>总分<b class="num">${me.total}</b></span>`;
    this.groupsEl.innerHTML = groupsHTML(st, 0, ui.groupsClickable, ui.hidePts);
  }
  renderHand() {
    const st = this.state, ui = this.ui;
    const me = st.players[0];
    const picked = ui.pickedIds || [];
    const cards = ui.handHidden ? [] : me.hand.filter((c) => picked.indexOf(c.id) < 0);
    if (!ui.handHidden) this.hand.style.minHeight = '';
    const from = ui.handFrom != null && ui.handFrom !== 0 && !ui.handHidden && st.phase === 'pick' ? `<span>来自<span class="from">${esc(st.players[ui.handFrom].name)}</span></span>` : '';
    this.handHead.innerHTML = `<span class="ht">你的手牌</span><span class="num">${cards.length}张</span>${from}`;
    if (!cards.length) {
      this.hand.innerHTML = `<span class="none">${esc(ui.handEmptyText || (st.phase === 'roundEnd' || st.phase === 'gameOver' ? '这一回合的手牌出完了。' : '手牌已经放到传送带上。'))}</span>`;
      return;
    }
    this.hand.innerHTML = cards.map((c) => {
      const si = ui.selected.indexOf(c.id);
      const badge = si >= 0 && ui.chopMode ? `<span class="order">${si + 1}</span>` : '';
      const tag = ui.handTags[c.id] ? `<span class="tag">${esc(ui.handTags[c.id])}</span>` : '';
      return cardBtn(c, si >= 0 ? 'sel' : '', badge + tag, ui.handLocked ? 'disabled' : `aria-pressed="${si >= 0}"`);
    }).join('');
  }
  renderActions() {
    const ui = this.ui;
    this.abText.parentElement.classList.toggle('chop', !!ui.chopMode);
    this.abText.innerHTML = ui.abText || '';
    this.abBtns.innerHTML = (ui.actions || []).map((a) =>
      `<button class="btn ${a.cls || ''}" data-act="${a.act}" ${a.disabled ? 'disabled' : ''}>${a.label}</button>`).join('');
  }
  applyFocus() {
    const f = this.ui.focus;
    $$('.spot', this.el).forEach((x) => x.classList.remove('spot'));
    $$('[data-region]', this.el).forEach((x) => x.classList.remove('focus'));
    this.el.classList.toggle('region-dim', !!(f && f.regions));
    const R = (f && f.regions) || [];
    this.el.classList.toggle('mine-up', R.indexOf('mine') >= 0 && R.indexOf('hand') < 0 && (R.indexOf('opps') >= 0 || R.indexOf('belt') >= 0));
    if (!f) return;
    (f.regions || []).forEach((r) => { const x = $(`[data-region="${r}"]`, this.el); if (x) x.classList.add('focus'); });
    if (f.spot) $$(f.spot, this.el).forEach((x) => x.classList.add('spot'));
  }
  // ---------------- 传送带几何 ----------------
  layoutBelt() {
    const st = this.state;
    if (!st || this.dead) return;
    const W = this.belt.clientWidth, H = this.belt.clientHeight;
    if (!W || !H) return;
    const inset = 15;
    const x0 = inset, y0 = inset, w = W - 2 * inset, hh = H - 2 * inset;
    const r = Math.min(hh / 2, W >= 600 ? 46 : 30);
    this.g = { x0, y0, w, h: hh, r, L: 2 * (w - 2 * r) + 2 * (hh - 2 * r) + 2 * Math.PI * r };
    this.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    $$('rect', this.svg).forEach((rc) => {
      rc.setAttribute('x', x0); rc.setAttribute('y', y0); rc.setAttribute('width', w); rc.setAttribute('height', hh);
      rc.setAttribute('rx', r); rc.setAttribute('ry', r);
    });
    this.dash.style.strokeDashoffset = this.dashOff;
    const br = this.belt.getBoundingClientRect();
    const n = st.players.length;
    this.seatS = [this.sBottom(W / 2)];
    const ops = this.oppsEl.children;
    for (let p = 1; p < n; p++) {
      const op = ops[p - 1];
      let cx = W / 2;
      if (op) { const r2 = op.getBoundingClientRect(); cx = r2.left + r2.width / 2 - br.left; }
      this.seatS[p] = this.sTop(cx);
    }
    this.placePlates();
  }
  sTop(x) { const g = this.g; return Math.max(0, Math.min(g.w - 2 * g.r, x - (g.x0 + g.r))); }
  sBottom(x) {
    const g = this.g;
    const base = (g.w - 2 * g.r) + Math.PI * g.r / 2 + (g.h - 2 * g.r) + Math.PI * g.r / 2;
    return base + Math.max(0, Math.min(g.w - 2 * g.r, (g.x0 + g.w - g.r) - x));
  }
  pointAt(s) {
    const { x0, y0, w, h: hh, r, L } = this.g;
    s = ((s % L) + L) % L;
    const a = w - 2 * r, b = hh - 2 * r, q = Math.PI * r / 2;
    if (s < a) return [x0 + r + s, y0];
    s -= a; if (s < q) { const t = s / r - Math.PI / 2; return [x0 + w - r + r * Math.cos(t), y0 + r + r * Math.sin(t)]; }
    s -= q; if (s < b) return [x0 + w, y0 + r + s];
    s -= b; if (s < q) { const t = s / r; return [x0 + w - r + r * Math.cos(t), y0 + hh - r + r * Math.sin(t)]; }
    s -= q; if (s < a) return [x0 + w - r - s, y0 + hh];
    s -= a; if (s < q) { const t = Math.PI / 2 + s / r; return [x0 + r + r * Math.cos(t), y0 + hh - r + r * Math.sin(t)]; }
    s -= q; if (s < b) return [x0, y0 + hh - r - s];
    s -= b; { const t = Math.PI + s / r; return [x0 + r + r * Math.cos(t), y0 + r + r * Math.sin(t)]; }
  }
  placePlates() {
    if (!this.g) return;
    $$('.plate', this.plates).forEach((el) => {
      const p = +el.dataset.p;
      if (this.seatS[p] == null) return;
      const [x, y] = this.pointAt(this.seatS[p]);
      el.style.transform = `translate(${x}px,${y}px)`;
    });
  }
  plateEl(p) { return $(`.plate[data-p="${p}"]`, this.plates); }
  // ---------------- 动画 ----------------
  async pickDown(ids) {
    const rects = ids.map((id) => { const e = $(`.card[data-id="${id}"]`, this.hand); return e ? e.getBoundingClientRect() : null; });
    const types = ids.map((id) => this.state.players[0].hand.find((c) => c.id === id).t);
    this.ui.slot = { faceDown: ids.length };
    this.ui.pickedIds = ids.slice();
    this.ui.selected = [];
    this.render();
    const targets = $$('.card', this.slot);
    targets.forEach((t) => (t.style.visibility = 'hidden'));
    await Promise.all(rects.map((r, i) => (r ? fly(r, targets[i] || targets[0], cardDiv(types[i]), 420, { arc: 10 }) : null)));
    targets.forEach((t) => (t.style.visibility = ''));
  }
  async revealAnim(prev, st, info) {
    // 1) 同时翻开
    const ui = this.ui;
    const shouters = info.plays.filter((pl) => pl.chopsticks != null && pl.p !== 0 && !ui.noBotShout);
    for (const pl of shouters) shout(this.oppsEl.children[pl.p - 1], 'Sushi Go!', 1000);
    if (shouters.length) await wait(500);
    ui.slot = { types: info.plays[0].cards.map((c) => c.t) };
    info.plays.forEach((pl) => { if (pl.p) ui.opp[pl.p] = { shown: pl.cards.map((c) => c.t) }; });
    this.render(prev);
    const flips = $$('.card', this.slot).concat($$('.opp-pick .mini', this.oppsEl));
    await Promise.all(flips.map((el) => anim(el, [{ transform: 'rotateY(90deg)' }, { transform: 'rotateY(0deg)' }], 380)));
    await wait(650);
    // 2) 放进各自的桌面
    const slotRects = $$('.card', this.slot).map((e) => e.getBoundingClientRect());
    const chopRect = (() => { const g = $('.grp[data-g="chopsticks"]', this.groupsEl); return g ? g.getBoundingClientRect() : null; })();
    ui.slot = null;
    ui.pickedIds = [];
    this.render(st);
    const myPlay = info.plays[0];
    const flights = myPlay.cards.map((c, i) => {
      const g = c.t === 'wasabi' || E.isNigiri(c.t) ? 'nigiri' : (E.isMaki(c.t) ? 'maki' : c.t);
      const target = $(`.grp[data-g="${g}"]`, this.groupsEl) || this.groupsEl;
      if (target.style) target.style.visibility = 'hidden';
      return fly(slotRects[i], target, cardDiv(c.t), 480, { scale: 0.45, arc: 20 }).then(() => {
        target.style.visibility = '';
        target.classList.add('pop');
        const gain = E.cardGain(prev, 0, c.t);
        // 寿司卷的「+N」只是现在的名次，回合结束前还会变：不飘分
        if (gain > 0 && i === 0 && !E.isMaki(c.t)) floatPts(target, '+' + gain);
      });
    });
    $$('.opp', this.oppsEl).forEach((o) => o.classList.add('pop'));
    await Promise.all(flights);
    this.lastChopRect = chopRect;
    await wait(250);
  }
  async chopReturnAnim(info, fromRect) {
    for (const pl of info.plays) {
      if (pl.chopsticks == null) continue;
      if (pl.p === 0) {
        const target = $(`.card[data-id="${pl.chopsticks}"]`, this.hand);
        const src = fromRect || this.lastChopRect;
        if (target && src) {
          target.style.visibility = 'hidden';
          await fly(src, target, cardDiv('chopsticks'), 600, { arc: 40, rot: -20 });
          target.style.visibility = '';
        }
      } else {
        const op = this.oppsEl.children[pl.p - 1];
        const plate = this.plateEl(pl.p);
        if (op && plate) await fly(op, plate, mini('chopsticks'), 450, { scale: 0.6 });
      }
    }
  }
  async handToPlate() {
    const plate = this.plateEl(0);
    const cards = $$('.card', this.hand);
    this.hand.style.minHeight = this.hand.offsetHeight + 'px'; // 传牌时手牌区不塌，避免页面跳动
    if (plate && cards.length && D(400) > 0) {
      const pr = plate.getBoundingClientRect();
      const fl = cards.map((c, i) => wait(i * 35).then(() => fly(c, pr, cardDiv('back'), 380, { scale: 0.25, arc: 0 })));
      cards.forEach((c) => (c.style.visibility = 'hidden'));
      await Promise.all(fl);
    }
    this.ui.handHidden = true;
    this.renderHand();
  }
  async beltMove(dir) {
    const st = this.state;
    const n = st.players.length;
    if (!this.g) this.layoutBelt();
    if (!this.g) return;
    const L = this.g.L;
    const starts = this.seatS.slice();
    const dists = starts.map((s, i) => {
      const tgt = starts[(i + dir + n) % n];
      return dir > 0 ? ((tgt - s + L) % L) : -((s - tgt + L) % L);
    });
    const avg = dists.reduce((a, d) => a + Math.abs(d), 0) / n * Math.sign(dir);
    const plates = $$('.plate', this.plates);
    const off0 = this.dashOff;
    await rafLoop(1150, (t) => {
      const e = easeInOut(t);
      plates.forEach((el) => {
        const p = +el.dataset.p;
        const [x, y] = this.pointAt(starts[p] + dists[p] * e);
        el.style.transform = `translate(${x}px,${y}px)`;
      });
      this.dash.style.strokeDashoffset = off0 - avg * e;
    });
    this.dashOff = off0 - avg;
  }
  async plateToHand() {
    const plate = this.plateEl(0);
    const cards = $$('.card', this.hand);
    if (!plate || !cards.length || D(400) <= 0) return;
    const pr = plate.getBoundingClientRect();
    await Promise.all(cards.map((c, i) => {
      const r = c.getBoundingClientRect();
      const dx = pr.left + pr.width / 2 - (r.left + r.width / 2);
      const dy = pr.top + pr.height / 2 - (r.top + r.height / 2);
      return anim(c, [{ transform: `translate(${dx}px,${dy}px) scale(.25)`, opacity: 0.3 }, { transform: 'translate(0,0) scale(1)', opacity: 1 }], 420, { delay: D(i * 40), fill: 'backwards' });
    }));
  }
}

// =====================================================================================================
// 弹窗（回合计分 / 最终结果 / 对手桌面）——不用 alert/confirm
// =====================================================================================================
const modal = $('#modal'), modalCard = $('#modal-card');
let modalOpts = {};
let lastFocus = null;
// 弹窗打开时页面主体 inert（键盘 Tab 只能在弹窗和顶栏之间走）；顶栏一直能用，弹窗从顶栏下面开始。
function setMainInert(on) {
  const m = $('main');
  if ('inert' in m) m.inert = on; else if (on) m.setAttribute('inert', ''); else m.removeAttribute('inert');
}
function openModal(html, opts) {
  if (modal.hidden) lastFocus = document.activeElement;
  opts = opts || {};
  // 回合计分 / 结果弹窗上面又要弹出别的（「← 大厅」的询问……）：先把计分弹窗停放，
  // 上面那个关掉（不管是点按钮、Esc 还是点空白）以后它自动回来——不会凭空消失
  const under = modal.hidden ? '' : modal.dataset.kind;
  if ((under === 'roundEnd' || under === 'gameOver') && opts.kind !== under) Game.setParked(under);
  modalOpts = opts;
  modalCard.innerHTML = html;
  modal.hidden = false;
  modal.dataset.kind = modalOpts.kind || 'info';
  modalCard.scrollTop = 0;
  setMainInert(true);
  Pause.hold = !!modalOpts.holdGame;
  Pause.check();
  TapGuard.arm('modal'); // 弹窗刚出现：连点的第二下不会点到弹窗里的按钮
  const f = $('[data-autofocus]', modalCard) || $('.btn.primary', modalCard) || $('button', modalCard);
  if (f) f.focus({ preventScroll: true });
}
// silent = 只是收起来（切标签页时把回合计分弹窗「停放」），不触发 onClose、不挪焦点
function closeModal(silent) {
  if (modal.hidden) return;
  modal.hidden = true;
  modalCard.innerHTML = '';
  const cb = modalOpts.onClose;
  modalOpts = {};
  modal.dataset.kind = '';
  setMainInert(false);
  if (Pause.hold) { Pause.hold = false; Pause.check(); }
  if (silent) return;
  TapGuard.arm(currentTab); // 弹窗刚关：连点的第二下不落到下面的页面上
  if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  if (cb) cb();
  Game.restoreSheet(); // 关掉的是盖在计分弹窗上面的询问：计分弹窗回来
}
modal.addEventListener('click', (e) => {
  if (e.target.closest('[data-close]')) { closeModal(); return; }
  if (e.target === modal && modalOpts.dismissable !== false) closeModal();
  const b = e.target.closest('[data-mact]');
  if (b && modalOpts.onAct) modalOpts.onAct(b.dataset.mact, b);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (!modal.hidden && modalOpts.dismissable !== false) closeModal();
    if (!$('#settings').hidden) toggleSettings(false);
  }
});

// 机器人「思考」计时：暂停时不出牌；回来以后各自再想一小会儿（不会一回来全部同时亮）
function botLater(ms, fn) {
  const go = () => {
    if (!Pause.on()) { fn(); return; }
    Pause.gate().then(() => { const d = (250 + Math.random() * 650) * kf(); if (d <= 0) go(); else setTimeout(go, d); });
  };
  const d = ms * kf();
  if (d <= 0) Promise.resolve().then(go); else setTimeout(go, d);
}

// =====================================================================================================
// 教练解说：一两句话，说清刚才发生了什么、为什么
// =====================================================================================================
function rankText(icons, p) {
  const mine = icons[p];
  if (!mine) return '还没有标记';
  const more = icons.filter((v, i) => i !== p && v > mine).length;
  const same = icons.filter((v, i) => i !== p && v === mine).length;
  if (more === 0 && !same) return '暂时最多';
  if (more === 0) return '和别人并列最多';
  return `暂列第${more + 1}${same ? '（并列）' : ''}`;
}
// 你这一轮打出的牌（没用筷子时）。left = 翻开以后你手里还剩几张 = 这回合还剩几轮；
// 0 = 刚才是这回合最后一张，回合马上结束（除了布丁，桌上的牌都会弃掉）。
function meSentence(prev, st, play) {
  const c = play.cards[0], t = c.t;
  const sb = E.summarize(prev.players[0].table);
  const me = st.players[0];
  const left = me.hand.length;
  const DP = E.DUMPLING_PTS;
  switch (t) {
    case 'tempura':
      if (sb.tempura % 2) return '你的天妇罗凑成一对：+5。';
      return left ? `你的天妇罗现在${sb.tempura + 1}张，还差1张才成对。` : `最后一张是天妇罗：单张没配对，0分。`;
    case 'sashimi': {
      const m = (sb.sashimi + 1) % 3;
      if (!m) return '你凑齐了3张刺身：+10！';
      if (!left) return `最后一张是刺身：你的刺身${m}/3，没凑齐，这${m}张0分。`;
      if (maxTakes(me, left) < 3 - m) return `你的刺身${m}/3，还差${3 - m}张——剩下的轮数不够凑齐了，这回合这${m}张拿不到分。`;
      return `你的刺身${m}/3，还差${3 - m}张，还剩${left}轮。`;
    }
    case 'dumpling': { const n = sb.dumpling + 1; return `你的煎饺${n}张 = ${DP[Math.min(5, n)]}分。`; }
    case 'maki1': case 'maki2': case 'maki3': {
      const icons = st.players.map((p) => E.summarize(p.table).makiIcons);
      if (left) return `你的寿司卷${icons[0]}个标记，${rankText(icons, 0)}。`;
      // 回合最后一张：名次已经定了，不再说「暂时」
      const more = icons.filter((v, i) => i && v > icons[0]).length, same = icons.filter((v, i) => i && v === icons[0]).length;
      const r = more ? `排第${more + 1}${same ? '（并列）' : ''}` : (same ? '并列最多' : '最多');
      return `你的寿司卷${icons[0]}个标记，${r}：这回合寿司卷得${E.roundPreview(st)[0].maki}分。`;
    }
    case 'salmon': case 'squid': case 'egg':
      return play.onWasabi[0] != null ? `你的${E.TYPES[t].name}放上了芥末：${E.nigiriValue(t)}×3 = ${E.nigiriValue(t) * 3}分！` : `${E.TYPES[t].name}+${E.nigiriValue(t)}。`;
    case 'wasabi':
      if (!left) return '最后一张是芥末：后面没有手握了，0分；芥末不会留到下一回合。';
      return '你的芥末在等手握：下一张手握×3。';
    case 'pudding': return `布丁留到游戏结束才算：你现在${E.puddingCount(me)}张。`;
    case 'chopsticks':
      if (!left) return '最后一张是筷子：这回合马上结束，它0分，也不会留到下一回合。';
      if (left < 2) return '筷子本身0分：下一轮你只剩1张，这回合用不上了。';
      return '筷子从下一轮起能用：点「用筷子」一轮拿2张。';
  }
  return '';
}
// 你手里有 鱿鱼/鲑鱼手握，而你要传给的人桌上有空着的 芥末：你不拿，它到他那里就 ×3
function feedWarning(st) {
  const n = st.players.length;
  const to = (E.passDir(st) + n) % n;
  if (!to || !E.summarize(st.players[to].table).wasabiOpen) return '';
  const hand = st.players[0].hand;
  const t = ['squid', 'salmon'].find((x) => hand.some((c) => c.t === x));
  if (!t || hand.length < 2) return '';
  return `注意：${st.players[to].name}有空着的芥末，你没拿的${E.TYPES[t].name}传过去，就是他的${E.nigiriValue(t) * 3}分。`;
}
// 第3回合开局：布丁 在这一回合定下来——告诉新手现在各几张、自己是不是最少
function puddingOpener(st) {
  const counts = st.players.map((p) => E.puddingCount(p));
  const mine = counts[0], max = Math.max.apply(null, counts), min = Math.min.apply(null, counts);
  const list = st.players.map((p, i) => `${p.name}${counts[i]}张`).join('、');
  let tip;
  if (st.players.length === 2) tip = max === min ? '2人局不扣分，现在一样多：谁多拿1张，谁+6。' : (mine === max ? '2人局不扣分，你现在多，保住就+6。' : '2人局不扣分，但对手现在比你多，他会+6。');
  else if (max === min) tip = '现在大家一样多：这回合多拿1张，就不会是最少的。';
  else if (mine === min) tip = '你现在<b>排最少</b>（游戏结束最少的−6），这回合看到布丁可以拿。';
  else if (mine === max) tip = '你现在最多（+6），别被人追上。';
  else tip = '你现在不是最少的，最少的要−6。';
  return `布丁现在：${list}。${tip}`;
}
// 游戏结束：输了就点出和冠军差得最多的那一类牌，给一条下一局能用的建议
function gameOverAdvice(st) {
  const R = st.result, me = st.players[0];
  if (R.winners.indexOf(0) >= 0) return (R.winners.length > 1 ? '并列获胜！' : '赢了！') + '真牌也是一模一样的玩法，可以上桌了。';
  const W = st.players[R.winners[0]];
  const d = W.total - me.total;
  if (d === 0) return `${W.name}和你同分，但布丁比你多，排在前面。下一局记得多拿1–2张布丁。`;
  const sum = (p, k) => p.rounds.reduce((a, r) => a + (r[k] || 0), 0);
  const rows = [['maki', '寿司卷'], ['tempura', '天妇罗'], ['sashimi', '刺身'], ['dumpling', '煎饺'], ['nigiri', '手握']]
    .map(([k, nm]) => ({ k, nm, a: sum(me, k), b: sum(W, k) }));
  rows.push({ k: 'pudding', nm: '布丁', a: me.puddingScore, b: W.puddingScore });
  rows.sort((x, y) => (y.b - y.a) - (x.b - x.a));
  const top = rows[0];
  const TIP = {
    maki: '盯住别人的寿司卷标记数：差一点就跟，差太多就放手',
    tempura: '天妇罗凑对很稳：手里已有1张时，看到第2张就拿',
    sashimi: '刺身只在剩下轮数够时才开，开了就盯着凑齐3张',
    dumpling: '煎饺越多越值钱，可以早点开始攒',
    nigiri: '早点拿芥末，留给后面的鱿鱼手握',
    pudding: '至少拿1–2张布丁保底，0张很可能−6',
  };
  return `${W.name}赢了，比你多${d}分。差得最多的是${top.nm}（你${top.a}分，${W.name}${top.b}分）。下一局${TIP[top.k]}。`;
}
function narrate(prev, st, info) {
  const S = [];
  const names = st.players.map((p) => p.name);
  const n = st.players.length;
  const me = info.plays[0];
  if (me.chopsticks != null) {
    const w = me.onWasabi.some((x) => x != null) ? '，手握放上了芥末' : '';
    S.push(`你用筷子拿了${me.cards.map((c) => nameOf(c.t)).join('和')}${w}；筷子放回手牌，跟着传给了${names[(info.dir + n) % n]}。`);
  } else S.push(meSentence(prev, st, me));
  const ev = [];
  info.plays.forEach((pl) => {
    if (!pl.p) return;
    const nm = names[pl.p];
    const sb = E.summarize(prev.players[pl.p].table);
    if (pl.chopsticks != null) ev.push([10, `${nm}喊了「Sushi Go!」，用筷子拿了${pl.cards.map((c) => nameOf(c.t)).join('和')}。`]);
    pl.cards.forEach((c, i) => {
      if (pl.onWasabi[i] != null) ev.push([8 + E.nigiriValue(c.t) / 10, `${nm}的${E.TYPES[c.t].name}放上了芥末：${E.nigiriValue(c.t) * 3}分。`]);
      if (c.t === 'sashimi' && (sb.sashimi + 1) % 3 === 0) ev.push([7, `${nm}凑齐了3张刺身（+10）。`]);
      if (c.t === 'wasabi' && st.players[pl.p].hand.length > 0) ev.push([4, `${nm}拿了芥末——他下一张手握会×3${pl.p === (info.dir + n) % n ? '，而你的手牌正要传给他' : ''}。`]);
      if (c.t === 'pudding' && st.round === 3) ev.push([3.5, `${nm}在第3回合拿布丁（现在${E.puddingCount(st.players[pl.p])}张）——游戏结束要比布丁。`]);
      if (c.t === 'tempura' && sb.tempura % 2 === 1) ev.push([2, `${nm}的天妇罗成对（+5）。`]);
    });
  });
  const ib = prev.players.map((p) => E.summarize(p.table).makiIcons);
  const ia = st.players.map((p) => E.summarize(p.table).makiIcons);
  const maxA = Math.max.apply(null, ia), maxB = Math.max.apply(null, ib);
  const leadA = ia.map((v, i) => (v === maxA && v > 0 ? i : -1)).filter((i) => i >= 0);
  const leadB = ib.map((v, i) => (v === maxB && v > 0 ? i : -1)).filter((i) => i >= 0);
  if (maxA > 0 && leadA.join() !== leadB.join() && leadA.length === 1 && leadA[0] !== 0) ev.push([5, `寿司卷现在${names[leadA[0]]}领先（${maxA}个标记）。`]);
  ev.sort((a, b) => b[0] - a[0]);
  if (ev.length) S.push(ev[0][1]);
  return S.join('');
}

// =====================================================================================================
// 实战
// =====================================================================================================
const Game = {
  view: null, st: null, gen: 0, coachOn: true, cfg: null, resolving: false, lastFrom: null, pickingAnim: false,
  parked: null, wasFirstGame: false,
  init() {
    this.newView();
    const played = store.get('gamesPlayed', 0);
    const saved = store.get('setup', null);
    this.cfg = { n: saved && saved.n >= 2 && saved.n <= 5 ? saved.n : 4, alt: !!(saved && saved.alt), coach: played === 0 ? true : !!(saved ? saved.coach : false) };
    this.syncSetup();
    $('#np-seg').addEventListener('click', (e) => { const b = e.target.closest('[data-n]'); if (!b) return; this.cfg.n = +b.dataset.n; this.syncSetup(); });
    $('#opt-coach').addEventListener('click', () => { this.cfg.coach = !this.cfg.coach; this.syncSetup(); });
    $('#opt-alt').addEventListener('click', () => { this.cfg.alt = !this.cfg.alt; this.syncSetup(); });
    $('#start-btn').addEventListener('click', () => this.start());
    $('#g-coach').addEventListener('click', () => { this.coachOn = !this.coachOn; this.syncCoach(); this.updateActions(); });
    $('#g-quit').addEventListener('click', () => { $('#g-confirm').hidden = false; $('#g-quit-no').focus(); });
    $('#g-quit-no').addEventListener('click', () => { $('#g-confirm').hidden = true; });
    $('#g-quit-yes').addEventListener('click', () => { $('#g-confirm').hidden = true; this.quit(); });
    this.initLeave();
  },
  // 每一局一张新桌子：旧一局还在跑的动画只会动已经拆掉的旧桌子，不会把旧牌画回新的一局
  newView() {
    if (this.view) this.view.destroy();
    this.view = new TableView($('#g-stage'));
    this.view.handler = (a, d, el) => this.onAct(a, d, el);
  },
  inProgress() { return !!this.st && this.st.phase !== 'gameOver'; },
  // 开新局 / 回到设置：作废旧一局所有还没跑完的异步流程（gen），清掉「正在结算/正在出牌」的标志
  reset() {
    this.gen++;
    this.resolving = false; this.pickingAnim = false;
    this.setParked(null);
    closeModal(true);
    this.newView();
    TapGuard.arm('play');
  },
  syncSetup() {
    $$('#np-seg [data-n]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.n === this.cfg.n)));
    $('#opt-coach').setAttribute('aria-checked', String(this.cfg.coach));
    $('#opt-alt').setAttribute('aria-checked', String(this.cfg.alt));
    const names = ['你'].concat(E.BOT_NAMES).slice(0, this.cfg.n);
    $('#who-list').innerHTML = names.map((nm, i) => `<span><i class="pdot" style="--pc:${PCOL[i]}"></i>${nm}</span>`).join('');
    $('#np-hint').textContent = `${this.cfg.n}人局：每回合每人${E.HAND_SIZE[this.cfg.n]}张手牌，共${E.HAND_SIZE[this.cfg.n]}轮。`;
    store.set('setup', this.cfg);
  },
  syncCoach() {
    $('#g-coach').setAttribute('aria-pressed', String(this.coachOn));
    $('#g-coach').innerHTML = '<span class="hide-s">教练</span>解说：' + (this.coachOn ? '开' : '关');
    $('#g-coach').setAttribute('aria-label', '教练解说：' + (this.coachOn ? '开' : '关'));
    $('#g-coachbox').hidden = !this.coachOn;
  },
  say(html) { $('#g-say').innerHTML = html; },
  showSetup() {
    this.reset();
    $('#setup').hidden = false; $('#game').hidden = true; $('#g-confirm').hidden = true;
    this.st = null;
  },
  quit() { this.showSetup(); },
  start(opts) {
    opts = Object.assign({}, this.cfg, opts || {});
    this.reset();
    this.coachOn = !!opts.coach;
    this.syncCoach();
    this.st = E.newGame({ players: opts.n, alternate: opts.alt, seed: opts.seed != null ? opts.seed : undefined });
    this.lastFrom = null;
    $('#setup').hidden = true; $('#game').hidden = false; $('#g-confirm').hidden = true;

  // ---------------- 回合计分 / 结果弹窗只在「实战」页出现：切走时先收起来，回来再打开 ----------------
  setParked(kind) {

  // 标签上的小点 = 实战里有计分 / 结果弹窗还没看；人就在实战页上（弹窗只是被询问盖住）时不亮
  syncParkDot() {

  },
  // 停放的计分 / 结果弹窗该回来了吗：人在实战页上、上面没有别的弹窗
  restoreSheet() {
    if (this.parked && currentTab === 'play' && modal.hidden) this.unpark();
  },
  // 计分 / 结果弹窗现在不能打开：不在实战页，或者「← 大厅」/「继续这一局」的询问正开着（它关掉后再打开）
  sheetBlocked() {

  },
  park(kind) {

  },
  unpark() {

    else if (k === 'gameOver' && this.st.phase === 'gameOver') this.showGameOver();
  },
  // 从教程回到实战时，正在打的一局不会被悄悄丢掉：在页面里问一句
  askResume() {
    const st = this.st;
    const where = st.phase === 'roundEnd' ? `第${st.round}回合刚打完` : `第${st.round}回合·第${st.turn}/${st.handSize}轮`;
    openModal(`<h2 id="modal-title">你有一局还没打完</h2>
      <p class="sub">${where}，你现在${st.players[0].total}分。接着打这一局，还是放弃它？</p>
      <div class="acts"><button class="btn" data-mact="new">放弃这局，回到设置</button><button class="btn primary big" data-mact="resume" data-autofocus>继续这一局</button></div>`,
    { kind: 'resume', holdGame: true, onClose: () => { if (this.parked) this.unpark(); }, onAct: (a) => {
      if (a === 'resume') closeModal();
      else if (a === 'new') { modalOpts.onClose = null; this.showSetup(); }
    } });
  },
  // 「← 大厅」：一局打到一半时先问一句（网页不保存进度）
  initLeave() {
    const link = $('#back-link');
    let leaving = false;
    link.addEventListener('click', (e) => {
      if (leaving || !this.inProgress()) return;
      e.preventDefault();
      openModal(`<h2 id="modal-title">这一局还没打完</h2>
        <p class="sub">回大厅会丢掉这一局（网页不保存进度）。</p>
        <div class="acts"><button class="btn" data-mact="leave">回大厅</button><button class="btn primary big" data-close data-autofocus>继续玩</button></div>`,
      { kind: 'leave', holdGame: true, onAct: (a) => { if (a === 'leave') { leaving = true; closeModal(true); link.click(); } } });
      // 「继续玩」/ Esc / 点空白：closeModal() 会把被盖住的计分弹窗请回来（openModal 里先停放了它）
    });
    // 回了大厅又按浏览器「返回」（页面从缓存里原样恢复）：询问照常弹，停放的计分弹窗也回来
    window.addEventListener('pageshow', (e) => { if (!e.persisted) return; leaving = false; this.restoreSheet(); });
  },
  updateStatus() {
    const st = this.st;
    if (!st) return;
    const turnTxt = st.phase === 'pick' ? ` · 第<span class="num">${st.turn}</span>/<span class="num">${st.handSize}</span>轮` : '';
    $('#g-status').innerHTML = `回合<span class="num">${Math.min(st.round, 3)}</span>/3${turnTxt}`;
  },
  dirText() {
    const st = this.st, n = st.players.length;
    const d = E.passDir(st);
    return `<span class="dir">传给${d > 0 ? '左边' : '右边'}：${esc(st.players[(d + n) % n].name)} ${d > 0 ? '↻' : '↺'}</span>`;
  },
  startTurn(first) {
    const st = this.st, gen = this.gen, v = this.view;
    const ui = TableView.freshUI();
    ui.handFrom = this.lastFrom;
    if (st.turn === 1) ui.msg = `第<b>${st.round}</b>回合 · 选1张牌<br>${this.dirText()}`;
    else ui.msg = `你收到<b>${esc(st.players[this.lastFrom].name)}</b>的手牌<br>${this.dirText()}`;
    for (let p = 1; p < st.players.length; p++) {
      ui.opp[p] = 'thinking';
      const delay = 500 + Math.random() * 1200 + p * 150;
      botLater(delay, () => {
        if (gen !== this.gen || !this.st || this.st.phase !== 'pick' || this.st.players[p].pick) return;
        E.setPick(st, p, E.botPick(st, p));
        ui.opp[p] = 'ready';
        v.renderOpps(); v.renderPlates();
        this.maybeResolve();
      });
    }
    v.render(st, ui);
    this.updateStatus();
    this.updateActions();
    // 新一回合的手牌刚出现（紧跟在「开始第N回合」「再来一局」这类点按后面）：上一下连点不会点到新牌上。
    // 回合中途的新手牌是自动传来的，前面没有你的点按可连——不挡，牌一落定就能点
    if (st.turn === 1) TapGuard.arm('play');
    this.ensureHandVisible();
    if (st.players[0].hand.length === 1) {
      ui.handLocked = true;
      ui.abText = '最后1张：直接打出。';
      v.renderHand(); v.renderActions();
      if (this.coachOn && !first) {
        // 接在上一轮的解说后面，别把它冲掉
        const before = $('#g-say').innerHTML;
        this.say((before ? before + '<br>' : '') + '传到你手里只剩1张了：最后一张直接打出，不用选。');
      }
      gwait(800).then(async () => {
        if (gen !== this.gen) return;
        const id = st.players[0].hand[0].id;
        E.setPick(st, 0, [id]);
        this.pickingAnim = true;
        await v.pickDown([id]);
        if (gen !== this.gen) return; // 旧一局：标志已经在 reset() 里清过，别去动新一局的
        this.pickingAnim = false;
        this.maybeResolve();
      });
    }
  },
  // minimal = 只往下挪到刚好露出最后一排（选牌、用筷子时操作条变高），不跳回去看对手
  ensureHandVisible(instant, minimal) {
    // 手机上：轮到你时，整手牌都要在（吸顶的状态条+教练）和（吸底的操作条）之间。
    // 放得下就把对手和传送带也留在屏幕上；放不下就让它们滑到上面，手牌优先。
    if (window.innerWidth >= 720 || currentTab !== 'play' || !this.st) return;
    const v = this.view;
    const cards = $$('.hand .card', v.el);
    if (!cards.length) return;
    const topEdge = $('.topbar').offsetHeight + $('.gsticky').offsetHeight;
    const bottomEdge = window.innerHeight - $('.actionbar', v.el).offsetHeight;
    const handTop = $('.hand-head', v.el).getBoundingClientRect().top - 4;
    const handBottom = cards[cards.length - 1].getBoundingClientRect().bottom + 8;
    let dy;
    if (minimal) {
      if (handBottom <= bottomEdge) return;                            // 只管底下被盖住的情况
      dy = Math.min(handBottom - bottomEdge, Math.max(0, handTop - topEdge));
    } else {
      // 每轮开始：手牌少了以后，把滑上去的对手再拉回来（回合后半段对手桌面很重要）
      dy = v.oppsEl.getBoundingClientRect().top - topEdge - 6;         // 理想：对手+传送带+手牌一屏
      if (handBottom - dy > bottomEdge) dy = handBottom - bottomEdge;  // 放不下：手牌最后一排要露出来
      if (handTop - dy < topEdge) dy = handTop - topEdge;              // 手牌比屏幕还高：至少从第一排开始
      if (Math.abs(dy) < 16 && handTop >= topEdge && handBottom <= bottomEdge) return;
    }
    if (Math.abs(dy) < 2) return;
    window.scrollTo({ top: Math.max(0, window.scrollY + dy), behavior: instant || D(300) <= 0 ? 'auto' : 'smooth' });
  },
  updateActions() {
    const st = this.st, v = this.view, ui = v.ui;
    if (!st || st.phase !== 'pick') return;
    const me = st.players[0];
    if (me.pick) {
      ui.actions = [];
      ui.abText = E.allPicked(st) ? '大家都选好了……' : '你选好了，等其他人……';
      v.renderActions();
      return;
    }
    if (me.hand.length === 1) return;
    const canChop = E.canUseChopsticks(st, 0);
    if (!canChop) ui.chopMode = false;
    const need = ui.chopMode ? 2 : 1;
    const acts = [];
    if (canChop) acts.push({ act: 'chop', label: ui.chopMode ? '不用筷子' : '用筷子', cls: ui.chopMode ? '' : 'green' });
    acts.push({ act: 'go', label: ui.chopMode ? 'Sushi Go! 出2张' : '出这张', cls: 'primary', disabled: ui.selected.length !== need });
    ui.actions = acts;
    const sel = ui.selected.map((id) => me.hand.find((c) => c.id === id)).filter(Boolean);
    let txt = '';
    if (ui.chopMode) {
      txt = sel.length ? `筷子：${sel.map((c, i) => `${i + 1}. ${nameOf(c.t)}`).join('，')}${sel.length < 2 ? '，再选1张' : ''}` : '用筷子：按顺序选2张（先选的先放到桌上）';
      if (this.coachOn && sel.length === 2) {
        if (sel[0].t === 'wasabi' && E.isNigiri(sel[1].t)) txt += '。先芥末后手握→手握×3！';
        // 顺序反了：手握先放下，这张芥末接不住它（除非桌上本来就有空着的芥末）
        else if (E.isNigiri(sel[0].t) && sel[1].t === 'wasabi' && !E.summarize(me.table).wasabiOpen) {

  onAct(act, d) {
    const st = this.st, v = this.view, ui = v.ui;
    if (!st || st.phase !== 'pick' || st.players[0].pick) return;
    if (act === 'card') {
      const id = +d.id;
      const i = ui.selected.indexOf(id);
      if (ui.chopMode) {
        if (i >= 0) ui.selected.splice(i, 1);
        else if (ui.selected.length < 2) ui.selected.push(id);
        else ui.selected = [ui.selected[0], id];
      } else {
        ui.selected = i >= 0 ? [] : [id];
      }
      v.renderHand(); this.updateActions();
      this.ensureHandVisible(true, true); // 提示文字变长、操作条变高时，最后一排手牌也别被盖住
    } else if (act === 'chop') {
      ui.chopMode = !ui.chopMode;
      if (!ui.chopMode) ui.selected = ui.selected.slice(0, 1);
      TapGuard.armAct('chop'); // 「用筷子」原地变成「不用筷子」：连点第二下不会马上又取消（只挡这个按钮，紧接着点牌照常算）
      v.renderHand(); this.updateActions();
      this.ensureHandVisible(true, true); // 窄屏上操作条变高了一行：别让它盖住最后一排手牌
    } else if (act === 'go') {
      const need = ui.chopMode ? 2 : 1;
      if (ui.selected.length !== need) return;
      this.humanPick(ui.selected.slice());
    }
  },
  async humanPick(ids) {
    const st = this.st, v = this.view, gen = this.gen;
    const goBtn = $('[data-act="go"]', v.abBtns);
    const goRect = goBtn ? goBtn.getBoundingClientRect() : null;
    E.setPick(st, 0, ids);
    v.ui.actions = []; v.ui.chopMode = false; v.renderActions();
    v.busy = true; this.pickingAnim = true;
    if (ids.length === 2) shout(goRect || v.abBtns, 'Sushi Go!', 1100, 'play');
    await v.pickDown(ids);
    if (gen !== this.gen) return;

  },
  maybeResolve() {
    const st = this.st;
    if (!st || this.resolving || st.phase !== 'pick' || !E.allPicked(st)) return;
    if (this.pickingAnim || this.view.ui.slot == null) return; // 你的牌还在飞
    this.resolveTurn();
  },
  // 每个动画阶段之后都：① 看这局还是不是同一局（gen）② 如果切到别的标签页了就停在这里等回来
  async resolveTurn() {
    const st = this.st, gen = this.gen, v = this.view;
    const alive = () => gen === this.gen;
    this.resolving = true; v.busy = true;
    v.ui.actions = []; v.ui.abText = '大家一起翻开……'; v.ui.handLocked = true; v.renderActions();
    await gwait(300);
    if (!alive()) return;
    const prev = E.clone(st);
    const info = E.resolvePicks(st);
    v.ui.msg = '大家一起翻开！';
    if (info.plays[0].chopsticks != null) v.ui.handTags = { [info.plays[0].chopsticks]: '要传出' };
    await v.revealAnim(prev, st, info);
    await Pause.gate();
    if (!alive()) return;
    if (this.coachOn) this.say(narrate(prev, st, info));
    if (info.plays.some((p) => p.chopsticks != null)) {
      v.ui.msg = '用过的筷子放回手牌';
      v.msgEl.innerHTML = v.ui.msg;
      if (info.plays[0].chopsticks != null) this.ensureHandVisible(true, true); // 让你看见筷子飞回手牌
      await v.chopReturnAnim(info);
      if (!alive()) return;
      await gwait(400);
      if (!alive()) return;
    }
    const roundOver = st.players.every((p) => p.hand.length === 0);
    if (roundOver) {
      E.passHands(st);
      v.ui.msg = `第<b>${st.round}</b>回合结束！`;
      v.ui.handEmptyText = '这一回合的手牌出完了。';
      v.ui.abText = `第${st.round}回合结束：看计分。`; // 计分弹窗后面的操作条别还写着「大家一起翻开……」
      v.render(st);
      this.updateStatus();
      await gwait(900);
      if (!alive()) return;
      this.resolving = false; v.busy = false;
      this.showRoundEnd();
      return;
    }
    const n = st.players.length, dir = info.dir;
    v.ui.msg = `把剩下的手牌传给${dir > 0 ? '左边' : '右边'}的<b>${esc(st.players[(dir + n) % n].name)}</b>`;
    v.msgEl.innerHTML = v.ui.msg;
    v.ui.abText = '传送带转动中……'; v.renderActions();
    await gwait(250);
    if (!alive()) return;
    await v.handToPlate();
    await Pause.gate();
    if (!alive()) return;
    E.passHands(st);
    await v.beltMove(dir);
    await Pause.gate();
    if (!alive()) return;
    this.lastFrom = st.last.from[0];
    this.resolving = false; v.busy = false;
    this.startTurn();
    await v.plateToHand();
  },
  showRoundEnd() {

    const rows = res.map((r, i) => `<tr class="${i === 0 ? 'me' : ''}"><td class="nm">${esc(st.players[i].name)}</td>` +

      `<td><span class="num">${r.sashimi}</span><small>${r.sashimiCount}张</small></td>` +

    { kind: 'roundEnd', dismissable: false, onAct: (a) => { if (a === 'next-round' && gen === this.gen) this.nextRound(); } });

  nextRound() {
    const st = this.st;
    closeModal();

      else this.say(`第${st.round}回合：每人从抽牌堆再摸${st.handSize}张（抽牌堆不重新洗）。桌上只留下了布丁。${alt}`);

  // 一局结束只记一次（弹窗可能因为切标签页被收起再打开，打开几次都不重复记）
  recordResult() {
    const st = this.st;
    const played = store.get('gamesPlayed', 0);
    store.set('gamesPlayed', played + 1);
    this.wasFirstGame = played === 0;
    if (played === 0) store.set('setup', Object.assign({}, this.cfg, { coach: false })); // 教练解说只在第一局默认打开
    this.updateStatus();

  showGameOver() {
    if (this.sheetBlocked()) { this.park('gameOver'); return; }
    const st = this.st, gen = this.gen;
    const firstGame = this.wasFirstGame;
    const R = st.result;
    const winNames = R.winners.map((i) => st.players[i].name);
    const iWin = R.winners.indexOf(0) >= 0;
    let wt;
    if (iWin && R.winners.length === 1) wt = '恭喜你赢得了游戏！<br>我们去吃点甜点庆祝一下吧！';
    else if (iWin) wt = `你和${winNames.filter((x) => x !== '你').join('、')}并列获胜！`;
    else wt = `${winNames.join('、')}赢了！<br>再来一局，你会更熟练。`;
    const counts = st.players.map((p) => p.puddings.length);
    const pudLine = st.players.map((p, i) => `${p.name}${counts[i]}张 → <b>${signed(p.puddingScore)}</b>`).join('，');
    let pudNote = '';
    if (Math.max.apply(null, counts) === Math.min.apply(null, counts)) pudNote = '所有人布丁一样多，谁都不得分。';
    else if (st.players.length === 2) pudNote = '2人游戏不扣分，只有最多的+6。';
    else pudNote = '最多的+6，最少的−6（并列就平分，0张也算最少）。';
    // 同分：每一组总分相同的人都解释一下名次怎么来的（不只第一名）
    const byTotal = {};
    R.rows.forEach((r) => { (byTotal[r.total] = byTotal[r.total] || []).push(r); });
    const tieLines = Object.keys(byTotal).map((k) => byTotal[k]).filter((g) => g.length > 1)
      .sort((a, b) => b[0].total - a[0].total).map((g) => {
        const nm = g.map((r) => st.players[r.p].name);
        const who = nm.length > 2 ? nm.slice(0, -1).join('、') + '和' + nm[nm.length - 1] : nm.join('和');
        if (g.every((r) => r.puddings === g[0].puddings)) {
          return `<li><b>同分</b>：${who}都是${g[0].total}分，布丁也一样多（各${g[0].puddings}张），${g[0].rank === 1 ? '并列获胜（说明书没写这种情况，这里按官方规则）' : '名次并列'}。</li>`;
        }
        return `<li><b>同分</b>：${who}都是${g[0].total}分，比布丁（${g.map((r) => `${st.players[r.p].name}${r.puddings}张`).join('、')}），布丁多的排前面。</li>`;
      }).join('');
    const rows = R.rows.map((r) => {
      const p = st.players[r.p];
      return `<tr class="${r.p === 0 ? 'me' : ''} ${r.rank === 1 ? 'win' : ''}"><td><span class="num">${r.rank}</span></td><td class="nm">${esc(p.name)}</td>` +
        p.rounds.map((x) => `<td><span class="num">${x.total}</span></td>`).join('') +
        `<td><span class="num">${signed(p.puddingScore)}</span><small>${p.puddings.length}张</small></td><td class="tot">${p.total}</td></tr>`;
    }).join('');
    openModal(`<h2 id="modal-title">游戏结束</h2>
      <div class="winner"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#a-pudding"/></svg><div class="wt">${wt}</div></div>
      <table class="score-table"><thead><tr><th>名次</th><th></th><th>回合1</th><th>回合2</th><th>回合3</th><th>${mini('pudding')}布丁</th><th>总分</th></tr></thead><tbody>${rows}</tbody></table>
      <ul class="explain"><li><b>布丁</b>：${pudLine}。${pudNote}</li>${tieLines}<li>剩下的抽牌堆（${st.removed.length}张）移出游戏。</li></ul>
      <div class="acts"><button class="btn" data-mact="setup">改设置</button><button class="btn primary big" data-mact="again" data-act="again">再来一局</button></div>`,
    { kind: 'gameOver', dismissable: false, onAct: (a) => {
      if (gen !== this.gen) return;
      if (a === 'again') { closeModal(); this.start({ coach: this.coachOn }); }
      if (a === 'setup') { this.cfg.coach = firstGame ? false : this.coachOn; this.syncSetup(); this.showSetup(); }
    } });
    this.updateStatus();
  },
};

function barsHTML(rows, o) {
  o = o || {};
  const max = o.max || Math.max(1, ...rows.map((r) => r.val));
  return `<div class="bars">${rows.map((r) => {

      `<span class="bp ${r.pts > 0 ? 'pos' : r.pts < 0 ? 'neg' : ''}">${pts}</span></div>`;
  }).join('')}</div>`;
}
function quiz(opts) { return opts.map(([t, ok, why]) => ({ t, ok, why })); }
// 测验选项按「课+步骤」固定打乱：正确答案不总在第一个；同一题每次顺序一样，按钮的 data-i 仍是原来的序号（QA 用它找答案）
function seededOrder(key, n) {
  let a = 0;
  key = 'sushi' + key;
  for (let i = 0; i < key.length; i++) a = (Math.imul(a, 31) + key.charCodeAt(i)) | 0;
  const rnd = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const o = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
  return o;
}
